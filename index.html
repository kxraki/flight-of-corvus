  else if(v.type===1){ctx.strokeStyle="#2C2352";ctx.beginPath();ctx.ellipse(0,0,72,20,0,0,7);ctx.stroke();
   ctx.fillStyle="rgba(255,205,140,.6)";ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill()}
  else if(v.type===2){ctx.strokeStyle="rgba(95,200,255,.5)";ctx.lineWidth=2;
   for(let arm=0;arm<2;arm++){ctx.beginPath();for(let t=0;t<=1;t+=.02){const ang=t*3.2*Math.PI+arm*Math.PI,rr=10+t*66;
    const x=rr*Math.cos(ang),y=rr*Math.sin(ang)*.55;t?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
   ctx.fillStyle="rgba(255,205,140,.75)";ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill()}
  else{ctx.fillStyle="rgba(95,200,255,.5)";for(let i=0;i<9;i++){const a=i*1.9,rr=14+((i*37)%30);
   ctx.beginPath();ctx.arc(rr*Math.cos(a),rr*Math.sin(a)*.7,9+((i*13)%9),0,7);ctx.fill()}}
  ctx.restore();
  lbl(ctx,cx,h-14,names[v.type],"#A79FD4")},
 read(v){const t=["Old, red stars, little to no gas, smooth featureless light — e.g. M87, M32.",
  "A disk and bulge but gas-starved: no arms, no new stars — a transitional shape between spiral and elliptical.",
  "Gas-rich disk, ongoing star formation in the arms — the Milky Way (Session 54) and Andromeda (M31) are both here.",
  "No defined symmetry at all — often the result of a close gravitational encounter. The Magellanic Clouds are examples."][v.type];
  return t+` <em>Local Group members of every one of these types sit within about 3 Mpc of us.</em>`}},

gal_hubble:{ctrls:[{id:"d",label:"Distance to the galaxy",min:1,max:1000,step:1,val:100,unit:" Mpc"}],
 draw(ctx,w,h,v){const L=48,R=w-16,B=h-28,T0=16,dmax=1000,vmax=73*dmax;
  axis(ctx,L,B,R,B);axis(ctx,L,B,L,T0);
  const X=d=>L+(d/dmax)*(R-L),Y=vv=>B-(vv/vmax)*(B-T0);
  ctx.fillStyle="rgba(169,114,255,.14)";ctx.beginPath();
  ctx.moveTo(X(0),Y(0));ctx.lineTo(X(dmax),Y(73*dmax));ctx.lineTo(X(dmax),Y(67*dmax));ctx.lineTo(X(0),Y(0));ctx.fill();
  ctx.strokeStyle="#A972FF";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(dmax),Y(70*dmax));ctx.stroke();
  const vv=70*v.d;ctx.fillStyle="#5FC8FF";ctx.beginPath();ctx.arc(X(v.d),Y(vv),4.4,0,7);ctx.fill();
  lbl(ctx,w/2,B+16,"distance →","#6E6699");
  ctx.save();ctx.translate(14,(B+T0)/2);ctx.rotate(-Math.PI/2);lbl(ctx,0,0,"recession velocity →");ctx.restore();
  v._v70=vv;v._vlo=67*v.d;v._vhi=73*v.d},
 read(v){return `d = <b>${v.d} Mpc</b> → v ≈ <b>${(v._v70||0).toFixed(0)} km/s</b> (band: ${(v._vlo||0).toFixed(0)}–${(v._vhi||0).toFixed(0)} km/s across the H₀ range)<br>`+
  `<em>The slope of this line is a single number — and the whole of Session 60 is an argument about exactly what that number is.</em>`}}

};

const SESSIONS_ACT5 = [

{n:49,title:"Weighing a pair of stars",ioaa:"Ch. 7 — Binaries &amp; Variables",tool:null,
 hook:"Every mass you've met so far came from a single star sitting still. A binary hands you something better: two masses, locked in a dance you can actually time.",
 q:"Kepler's third law, generalised to a binary system, replaces the Sun's mass with:",
 opts:["Nothing — it's unchanged","The heavier star's mass alone","The sum of both stars' masses","The product of both stars' masses"],truth:2,sim:"gal_binmass",
 notice:"Push the mass ratio to 1 — equal masses straddle the centre of mass symmetrically. Then push it toward 5 and watch the heavier star hug the centre.",
 law:{name:"Kepler's third law, generalised",eq:"G(m₁ + m₂)  =  4π²a³ / P²",
  terms:[["a","the average separation between the two stars — a₁+a₂, where each aᵢ is that star's own orbit around the shared centre of mass."],
         ["P","the orbital period — the same for both stars, since they complete one lap together."],
         ["m₁+m₂","the combined mass. <b>Not the Sun's mass any more</b> — that was only ever a good approximation because a planet is negligible next to it."],
         ["a₁m₁ = a₂m₂","the lever-arm balance that pins each star's individual orbit size to its share of the total mass."]],
  why:["For a planet around the Sun, Kepler's third law reads GM_Sun = 4π²a³/P² — because the planet's own mass is so small it never shows up. But a binary star has no negligible partner: both masses matter, sometimes comparably.",
       "The fix is the one Newton's gravity already demands: both stars orbit their common centre of mass, and the force holding each one in its orbit depends on the <em>other</em> star's mass too. Work through the two-body problem properly and the Sun's mass in Kepler's formula is simply replaced by the sum m₁+m₂ — the one number that sets the shared orbit's size and period.",
       "Each star's individual orbit is smaller if it's heavier: a₁m₁ = a₂m₂, so the heavy star swings on a short leash and the light one on a long one, exactly balanced about the centre of mass. Add the two orbits together and you recover a, the full separation.",
       "This is what makes binaries so valuable: measure a and P — geometry and a stopwatch — and you get m₁+m₂ directly, no assumptions about composition or age required. Split it further using the a₁m₁=a₂m₂ ratio and you have both masses separately.",
       "A binary 10 pc away with a 100-year period and a 40 AU average separation (using the same arcsecond-to-AU conversion Act I Session 4 used for parallax: 1″ at 10 pc is 10 AU) gives a total mass of 40³/100² = 6.4 M☉. Split 3:1 by the orbit-size ratio, that's <b>4.8 M☉ and 1.6 M☉</b> — two stellar masses, measured without ever touching either star."]},
 fact:{body:["Nearly every stellar mass ever measured — the numbers behind every mass-luminosity relation, every stellar-evolution model — traces back to a binary orbit like this one. A single, isolated star's mass can only be estimated indirectly, from its luminosity and colour; a binary's mass can be weighed directly.",
  "That matters because binaries are not rare. More than half of all sun-like stars are thought to have at least one stellar companion — pairs and multiples may outnumber true loners.",
  "Sirius, the brightest star in the night sky, is one: Sirius A and the white dwarf Sirius B orbit each other roughly every 50 years, and their mutual gravity is how Sirius B's mass was pinned down long before anyone could resolve it as a distinct point of light."]},
 drill:{q:"A binary system 20 pc away has an angular separation of 2.0″ and an orbital period of 50 years. Its total mass is closest to:",opts:["6.4 M☉","25.6 M☉","1.6 M☉","102 M☉"],truth:1},
 prompt:"You just weighed two stars you'll never visit, using nothing but an angle and a stopwatch. What other measurements in this app have pulled off the same trick?"},

{n:50,title:"Seeing double",ioaa:"Ch. 7 — Binaries &amp; Variables",tool:null,
 hook:"Point a telescope at a close pair of stars and the sky offers no guarantee they have anything to do with each other.",
 q:"A 'visual double star' is best described as:",
 opts:["Two stars that orbit each other, always resolved separately","Two stars that appear close together in the sky, whether or not they're actually related","A single star that looks doubled due to a telescope defect","Any binary detected only through spectral lines"],truth:1,sim:"gal_doubles",
 notice:"Set the depth difference near zero, then push it out to 200 pc. Notice the sky view never changes — only the 'true' panel tells you the truth.",
 law:{name:"Visual double → visual binary → spectroscopic binary",eq:"same direction  ≠  same distance  ≠  same orbit",
  terms:[["visual double star","any two stars resolved as separate points that happen to sit in nearly the same direction from Earth — no claim about distance."],
         ["visual binary","a visual double confirmed to be gravitationally bound, usually by watching the two trace out a shared orbit over years or decades."],
         ["spectroscopic binary","a pair too close to resolve as two points at all — caught instead by their blended spectral lines splitting and rejoining periodically."],
         ["the giveaway","in a spectroscopic binary, one star's lines redshift while the other's blueshift, then they swap — Act I Session 9's Doppler shift, doubled."]],
  why:["A telescope collapses three dimensions onto two. Distance along the line of sight simply vanishes from the image — two stars 5 pc apart and two stars 500 ly apart can land on the very same pixel, purely by chance, if their directions happen to line up.",
       "Given how many faint background stars fill any patch of sky, such chance alignments are not rare. So 'visual double' is deliberately a modest claim: it says only that two stars are close together as seen, nothing about whether gravity has anything to do with it.",
       "Confirming a true binary takes evidence depth alone can't give: either measure both stars' distances independently (parallax, Act I Session 4) and find them equal, or — more convincingly — watch the pair for years and see one curve around the other, tracing Session 49's shared orbit.",
       "When the two stars are too close together to separate at all, a third signature takes over. As each star swings through its orbit, one moves toward us while the other moves away; their spectral lines shift oppositely and periodically split apart, then merge, then split again. No image is needed — the spectrum alone proves the orbit."]},
 fact:{body:["Friedrich Bessel deduced that Sirius had an unseen companion in 1844 — sixteen years before anyone actually saw it — purely from the way Sirius A's own path across the sky wobbled instead of running straight. The gravity of an invisible object was the only evidence he had, and it was enough.",
  "Sirius B was finally glimpsed in 1862, and turned out to be something stranger than expected: a white dwarf, packing roughly the Sun's mass into a star barely larger than Earth (about 0.017 R☉, worked out from its magnitude being 10 fainter than Sirius A's at the same assumed temperature) — the kind of object that sits at the bottom-left of the HR diagram from Act I Session 12.",
  "That kind of astrometric wobble — inferring an unseen mass from how it tugs on something visible — is the exact same logic used today to find exoplanets, and it's the logic behind Session 58's weighing of the black hole at our galaxy's centre."]},
 drill:{q:"Two stars appear 3″ apart. Careful parallax gives one a distance of 40 pc and the other 400 pc. They are:",opts:["Certainly a visual binary","Almost certainly an unrelated chance alignment","A spectroscopic binary","Impossible to determine without a light curve"],truth:1},
 prompt:"Bessel trusted a wobble he couldn't directly see the cause of. What would it take for you to trust a measurement like that?"},

{n:51,title:"When stars eclipse each other",ioaa:"Ch. 7 — Binaries &amp; Variables",tool:null,
 hook:"Line up a binary's orbit almost exactly edge-on to Earth, and once every orbit, one star slides directly in front of the other.",
 q:"For an eclipsing binary to actually show eclipses, the orbital plane must be:",
 opts:["Perpendicular to our line of sight","Nearly aligned with our line of sight","Tilted at exactly 45°","Irrelevant — eclipses happen regardless of orientation"],truth:1,sim:"gal_eclipse",
 notice:"Drag the tilt from 0° toward 90°. Find roughly where the dip vanishes, and compare that to how thin a star's disk really is next to its orbit.",
 law:{name:"Eclipsing binaries",eq:"brightness dips, periodically  ⇔  orbital plane ≈ our line of sight",
  terms:[["primary eclipse","the deeper dip — the brighter (usually hotter) star is the one being blocked."],
         ["secondary eclipse","the shallower dip, half an orbit later — the fainter star is blocked instead."],
         ["period, from the light curve","the spacing between successive primary eclipses — read straight off a graph, no spectroscopy needed."],
         ["depth and duration","carry the stars' relative sizes and temperatures — Act I Session 7's L=4πR²σT⁴, run in reverse."]],
  why:["Two stars orbiting each other trace out disks in the sky no bigger than the stars themselves — vanishingly small next to the orbit's overall size. For one to visibly pass in front of the other from Earth's vantage point, our line of sight has to lie almost exactly in the orbital plane. Tilt that plane by more than a degree or so for a typical system, and the disks miss each other entirely, orbit after orbit.",
       "That is a strict, almost fussy geometric requirement — and yet eclipsing binaries are common, simply because there are enormous numbers of binaries in total, and even a small fraction being edge-on to us produces a large absolute count.",
       "Once you have one, the light curve is remarkably information-dense. The spacing between dips gives the period outright. Two unequal dips per cycle tell you the two stars have different temperatures — the deeper dip is whichever star is hotter and blocked, following Session 53's spectral sequence.",
       "Combine this with Session 50's spectroscopic-binary radial velocities and something rare becomes possible: actual physical radii and masses for both stars, derived from observation alone, with no reliance on stellar-model assumptions. This pairing — eclipsing plus spectroscopic — is the gold standard for calibrating the mass-luminosity relation across the whole HR diagram (Act I Session 12)."]},
 fact:{body:["Algol, in the constellation Perseus, is the most famous example — its regular three-day dimming was noticed by naked-eye observers in antiquity and gave it the nickname 'the Demon Star' centuries before anyone knew why it winked. John Goodricke worked out the eclipsing explanation in 1783, at 19 years old.",
  "The exact same geometry, at a much smaller scale, is how planets are found today. A transiting exoplanet dims its star by a fraction of a percent as it crosses the disk — Kepler and TESS are eclipsing-binary photometry, aimed at planets instead of stars.",
  "Because the light curve alone can yield precise stellar radii, eclipsing binaries are one of the most direct ways to test stellar-structure theory against reality — no distance measurement required at all."]},
 drill:{q:"In an eclipsing binary's light curve, the primary eclipse is deeper than the secondary. This tells you the star blocked during the primary eclipse is:",opts:["Smaller","Hotter — carrying more of the pair's total light","Farther from Earth","Moving faster"],truth:1},
 prompt:"Algol's dimming was recorded long before Doppler shifts, spectra, or even a real theory of stars existed. What convinces you an observation is a genuine pattern rather than a series of unlucky coincidences?"},

{n:52,title:"Magnitudes that don't add",ioaa:"Ch. 7 — Binaries &amp; Variables",tool:null,
 hook:"Two stars, unresolved, blur into one point of light. Your telescope hands you a single magnitude — and it belongs to neither star.",
 q:"An unresolved binary measured at magnitude 5, made of two unequal stars, means each individual star has a magnitude that is:",
 opts:["Exactly 5, split between them","Both fainter than 5 — magnitude 5 belongs to neither alone","Both brighter than 5","Impossible to say without resolving them"],truth:1,sim:"gal_combmag",
 notice:"Push the ratio to 1 — equal stars. Even then, watch what the individual magnitudes become; they still don't split evenly around 5 the way you'd guess.",
 law:{name:"Combining apparent magnitudes",eq:"m_tot − m_B  =  −2.5 log₁₀[(F_A + F_B) / F_B]",
  terms:[["F_A + F_B","fluxes are energy, and energy simply adds. This is the one step in the whole calculation that's straightforwardly linear."],
         ["m_tot","the single magnitude an unresolved telescope actually reports — Act I Session 2's scale, applied to the summed flux."],
         ["the trap","magnitudes are logarithms of flux, and logarithms of sums are not sums of logarithms. You cannot average, split, or subtract magnitudes directly — only their underlying fluxes."]],
  why:["Start from what's physically true: light is energy, and energy from two independent sources simply adds. If star A delivers flux F_A and star B delivers F_B, an unresolved telescope receives F_A + F_B — full stop.",
       "The complication is that nobody reports flux directly; Act I Session 2 converts everything to magnitudes first, and that conversion involves a logarithm. Feed a sum into a logarithm and it does not split into a sum of logarithms — so m_tot is not any simple combination of m_A and m_B.",
       "Work it through for a brightness ratio F_A/F_B = 2 and a combined magnitude of 5: m_tot − m_B = −2.5 log₁₀(3), giving m_B ≈ 6.19. Then m_A − m_B = −2.5 log₁₀(2), giving m_A ≈ 5.44. Both stars are individually fainter than the blended 5 — necessarily, since together they had to produce more light than either alone.",
       "Notice the asymmetry survives even at equal brightness: two identical stars each at magnitude m combine to m − 2.5 log₁₀2 ≈ m − 0.75, not m. Doubling the light only costs 0.75 magnitudes, not a full magnitude — another echo of Act I Session 2's logarithmic scale."]},
 fact:{body:["Most 'stars' in historical catalogues were never checked for this. A great many entries compiled before high-resolution imaging or interferometry are, in fact, blended light from two or more unresolved stars — their catalogued magnitude a phantom average of components nobody had separated yet.",
  "Modern surveys keep finding these hiding in plain sight: Gaia's astrometry and ground-based speckle interferometry have split thousands of long-assumed single stars into close pairs, each with its own, fainter, individual magnitude.",
  "You've already met this equation in disguise: during an eclipse (Session 51), F_A or F_B briefly drops toward zero as one star is blocked, and this same formula — evaluated moment by moment — is exactly what traces out the dip in the light curve."]},
 drill:{q:"An unresolved binary has a combined magnitude of 6 and a brightness ratio F_A/F_B = 4. The individual magnitudes are closest to:",opts:["mA=6.2, mB=7.7","mA=3.0, mB=9.0","mA=6.0, mB=6.0","mA=7.7, mB=6.2"],truth:0},
 prompt:"Every catalogue magnitude for a 'star' quietly assumes it's a single star. How many, do you think, actually aren't?"},

{n:53,title:"Oh, Be A Fine Guy/Girl, Kiss Me",ioaa:"Ch. 7 — Binaries &amp; Variables",tool:null,
 hook:"Generations of astronomy students have memorised seven letters, in a nonsense order, because the stars themselves refuse to sort alphabetically by temperature.",
 q:"In the OBAFGKM sequence, spectral type is set entirely by a star's:",
 opts:["Mass","Age","Surface temperature","Distance from Earth"],truth:2,sim:"gal_obafgkm",
 notice:"Sweep temperature across the full range, then move the luminosity-class slider independently. Notice the two controls never fight each other — they're genuinely separate axes.",
 law:{name:"The Morgan–Keenan classification",eq:"spectral type (O B A F G K M)  ×  luminosity class (I – V)",
  terms:[["spectral type","a letter, O through M, set purely by surface temperature (Act I Session 8) — O and B above 20,000 K, A/F/G roughly 5,000–20,000 K, K and M below 5,000 K."],
         ["Oh, Be A Fine Guy/Girl, Kiss Me","the mnemonic that has outlived every attempt to replace it, hottest to coolest."],
         ["luminosity class","a roman numeral I–V, read from the <b>width</b> of spectral lines rather than their strength — an independent measurement of how large, and how dense, the star's atmosphere is."],
         ["I / III / V","supergiant, giant, and main-sequence dwarf. Two stars can share a letter and still be almost nothing alike."]],
  why:["Act I Session 8 already established that a spectral line's strength tracks temperature, not composition. The Morgan–Keenan letter simply names that temperature bin — hottest first, historically, which is why the sequence isn't alphabetical: today's O and B classes were originally ordered differently, before astronomers realised temperature, not raw line strength, was the true underlying variable.",
       "The roman numeral answers an entirely different question: not how hot, but how big and how dense. A giant star's atmosphere is enormously extended and thin; a main-sequence dwarf's is compact and comparatively dense. Denser gas means atoms collide more often mid-transition, smearing each spectral line wider — so line width becomes a direct gauge of surface gravity, and therefore of size, independent of temperature entirely.",
       "That independence is the whole point. Plot stars by temperature alone and a G-type giant and a G-type dwarf land in the same column — indistinguishable by colour. Only the luminosity class separates them, which is exactly why the HR diagram (Act I Session 12) needs both letter and numeral, not one or the other, to place a star correctly.",
       "Put together, 'G2 V' or 'M1 Ia' is closer to a compressed physical description than a label: the letter fixes where on the temperature axis a star sits, the numeral fixes which band of the HR diagram — main sequence, giant branch, or supergiant — it belongs to."]},
 fact:{body:["The Sun is G2 V — an utterly unremarkable spectral type, which is itself informative: most sun-like stars in our neighbourhood share it. Sirius A (Session 50) is A1 V. Betelgeuse, despite being cooler than the Sun, is M1–2 Ia — a supergiant, exactly why Act I Session 7 found it so luminous despite its low temperature.",
  "The full two-part code appears on essentially every star in every professional catalogue, from decades-old photographic surveys to Gaia's billion-star census — a classification scheme built before quantum mechanics explained why it worked, and never seriously challenged since.",
  "Roughly three-quarters of all stars are class M — small, cool, dim red dwarfs. None are visible to the naked eye from Earth; the mnemonic's hottest letters describe the rarest stars, not the typical ones."]},
 drill:{q:"A star is classified K0 III. Compared to a K0 V star of identical surface temperature, it is:",opts:["Smaller and fainter","Hotter","Much larger and far more luminous","Indistinguishable — the numeral doesn't affect brightness"],truth:2},
 prompt:"Two stars share a spectral letter but not a numeral. What single physical difference could explain that on its own?"},

{n:54,title:"Our galaxy from the inside",ioaa:"Ch. 8 — Galactic Astrophysics",tool:null,
 hook:"You cannot step outside the Milky Way and photograph it. Everything we know about its shape has been inferred from inside the disk.",
 q:"Our solar system's distance from the centre of the Galaxy is closest to:",
 opts:["80 pc","800 pc","8 kpc","80 kpc"],truth:2,sim:"gal_milkyway",
 notice:"Slide from the centre out to the edge. Watch exactly where the marker crosses from bulge-orange into disk-blue.",
 law:{name:"The shape of the Milky Way",eq:"barred spiral · ⌀ ≈ 100,000 ly · bulge ⌀ ≈ 10,000 ly · Sun at ≈ 8 kpc",
  terms:[["barred spiral","a straight bar of stars through the centre, with spiral arms unwinding from its ends — our galaxy's measured type, containing at least 100 billion stars."],
         ["100,000 ly across","about 30 kpc. Light takes 100,000 years to cross the disk we live inside."],
         ["bulge, ⌀ ≈ 10,000 ly","the dense, roughly spherical swelling at the centre, a few kpc across."],
         ["≈ 8 kpc","our own distance from the centre — solidly inside the flat disk, well clear of the bulge."]],
  why:["Being embedded inside a disk makes its shape hard to determine directly, but not impossible. Count stars in different directions and the pattern gives it away: looking along the Milky Way's band in the sky, you see vastly more stars than looking perpendicular to it — exactly what you'd expect staring the long way through a flattened disk versus straight out of it.",
       "Harlow Shapley added the decisive piece in 1918: mapping the distribution of globular clusters (using variable-star distance methods, the ancestor of Act I Session 10's technique) showed they form a roughly spherical halo centred nowhere near the Sun — displacing the Sun from the presumed centre of the Galaxy for the first time, and correcting a long-standing mistaken model that had placed us near the middle.",
       "Session 55 and 56's 21-cm radio mapping later filled in the rest: since dust barely dims radio waves, hydrogen clouds could be tracked in every direction, including straight through the bulge that blocks visible light entirely — revealing spiral-arm structure a visible-light survey never could.",
       "The disk and bulge are physically different environments. The disk retains gas and dust, so star formation continues there today, producing young, hot, blue O and B stars (Session 53) that give the disk its blue tint. The bulge's gas was consumed or displaced long ago, leaving only old, cool, red and yellow stars — and no active star formation at all."]},
 fact:{body:["The Milky Way forms roughly one new solar mass of stars per year, almost entirely within the disk — the bulge contributes essentially none of it.",
  "Before Shapley's 1918 result, the accepted picture placed the Sun near the Galaxy's centre. Globular-cluster distances moved us out to the outskirts of an ordinary disk — a Copernican demotion played out a second time, this time for the Galaxy rather than the Solar System.",
  "Modern measurements put the distance to the galactic centre at 8–8.3 kpc, depending on the method — Session 58's Sgr A* orbit measurements use 8.3 kpc specifically."]},
 drill:{q:"Compared to the disk, the galactic bulge is characterised by:",opts:["Young, blue, actively star-forming stars","Old, red stars and essentially no ongoing star formation","No stars at all — pure gas and dust","A composition identical to the disk"],truth:1},
 prompt:"We've never left the Galaxy to photograph it from outside. What convinces you it's really a barred spiral?"},

{n:55,title:"The 21-cm whisper",ioaa:"Ch. 8 — Galactic Astrophysics",tool:null,
 hook:"A single hydrogen atom, left alone, waits an average of millions of years before it makes this particular sound.",
 q:"The 21-cm hydrogen line is produced by a transition between:",
 opts:["Two different electron orbitals","Two hyperfine states of the same ground state, from electron/proton spin alignment","Ionised and neutral hydrogen","Hydrogen and helium nuclei"],truth:1,sim:"gal_21cm",
 notice:"Push the dust column all the way up. Compare how far each bar makes it.",
 law:{name:"The 21-cm hyperfine line",eq:"E₂₁ = h f₂₁ ,  f₂₁ = 1420.406 MHz  (λ = 21.106 cm)",
  terms:[["hyperfine structure","a tiny energy split within hydrogen's 1s ground state, caused by the magnetic interaction between the electron's spin and the proton's spin."],
         ["spin-aligned","electron and proton spins pointing the same way — very slightly higher energy than opposed spins."],
         ["the flip","spontaneously, the aligned state decays to the opposed state, releasing the energy gap as a single photon: 1420.406 MHz, λ=21.106 cm."],
         ["'forbidden'","this transition violates the usual quantum selection rules, which is exactly why any single atom waits so long to make it."]],
  why:["Act I Session 8 covered electron-orbital transitions — jumps between entirely different energy levels, producing optical and UV lines with gaps of order an electronvolt. The 21-cm line is nothing like that: both spin states belong to the very same ground-state orbital. The energy gap comes only from a much weaker effect — the electron's own tiny magnetic moment interacting with the proton's — smaller by a factor of roughly a million.",
       "A tiny energy gap means, by E=hf, a tiny photon frequency — and 1420 MHz sits deep in the radio band, wavelength 21 cm. This is why the line is called 'forbidden': standard selection rules make electron-spin flips extremely unlikely, so a lone hydrogen atom in this state waits millions of years on average before it happens.",
       "What rescues the signal is sheer quantity. The interstellar medium is overwhelmingly hydrogen gas, spread through vast volumes of every galaxy. Even a wildly rare event, multiplied across that much gas, adds up to a strong, steady, always-on signal — the aggregate behaviour of huge numbers compensating for the timidity of any one atom.",
       "The same tiny energy that makes the line rare also makes it penetrating. A dust grain scatters light efficiently only when the grain's size is comparable to the wavelength trying to pass it — true for visible light, whose wavelength is close to a typical grain's size. A 21-cm wave is roughly a million times longer than that grain. To a wave that long, the grain is simply too small to matter, and the radiation sails through dust clouds that block visible starlight completely."]},
 fact:{body:["The line was predicted theoretically by Henk van de Hulst in 1944, during the Nazi occupation of the Netherlands, and detected for the first time in 1951 by Harold Ewen and Edward Purcell at Harvard — a rare case of a specific spectral line being forecast years before the equipment existed to find it.",
  "Because it is a fixed, universal physical constant that any civilisation studying hydrogen would eventually discover, the 21-cm frequency has long been proposed as a natural 'meeting frequency' for SETI radio searches — the so-called water hole between the hydrogen line and the nearby hydroxyl line.",
  "Today, an extremely redshifted version of this same line — stretched by cosmic expansion (Session 60) from centimetres to metres — is one of the few tools that might let astronomers probe the 'cosmic dawn,' the era before the first stars and galaxies existed."]},
 drill:{q:"Compared to the visible hydrogen absorption lines from Act I Session 8 (electron-orbital jumps), the energy released by the 21-cm hyperfine flip is:",opts:["Enormously smaller","About the same","Enormously larger","Impossible to compare"],truth:0},
 prompt:"A transition so improbable a single atom waits millions of years for it, yet it's one of the most useful signals in astronomy. What resolves that paradox?"},

{n:56,title:"Mapping a galaxy you're inside of",ioaa:"Ch. 8 — Galactic Astrophysics",tool:null,
 hook:"You are stuck inside the disk you're trying to map. There is no vantage point outside it, and there never will be.",
 q:"To reconstruct the Milky Way's rotation curve from inside it, astronomers rely on:",
 opts:["Direct photographs of the disk from above","The differing Doppler shifts of hydrogen clouds at different distances along the same sightline","Parallax to individual hydrogen clouds","Measuring the total mass of the disk directly"],truth:1,sim:"gal_himap",
 notice:"Sweep the longitude slider and watch the tangent-point marker slide along the sightline. Note where the peak velocity is largest.",
 law:{name:"The tangent-point method",eq:"v_los = v₀(R₀/R − 1) sin l ,  maximised at R = R₀ sin l",
  terms:[["v₀","the Galaxy's roughly flat orbital speed, about 220 km/s near the Sun's radius — similar for gas across a wide range of distances from the centre."],
         ["R₀","our own galactocentric radius, ≈ 8 kpc (Session 54)."],
         ["l","galactic longitude — the direction you point the radio dish, measured from the line toward the centre."],
         ["the tangent point","the spot along a given sightline closest to the centre, where the Doppler shift reaches its extreme — the single most useful point on that line."]],
  why:["Every hydrogen cloud in the disk orbits the centre, and to first approximation all of them move at roughly the same speed regardless of how far out they sit — a genuinely surprising empirical fact called a flat rotation curve. What Session 57's Doppler-shifted 21-cm line measures is only the component of that orbital motion along our line of sight, which depends on both the cloud's distance from the centre and the direction we're looking.",
       "Point the dish at a fixed galactic longitude and every cloud along that entire line of sight is sampled at once, each contributing its own frequency shift to the observed spectrum — near and far clouds smeared together into one spread of velocities rather than one clean number.",
       "That spread has a sharp edge. Geometrically, the point along any given sightline that comes closest to the galactic centre — the tangent point — is also where almost the whole of a cloud's orbital velocity happens to point directly along our line of sight. No other point on that sightline can show a larger shift, so the extreme edge of the observed velocity spread marks the tangent point unambiguously.",
       "Measure that extreme velocity at many different longitudes, convert each to a physical radius using simple geometry, and the result is v(R) — the Galaxy's actual rotation curve — mapped out entirely from observations made at a single fixed location inside the disk. This same technique, applied to other galaxies (usually optically rather than by 21-cm), is what first revealed that rotation curves stay flat rather than declining at large radius — one of the earliest and strongest pieces of evidence for dark matter."]},
 fact:{body:["This method, developed through the 1950s–70s, produced the first detailed maps of the Milky Way's spiral arms — maps still being refined today, since we have no external photograph to check them against.",
  "Jan Oort's earlier work on galactic rotation (the Oort constants, derived from ordinary stellar motions rather than 21-cm radio data) laid groundwork this technique later built on with much greater reach.",
  "Vera Rubin's optical rotation-curve measurements of other spiral galaxies in the 1970s, using the same underlying logic, showed their outer regions orbiting far faster than their visible matter could explain — a result now considered one of the pillars of evidence for dark matter."]},
 drill:{q:"Looking almost exactly toward the galactic centre (l → 0°), the tangent-point velocity approaches:",opts:["Zero","v₀ itself","Twice v₀","It becomes undefined"],truth:1},
 prompt:"You never left the disk, yet you just mapped its rotation. What did the extra dimension — velocity, not just position — buy you that a photograph alone couldn't?"},

{n:57,title:"Redshift, properly defined",ioaa:"Ch. 8 — Galactic Astrophysics",tool:null,
 hook:"A radio astronomer tunes to 1420.406 MHz, expecting silence between the hiss. Instead, a gas cloud near the galactic centre answers back at 1421.65 MHz.",
 q:"Given z = (f_rest − f_obs)/f_obs, a negative value of z means the source is:",
 opts:["Moving away from us","Moving toward us","Stationary","Too far to determine motion"],truth:1,sim:"gal_redshift",
 notice:"Drag the observed frequency below 1420.406 MHz, then above it. Watch which sign of z goes with which direction.",
 law:{name:"Redshift, precisely",eq:"z = (λ_obs − λ_rest)/λ_rest = f_rest/f_obs − 1 ,   exactly:  1+z = √[(1+β)/(1−β)]",
  terms:[["z","the fractional shift — dimensionless, and identical in form whether applied to radio, visible, or gamma-ray light."],
         ["the exact relation","valid at any speed, derived from special relativity; it folds in the moving source's own time dilation, not just the classical wave-stretching of Act I Session 9."],
         ["v/c ≈ z","the low-speed approximation — accurate to a fraction of a percent whenever v ≪ c, which covers essentially every object inside our own galaxy."],
         ["sign convention","negative z is blueshift and approach; positive z is redshift and recession — Act I Session 9's rule, now exact at any speed."]],
  why:["Act I Session 9 derived the classical Doppler shift by tracking wave crests leaving a moving source: Δλ/λ₀ ≈ v/c. That derivation quietly assumes v ≪ c and ignores relativity entirely — fine for a star wobbling under a planet's tug, but not guaranteed to hold everywhere.",
       "The exact relativistic version accounts for one more effect: a moving clock runs slow, from any outside observer's point of view, and the source's oscillation is a clock. Combine the classical wave-stretching with this time-dilation factor and the result is 1+z = √[(1+β)/(1−β)], with β = v/c — reducing to the simple v≈cz approximation only when β is small.",
       "Solve that relation for β given a measured z: β = [(1+z)² − 1] / [(1+z)² + 1]. For a hydrogen cloud observed at 1421.65 MHz against a rest frequency of 1420.406 MHz, z = (1420.406 − 1421.65)/1421.65 ≈ −8.75×10⁻⁴. Both the simple approximation and the exact formula give essentially the same answer: v ≈ −262 km/s — negative, meaning the cloud is moving toward us.",
       "That agreement is not a coincidence of this example; it's a consequence of the speed involved being tiny compared to c. Every object within our own galaxy moves at hundreds, at most a few thousand, km/s — β of order 10⁻³ — so the approximation and the exact formula track each other closely throughout this entire act. Session 60 pushes the same z formula out to speeds where that comfortable agreement finally breaks down."]},
 fact:{body:["This exact technique — radio spectroscopy of the 21-cm line — lets astronomers measure motion clear across the Galaxy, including regions completely hidden from visible light by dust (Session 55), because the line itself barely notices the dust at all.",
  "Long before 21-cm radio astronomy existed, Vesto Slipher used ordinary optical Doppler shifts in the 1910s to measure the motions of what were then called 'spiral nebulae' — data that later turned out to be recession velocities of entire external galaxies, and the raw material Edwin Hubble would build Session 60's law from.",
  "Redshift measured this way is now the single most common way any astronomical distance or velocity claim beyond the Solar System gets made — it requires no resolved image, only a spectrum."]},
 drill:{q:"A hydrogen cloud's spin-flip line, rest frequency 1420.406 MHz, is observed at 1419.20 MHz. Its velocity is closest to:",opts:["≈255 km/s, receding","≈255 km/s, approaching","≈2550 km/s, receding","≈0 km/s — no measurable shift"],truth:0},
 prompt:"Two formulas — one exact, one approximate — agreed here to several decimal places. At what speed would you actually need the exact one?"},

{n:58,title:"Weighing the invisible",ioaa:"Ch. 8 — Galactic Astrophysics",tool:null,
 hook:"At the exact centre of our galaxy sits something with the mass of millions of Suns and the visible footprint of nothing at all.",

 law:{name:"Weighing an unseen mass",eq:"GMm/r² = mv²/r   ⟹   M = v²r / G",
  terms:[["GMm/r²","gravity's pull on the orbiting body — Session 49's law, aimed now at one dominant central mass rather than two comparable ones."],
         ["mv²/r","the centripetal force needed to hold anything on a circular orbit of radius r at speed v."],
         ["m","the orbiting body's own mass — appears on both sides, and <em>cancels completely</em>."],
         ["M = v²r/G","whatever is left after cancelling m. A gas cloud, a star, a planet — any orbiting test mass turns into a scale for the thing it's circling."]],
  why:["Set gravity's pull equal to the centripetal force a circular orbit requires, and the orbiting object's own mass m appears on both sides of the equation. It cancels outright — which means the result works identically whether the orbiting body is a wisp of gas, a whole star, or anything else, so long as its orbit is circular and dominated by one much larger central mass.",
       "That cancellation is what makes this a genuine weighing instrument for objects too dark, too small, or too distant to see directly: you never need to know what's orbiting, only how fast and how far out it's going.",
       "One route to v is Session 57's redshift: a gas cloud's hydrogen line, observed at 1421.23 MHz against a rest frequency of 1420.406 MHz, gives z ≈ −5.8×10⁻⁴ and v ≈ −170 km/s — approaching. If that cloud orbits at r=0.2 pc, then M = v²r/G works out to about 2.8×10³⁶ kg, or roughly <b>1.4 million solar masses</b>, compressed into a region far too small to be a star cluster.",
       "A second, completely independent route skips velocity altogether: watch a star's actual angular position around Sgr A* change over years, timing its orbital period T directly, and combine that with its angular separation and the (independently known) distance to the galactic centre to get a physical radius r — following the same arcsecond-to-AU conversion Session 49 and Act I Session 4 both used for parallax. Feed r and T into Kepler's third law, M = 4π²r³/(GT²), and a star with angular separation 0.12″, period 15 years, at a galactic-centre distance of 8.3 kpc, gives M ≈ 4.4×10⁶ solar masses. Two unrelated methods — a frequency shift, and an angle plus a stopwatch — land on the same conclusion: several million solar masses, packed into a volume with no visible surface at all."]},
 fact:{body:["Decades of exactly this second method — tracking the real orbits of stars like S2 around Sgr A* — earned Andrea Ghez and Reinhard Genzel a share of the 2020 Nobel Prize in Physics for demonstrating, beyond reasonable doubt, that a supermassive black hole occupies the Galaxy's centre.",
  "Today's best dynamical mass estimate for Sgr A* sits close to 4 million solar masses — remarkably near the value the angular-size-and-period method above produces from just one star's orbit.",
  "In 2022, the Event Horizon Telescope released a direct image of Sgr A*'s shadow — a completely different technique (radio interferometric imaging, not orbital dynamics) landing on a consistent mass and size, independent confirmation of what decades of stellar orbits had already implied."]},
 drill:{q:"A star orbits Sgr A* with angular separation 0.12″ at a galactic-centre distance of 8.3 kpc, completing one orbit in 15 years. The enclosed mass is closest to:",opts:["4.4 million M☉","1.4 million M☉","440,000 M☉","44 million M☉"],truth:0},
 prompt:"A frequency shift and a stopwatch-plus-angle measurement, taken independently, landed on the same mass. Why does that agreement matter more than either measurement alone?"},

  why:["Edwin Hubble proposed this sequence in 1926 as a purely observational sorting scheme — organised by appearance, the way Session 53's OBAFGKM sorts stars by temperature rather than by any story about how they got that way.",
       "The historical labels 'early type' (elliptical, lenticular) and 'late type' (spiral, irregular) unfortunately suggest an evolutionary sequence, ellipticals turning into spirals over time. Later work turned this on its head: ellipticals are now generally understood to form from mergers of spiral galaxies, making them products of a later stage, not an earlier one. The classification survived; the implied story behind its names did not.",
       "The physical distinction that actually explains the sequence is gas. Spiral galaxies retain gas in a rotating disk, so star formation continues today, continually producing the young, hot, blue O and B stars (Session 53) that give spiral disks their characteristic blue-tinted arms. Ellipticals used up or lost their gas long ago; without fresh star formation, only old, cool, red and yellow stars remain, distributed in smooth, randomly oriented orbits rather than a flattened, ordered disk — which is also why they look featureless rather than structured.",

  why:["In 1929, Edwin Hubble combined two separate measurements for a modest sample of nearby galaxies: recession velocities from redshifted spectra (building on Vesto Slipher's earlier work, Session 57), and distances estimated independently via Cepheids (Act I Session 10). Plotting one against the other revealed a striking, roughly linear trend — galaxies twice as far receding at roughly twice the speed.",

function actNav(){
  const el=document.getElementById("actnav");if(!el)return;
  const bounds=actBounds(),curAct=actIndexOfCur();
  el.innerHTML="";
  bounds.forEach((b,i)=>{const btn=document.createElement("button");
    btn.textContent="Act "+ROMAN[i];btn.title=b.title.replace(/&amp;/g,"and");
    btn.className=i===curAct?"now":"";
    btn.setAttribute("aria-label","Act "+ROMAN[i]+": "+b.title.replace(/&amp;/g,"and"));
    btn.onclick=()=>{if(i===curAct)return;
      let idx=b.start;
      for(let k=b.start;k<b.end;k++){idx=k;if(!Store.get("done"+SESSIONS[k].n,false))break}
      cur=idx;Store.set("cur",cur);render();window.scrollTo(0,0)};
    el.appendChild(btn)});
}

    btn.onclick=()=>{cur=i;Store.set("cur",i);render();window.scrollTo(0,0)};f.appendChild(btn)});
  const doneInAct=SESSIONS.slice(b.start,b.end).filter(s=>Store.get("done"+s.n,false)).length;

  if(quizMode!==null){renderQuiz(quizMode);return}
  renderSession();
}

function renderSession(){
  const s=SESSIONS[cur];frames();
  const actIdx=actIndexOfCur(),actB=actBounds()[actIdx],isLastOfAct=(cur===actB.end-1)&&!!ACT_QUIZZES[actIdx];
  const picked=Store.get("pick"+s.n,null),drilled=Store.get("drill"+s.n,null),lawOpen=Store.get("law"+s.n,false);
  const terms=s.law.terms.map(t=>`<div class="term"><span class="sym">${t[0]}</span><span class="def">${t[1]}</span></div>`).join("");
  const why=s.law.why.map(p=>`<p>${p}</p>`).join("");
  const fact=s.fact.body.map(p=>`<p>${p}</p>`).join("");
  main.innerHTML=`
  <div class="eyebrow"><span>Session ${String(s.n).padStart(2,"0")}</span><span class="tag">${s.ioaa}</span><span>≈12 min</span></div>
  <h2 class="title">${s.title}</h2>
  <p class="hook">${s.hook}</p>

  <section class="stage"><div class="stage-label"><span>1 · Predict</span><span>commit before you touch anything</span></div>
    <p class="q">${s.q}</p><div class="opts" id="opts"></div><p class="verdict" id="verdict" hidden></p></section>

  <section class="stage" id="st2" ${picked===null?"hidden":""}>
    <div class="stage-label"><span>2 · Sandbox</span><span>go and check</span></div>
    <div class="sim"><canvas id="cv"></canvas><div class="ctrls" id="ctrls"></div><div class="readout" id="ro"></div></div>
    <p class="notice">${s.notice}</p>
    <div class="row"><button class="act" id="toLaw">I've seen enough →</button></div></section>

  <section class="stage" id="st3" ${lawOpen?"":"hidden"}>
    <div class="stage-label"><span>3 · Compress</span><span>the short way to write what you just saw</span></div>
    <div class="law"><p class="name">${s.law.name}</p><p class="eq">${s.law.eq}</p>
      <div class="terms">${terms}</div></div>
    <div class="why"><h4>Why it takes this shape</h4>${why}</div>
    ${s.tool?`<div class="tool"><h4>${TOOLS[s.tool].title}</h4><p>${TOOLS[s.tool].body}</p>
      <div class="row"><button class="act ghost" id="skipTool">I know this — hide it</button></div></div>`:""}
    <div class="wild"><h4>◈ Out there in the world</h4>${fact}</div>
    <p class="q" style="margin-top:26px">${s.drill.q}</p><div class="opts" id="drill"></div></section>

  <section class="stage" id="st4" ${drilled===null?"hidden":""}>
    <div class="stage-label"><span>4 · Log</span><span>one line, your words</span></div>
    <p class="prompt-note">${s.prompt}</p>
    <textarea id="note" placeholder="Write it as if explaining to someone who wasn't here…">${(Store.get("note"+s.n,"")+"").replace(/</g,"&lt;")}</textarea>
    <div class="row"><button class="act" id="save">Save to log</button><span class="saved" id="savedMsg" hidden>Logged ✦</span>
      ${isLastOfAct?`<button class="act" id="toQuiz">${Store.get("quizScore"+actIdx,null)!==null?"Review":"Take"} the Act Quiz →</button>`
        :(cur<SESSIONS.length-1?'<button class="act ghost" id="next">Next session →</button>':'')}</div></section>`;

  const ob=document.getElementById("opts");
  s.opts.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span>${t}</span>`;
    if(picked!==null){b.disabled=true;if(i===picked)b.classList.add("picked");if(i===s.truth)b.classList.add("truth")}
    b.onclick=()=>{Store.set("pick"+s.n,i);render();
      setTimeout(()=>document.getElementById("st2").scrollIntoView({behavior:"smooth",block:"start"}),60)};
    ob.appendChild(b)});
  if(picked!==null){const vd=document.getElementById("verdict");vd.hidden=false;
    vd.className="verdict "+(picked===s.truth?"hit":"miss");
    vd.textContent=picked===s.truth?"You called it — now go find out why":"Not quite. Good — go find where it breaks"}

  if(picked!==null)mountSim(s);

  const tl=document.getElementById("toLaw");
  if(tl)tl.onclick=()=>{Store.set("law"+s.n,true);render();
    setTimeout(()=>document.getElementById("st3").scrollIntoView({behavior:"smooth",block:"start"}),60)};
  const sk=document.getElementById("skipTool");if(sk)sk.onclick=()=>sk.closest(".tool").remove();

  const db=document.getElementById("drill");
  if(db)s.drill.opts.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span>${t}</span>`;
    if(drilled!==null){b.disabled=true;if(i===drilled)b.classList.add("picked");if(i===s.drill.truth)b.classList.add("truth")}
    b.onclick=()=>{Store.set("drill"+s.n,i);render();
      setTimeout(()=>document.getElementById("st4").scrollIntoView({behavior:"smooth",block:"start"}),60)};
    db.appendChild(b)});

  const sv=document.getElementById("save");
  if(sv)sv.onclick=()=>{Store.set("note"+s.n,document.getElementById("note").value);
    Store.set("done"+s.n,true);document.getElementById("savedMsg").hidden=false;frames()};
  const nx=document.getElementById("next");
  if(nx)nx.onclick=()=>{Store.set("note"+s.n,document.getElementById("note").value);
    Store.set("done"+s.n,true);cur++;Store.set("cur",cur);render();window.scrollTo(0,0)};
  const tq=document.getElementById("toQuiz");
  if(tq)tq.onclick=()=>{Store.set("note"+s.n,document.getElementById("note").value);
    Store.set("done"+s.n,true);quizMode=actIdx;render();window.scrollTo(0,0)};
}

function renderQuiz(actIdx){
  frames();
  const quiz=ACT_QUIZZES[actIdx],b=actBounds()[actIdx];
  const answered=quiz.map((q,i)=>Store.get("quizA"+actIdx+"_"+i,null));
  const allAnswered=answered.every(a=>a!==null);
  const score=answered.reduce((acc,a,i)=>acc+(a===quiz[i].truth?1:0),0);
  if(allAnswered)Store.set("quizScore"+actIdx,score);
  main.innerHTML=`
  <div class="eyebrow"><span>Act Quiz</span><span class="tag">${b.title.replace(/&amp;/g,"&")}</span><span>${quiz.length} questions</span></div>
  <h2 class="title">Check your understanding</h2>
  <p class="hook">Before moving on, see how much of Act ${ROMAN[actIdx]} actually stuck — no sandbox this time, just what you remember.</p>
  ${quiz.map((q,i)=>`
  <section class="stage" style="margin-top:26px">
    <div class="stage-label"><span>Q${i+1} of ${quiz.length}</span><span>Session ${String(q.session).padStart(2,"0")}</span></div>
    <p class="q">${q.q}</p><div class="opts" id="qopt${i}"></div>
  </section>`).join("")}
  <section class="stage" id="quizResult" ${allAnswered?"":"hidden"}>
    <div class="stage-label"><span>Result</span><span>&nbsp;</span></div>
    <p class="verdict ${score===quiz.length?"hit":"miss"}">Score: ${score} / ${quiz.length}${score===quiz.length?" — clean sweep":""}</p>
    <div class="row"><button class="act" id="quizContinue">${actIdx<ACT_META.length-1?"Continue to Act "+ROMAN[actIdx+1]+" →":"Finish Flight of Corvus →"}</button></div>
  </section>`;
  quiz.forEach((q,i)=>{
    const ob=document.getElementById("qopt"+i),picked=answered[i];
    q.opts.forEach((t,oi)=>{const btn=document.createElement("button");btn.className="opt";
      btn.innerHTML=`<span class="k">${"ABCD"[oi]}</span><span>${t}</span>`;
      if(picked!==null){btn.disabled=true;if(oi===picked)btn.classList.add("picked");if(oi===q.truth)btn.classList.add("truth")}
      btn.onclick=()=>{Store.set("quizA"+actIdx+"_"+i,oi);render();
        setTimeout(()=>{const nextStage=document.getElementById("qopt"+(i+1));
          (nextStage?nextStage.closest(".stage"):document.getElementById("quizResult")).scrollIntoView({behavior:"smooth",block:"start"})},60)};
      ob.appendChild(btn)});
  });
  const qc=document.getElementById("quizContinue");
  if(qc)qc.onclick=()=>{
    quizMode=null;
    if(actIdx<ACT_META.length-1){const nb=actBounds()[actIdx+1];cur=nb.start;Store.set("cur",cur);render()}
    else{main.innerHTML=`<div class="eyebrow"><span>Complete</span></div><h2 class="title">Flight of Corvus — logged</h2>
      <p class="hook">All five acts, ${SESSIONS.length} sessions, ${ACT_META.length} quizzes. You built the whole ladder — from a smudge of light to the edge of the observable universe.</p>`;frames()}
    window.scrollTo(0,0)};
}

function mountSim(s){
  const sim=SIMS[s.sim],cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  if(!ctx)return;
  const v={};sim.ctrls.forEach(c=>v[c.id]=c.val);
  const cb=document.getElementById("ctrls");
  sim.ctrls.forEach(c=>{const d=document.createElement("div");d.className="ctrl";
    d.innerHTML=`<label for="c_${c.id}">${c.label}<b id="v_${c.id}">${c.id==="logd"?Math.pow(10,c.val).toExponential(1):c.val}${c.unit}</b></label>
      <input type="range" id="c_${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}">`;
    cb.appendChild(d);
    d.querySelector("input").addEventListener("input",e=>{v[c.id]=parseFloat(e.target.value);
      document.getElementById("v_"+c.id).textContent=(c.id==="logd"?Math.pow(10,v[c.id]).toExponential(1):v[c.id])+c.unit;paint()})});
  function paint(){const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,
    h=Math.round(Math.min(300,Math.max(215,w*.53)));
    cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    sim.draw(ctx,w,h,v);document.getElementById("ro").innerHTML=sim.read(v)}
  paint();window.addEventListener("resize",paint,{passive:true});
}
render();

/* ---------- daily image from NASA APOD ---------- */
const APOD=(()=>{
  const el=document.getElementById("apod");
  const today=new Date().toISOString().slice(0,10);
  const CK="apod:"+today;
  let expanded=false, data=null;

  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function quiet(msg){
    el.hidden=false;
    el.innerHTML=`<div class="apod-head"><span>Today's sky</span></div><div class="apod-quiet">${msg}</div>`;
  }

  function paint(){
    if(!data) return;
    el.hidden=false;
    const isVid=data.media_type==="video";
    el.innerHTML=`
      <div class="apod-head"><span>Today's sky</span><b>${esc(data.date)}</b></div>
      <div class="apod-body">
        ${data.url?`<div class="apod-img" id="apodImgWrap"><img id="apodImg" src="${esc(data.url)}" alt="${esc(data.title)}" loading="lazy"></div>`:""}
        <div class="apod-txt">
          <h3>${esc(data.title)}</h3>
          <p class="${expanded?"":"clip"}" id="apodText">${esc(data.explanation)}</p>
          <div class="apod-meta">
            <button id="apodMore">${expanded?"Show less":"Read more"}</button>
            ${isVid&&data.link?`<a href="${esc(data.link)}" target="_blank" rel="noopener">Watch →</a>`:""}
            ${data.hdurl?`<a href="${esc(data.hdurl)}" target="_blank" rel="noopener">Full size →</a>`:""}
            ${data.copyright?`<span class="cr">© ${esc(data.copyright)}</span>`:`<span>Public domain · NASA</span>`}
          </div>
        </div>
      </div>`;
    const b=document.getElementById("apodMore");
    if(b) b.onclick=()=>{expanded=!expanded;paint()};
    const img=document.getElementById("apodImg");
    if(img) img.onerror=()=>{
      // the fetched "image" didn't actually load (NASA's own API has been known
      // to serve a broken/placeholder url) — drop the broken cache entry so the
      // next visit retries instead of being stuck showing it, and degrade this
      // view to text-only rather than a broken-image icon.
      try{ if(localStorage.getItem(CK)===JSON.stringify(data)) localStorage.removeItem(CK); }catch(e){}
      const wrap=document.getElementById("apodImgWrap");
      if(wrap) wrap.remove();
    };
  }

  // Fallback key for hosts with no server function (e.g. GitHub Pages).
  // Low-stakes: an APOD key only gates NASA's own rate limit, nothing sensitive.
  const NASA_KEY_FALLBACK="Thz41bAxdx9HI5qQ8j2d8KnM34FdTfbahUy3Qz7v";

  function shapeApod(d){
    return {
      date: d.date, title: d.title, explanation: d.explanation, media_type: d.media_type,
      url: d.media_type==="video" ? (d.thumbnail_url||d.url) : d.url,
      hdurl: d.hdurl||null,
      link: d.media_type==="video" ? d.url : null,
      copyright: d.copyright ? d.copyright.replace(/\s+/g," ").trim() : null
    };
  }

  function cacheAndPaint(j){
    data=j;
    try{
      Object.keys(localStorage).forEach(k=>{ if(k.startsWith("apod:")&&k!==CK) localStorage.removeItem(k); });
      localStorage.setItem(CK,JSON.stringify(j));
    }catch(e){}
    paint();
  }

  async function loadDirect(){
    try{
      const r=await fetch(`https://api.nasa.gov/planetary/apod?api_key=${NASA_KEY_FALLBACK}&thumbs=true`);
      if(r.status===429) return stale("NASA rate limit reached. Try again shortly.");
      if(!r.ok) return stale(`NASA returned ${r.status}.`);
      cacheAndPaint(shapeApod(await r.json()));
    }catch(e){
      stale("Couldn't reach NASA.");
    }
  }

  async function load(){
    // serve cached copy first so the panel works offline
    try{
      const c=localStorage.getItem(CK);
      if(c){ data=JSON.parse(c); paint(); return; }
    }catch(e){}
    // prefer the server proxy (keeps the key server-side) when one exists;
    // fall back to calling NASA directly (e.g. on GitHub Pages, or if the
    // proxy errors, isn't configured, or this is a local file with no server)
    try{
      const r=await fetch("/api/apod");
      const j=await r.json();
      if(r.ok && !j.error){ cacheAndPaint(j); return; }
    }catch(e){}
    loadDirect();
  }

  function stale(msg){
    try{
      const old=Object.keys(localStorage).filter(k=>k.startsWith("apod:")).sort().pop();
      if(old){ data=JSON.parse(localStorage.getItem(old)); paint(); return; }
    }catch(e){}
    quiet(msg);
  }

  return {load};
})();
APOD.load();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
