{n:37,title:"The limit built into light",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Grind a lens to atomic perfection, polish away every scratch, eliminate every aberration — and light still refuses to converge to a point. It spreads into rings no matter how good your glass is.",
 q:"A telescope with flawless optics and zero atmosphere still cannot form a perfect point image of a star. Why?",
 opts:["Stars are too far away to ever appear as points","Light passing through any finite aperture diffracts","Only reflecting telescopes have this problem","It's a manufacturing limit that better engineering removes"],truth:1,sim:"opt_diffraction",
 notice:"Shrink the aperture toward zero and watch the point of light dissolve into a bloom. Then push it wide and watch the bloom tighten — it never vanishes.",
 law:{name:"The diffraction limit",eq:"θ_min ∝ λ / D",
  terms:[["λ","wavelength of the light being collected."],
         ["D","the aperture diameter — the diameter of the lens or mirror actually collecting the light."],
         ["θ_min","the smallest angular detail the instrument can ever resolve, no matter how perfect its optics are."]],
  why:["Light is a wave, and any wave passing through a finite opening spreads out on the far side — this is diffraction, and it happens to ocean swells squeezing through a harbour mouth exactly as it happens to starlight squeezing through a telescope aperture.",
       "A lens or mirror does not receive a single ray from a star; it receives a whole wavefront across its entire aperture. Every point on that wavefront acts as its own little source, and those countless sources interfere with each other on the way to the focus. The result is not a point — it is a central bright disk surrounded by faint rings, called an <em>Airy pattern</em>.",
       "The size of that pattern is set purely by geometry: a wider aperture samples a wider slice of the wavefront, which forces the interference to cancel more sharply away from the centre, producing a tighter disk. A narrower aperture does the opposite. No amount of grinding, coating, or computer-aided lens design changes this — it is built into the wave nature of light itself.",
       "This is why the phrase <em>diffraction-limited</em> matters: it names the point where an instrument has become so good that its blur is no longer due to imperfect glass or a wobbly atmosphere, but to physics that cannot be engineered away. Sessions 38-40 turn this proportionality into an exact formula and put real numbers — real telescopes — on both sides of it."]},
 fact:{body:["Ground-based telescopes rarely reach their true diffraction limit — turbulence in Earth's atmosphere blurs images first, a problem called <b>seeing</b>, which is why adaptive optics and space telescopes exist.",
  "Above the atmosphere, the Hubble Space Telescope's 2.4 m mirror is genuinely diffraction-limited in visible light — its images are as sharp as a perfect mirror of that size can possibly be.",
  "<em>Bigger is not a luxury here — it is the only lever that exists once the atmosphere is out of the way.</em>"]},
 drill:{q:"Two telescopes have identical aperture diameters, but telescope A observes in blue light and telescope B observes in red light. Which has the smaller diffraction limit (sharper resolution)?",opts:["Telescope A (blue, shorter λ)","Telescope B (red, longer λ)","They are identical","Cannot be determined from D alone"],truth:0},
 prompt:"If diffraction can never be engineered away, what does that say about the ultimate resolution limit of any instrument you could ever build at a given size?"},

{n:38,title:"The Rayleigh criterion",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Two stars merge into one smear of light. Nudge them a hair farther apart and, at some precise point, they snap into two. Lord Rayleigh gave that snapping point a name and a number.",
 q:"According to the Rayleigh criterion, two point sources are 'just resolved' when:",
 opts:["Their diffraction patterns don't overlap at all","The central peak of one pattern falls on the first minimum (dark ring) of the other","Their central peaks exactly coincide","One source is twice as bright as the other"],truth:1,sim:"opt_rayleigh",
 notice:"Shrink the aperture until the two glowing points blur into one, then grow it back until they just separate — that crossing point is the Rayleigh criterion in action.",
 law:{name:"The Rayleigh criterion",eq:"θ = 1.22 λ / D",
  terms:[["θ","the minimum angular separation (in radians) at which two point sources can be told apart."],
         ["λ","wavelength of the observed light."],
         ["D","diameter of the telescope's aperture (lens or primary mirror)."],
         ["1.22","a constant from the mathematics of diffraction through a circular aperture — it comes from the position of the first dark ring in the Airy pattern."]],
  why:["Session 37 established that any aperture turns a point source into an Airy pattern — a bright central disk ringed by fainter rings, with dark minima in between. Two nearby stars each produce their own full Airy pattern, and what you actually see is the sum of both patterns overlapping.",
       "When the stars are far apart, the two central peaks sit clearly apart with a real dip in brightness between them, and your eye or detector reads two objects. As they move closer, the peaks creep toward each other and the dip between them shallows.",
       "Rayleigh's criterion fixes a specific, reproducible line in the sand: the two are called <em>just resolved</em> when the centre of one star's pattern lands exactly on the first dark ring of the other's. Closer than that, the combined pattern looks like one smeared blob, and no measurement can prove there were two objects rather than one.",
       "Solving the diffraction mathematics for a circular aperture (the standard shape of a lens or mirror) places that first dark ring at an angular radius of 1.22 λ/D from the centre — exactly the formula above. It is not an arbitrary convention; it falls straight out of where the interference first cancels completely.",
       "This single formula is the working tool for sessions 39-41: change D and you are talking about telescope design (39, 40); change nothing but the aperture value in the formula and you are describing your own naked eye (41)."]},
 fact:{body:["The constant 1.22 is specific to <b>circular</b> apertures. A rectangular slit has a different, simpler diffraction pattern and a different numerical factor — the 1.22 is a fingerprint of round telescope mirrors and lenses.",
  "'Just resolved' is a convention, not a hard wall — with excellent signal-to-noise and computational deconvolution, modern instruments can sometimes tease apart sources even closer than the Rayleigh limit. But as an olympiad-standard working definition, it is exact and universal.",
  "<em>Every resolving-power problem in this act — exoplanets, radio dishes, your own eye — is one formula applied to different numbers.</em>"]},
 drill:{q:"An instrument observes two stars whose angular separation equals exactly 1.22λ/D for its aperture. The stars are:",opts:["Completely indistinguishable from one star","Just resolved, per the Rayleigh criterion","Impossible to observe at all","Resolved only if they are the same brightness"],truth:1},
 prompt:"Rayleigh's line is a human convention laid on top of a smooth, continuous physical blur. Where else in science have you seen a sharp threshold drawn across something that is actually gradual?"},

{n:39,title:"Aperture vs resolution",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"A star and its orbiting planet, 250 parsecs away, separated by about as much sky as a coin held 700 km from your eye. To split that apart, you need a mirror the width of a school bus.",
 q:"To resolve a smaller angular separation between two objects, a telescope's aperture must be:",
 opts:["Smaller","Larger","Aperture size is irrelevant — only wavelength matters","It depends on the objects' brightness, not their separation"],truth:1,sim:"opt_exoplanet",
 notice:"Grow the mirror diameter toward 6 metres and watch the star and its planet snap apart from one merged glow into two distinct points.",
 law:{name:"Resolving power sets minimum aperture",eq:"D = 1.22 λ / θ",
  terms:[["θ","the required angular separation to resolve — here, the star-planet separation as seen from Earth."],
         ["λ","wavelength of observation (session 38's Rayleigh formula, rearranged for D)."],
         ["D","minimum aperture needed to just resolve that angle."]],
  why:["Session 38 gave the resolving angle for a given aperture. Flip the algebra and you get the aperture required for a given angle — this is the design question every telescope-builder actually asks: <em>how big must I build this mirror to see what I want to see?</em>",
       "Take the IOAA-style worked case: a Jupiter-like planet orbits a star at d = 5 AU, and the system sits at r = 250 pc from Earth. Using the small-angle approximation (session 4 of Act I — tan θ ≈ θ for tiny angles), the angular separation is θ ≈ d/r = (5 × 1.4960×10¹¹ m)/(250 × 3.0856×10¹⁶ m) ≈ 9.70×10⁻⁸ radians.",
       "Observing at λ ≈ 500 nm and demanding the Rayleigh criterion be met, D = 1.22λ/θ = 1.22 × (500×10⁻⁹)/(9.70×10⁻⁸) ≈ 6 metres.",
       "That number is not arbitrary trivia — it sits close to the actual mirror sizes of the largest single telescopes ever built (see this session's fact box). Directly imaging a planet next to its star is one of the hardest tasks in observational astronomy precisely because it sits right at the edge of what aperture can buy you.",
       "Note what does <em>not</em> help: no amount of exposure time, sensitivity, or signal processing narrows the diffraction blur. Only a bigger D, or a shorter λ, moves θ_min down. This is the same lever pulled again at radio wavelengths in session 40, with a very different outcome."]},
 fact:{body:["The James Webb Space Telescope's primary mirror is 6.5 m across — built from 18 hexagonal segments, because casting or launching one single 6.5 m mirror is impractical.",
  "The Extremely Large Telescope (ELT), under construction in Chile, will have a 39 m segmented mirror — built specifically to push toward direct imaging of Earth-like exoplanets.",
  "<em>Every exoplanet 'image' you've seen that shows an actual dot of light beside its star (rather than a wobble or a dip in brightness) required an aperture pushed close to this diffraction wall.</em>"]},
 drill:{q:"Keeping the same 250 pc distance and 500 nm light, if the planet instead orbits at 10 AU (double the earlier 5 AU), the minimum telescope diameter needed to resolve it is approximately:",opts:["12 m","6 m (unchanged)","3 m","24 m"],truth:2},
 prompt:"Given that D climbs roughly in step with distance and shrinks with angular separation, what does this tell you about which exoplanet systems are realistically directly imageable, versus which will only ever be found by indirect methods?"},

{n:40,title:"Radio eyes",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"A radio wave can be a hundred thousand times longer than a wave of visible light. Rayleigh's formula charges you for every one of those extra metres.",
 q:"To match the resolving power of a 10 cm optical telescope (λ ≈ 500 nm), a radio telescope observing at λ = 1 cm would need an aperture of roughly:",
 opts:["10 cm — wavelength doesn't matter for resolution","2 m","2 km","200 km"],truth:2,sim:"opt_radio",
 notice:"Slide the radio wavelength and watch the dish needed to match a plain 10 cm optical telescope balloon outward.",
 law:{name:"Matching resolving power across wavelengths",eq:"D' = D × (λ' / λ)",
  terms:[["D","aperture of the reference (optical) telescope."],
         ["λ","its wavelength."],
         ["λ'","the new, longer (radio) wavelength."],
         ["D'","the aperture a radio telescope needs to match the optical instrument's resolving power."]],
  why:["Rayleigh's criterion (session 38) says θ = 1.22λ/D. Two instruments have the same resolving power exactly when λ/D is the same for both. Setting λ/D = λ'/D' and solving gives D' = D(λ'/λ) — the aperture scales up in direct proportion to how much longer the wavelength has become.",
       "Radio waves used in astronomy run from millimetres to metres — often 10,000 to 100,000 times longer than visible light's ~500 nm. Take the reference case: a modest 10 cm optical telescope observing at λ ≈ 500 nm, and ask what radio dish, working at λ = 1 cm, would match its resolving power: D' = D×(λ'/λ) = 0.10 m × (0.01/5×10⁻⁷) ≈ 2000 m — roughly 2 kilometres.",
       "No single dish that size is practical to build and steer. This is precisely why radio astronomy solved the problem differently from optical astronomy: instead of one enormous continuous mirror, arrays of smaller dishes are spread across large distances and their signals combined in software — a technique called interferometry, which effectively synthesises an aperture as wide as the array itself.",
       "The lesson generalises: resolving power is bought with λ/D, not with D alone. A radio astronomer's 'telescope' is often not a single dish diameter at all, but the separation between dishes at opposite ends of a continent — or, for the Event Horizon Telescope, opposite sides of the Earth."]},
 fact:{body:["The Very Large Array (VLA) in New Mexico links 27 dishes, each 25 m across, spread over a Y-shaped track up to 36 km long — its effective resolving power matches a single dish that size, not 25 m.",
  "The Event Horizon Telescope linked radio dishes across the entire planet, synthesising an aperture roughly Earth-diameter-sized, which is exactly what let it resolve the shadow of the M87 black hole — an object with an angular size measured in microarcseconds.",
  "<em>Radio astronomy's giant numbers — kilometre dishes, planet-sized arrays — are not excess. They are the literal price that 1.22λ/D charges for working at long wavelengths.</em>"]},
 drill:{q:"A radio telescope at λ = 21 cm (the hydrogen line) wants to match the resolving power of a 1 m optical telescope at λ = 500 nm. The required radio dish diameter is approximately:",opts:["42 km","420 km","4.2 km","4,200 km"],truth:1},
 prompt:"If synthesising a huge aperture from an array of small dishes works so well for radio astronomy, why do you think optical astronomers don't simply build arrays of small mirrors instead of struggling to cast giant single ones? (Hint: think about what interferometry demands of the wavelength being combined.)"},

{n:41,title:"What the naked eye can (and can't) resolve",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Your pupil is a 6 mm aperture, and diffraction doesn't care whose eye it's bending light through. Rayleigh's formula applies to you exactly as it applies to a telescope.",
 q:"An 80 km-wide crater on the Moon (384,000 km away) subtends an angle of about 2.1×10⁻⁴ radians. The naked human eye's diffraction limit (6 mm pupil, 500 nm light) is about:",
 opts:["8.3×10⁻⁵ radians — smaller, so the crater is resolvable","8.3×10⁻⁵ radians — larger, so the crater is not resolvable","2.1×10⁻⁴ radians — exactly matched","5×10⁻³ radians — far too coarse to see the crater"],truth:0,sim:"opt_eye",
 notice:"Shrink the simulated pupil below 6 mm and watch the crater's marker slide past your eye's resolving limit — it stops being visible.",
 law:{name:"The eye as a diffraction-limited instrument",eq:"θ_eye = 1.22 λ / D_pupil",
  terms:[["D_pupil","diameter of the eye's pupil — typically about 2 mm in bright light, up to about 6-7 mm fully dark-adapted."],
         ["λ","wavelength of visible light, ~500 nm for this kind of estimate."],
         ["θ_eye","the smallest angular detail a human eye can resolve, set purely by diffraction — an optimistic best case that ignores the eye's other imperfections."]],
  why:["The pupil is nothing more than a small circular aperture, so exactly the same Rayleigh formula from session 38 applies to it. With D = 6 mm and λ = 500 nm, θ_eye = 1.22×(500×10⁻⁹)/(6×10⁻³) ≈ 8.33×10⁻⁵ radians — a genuine, if idealised, resolving limit for human vision.",
       "Compare that against a real target: an 80 km lunar crater at the Moon's distance (3.78×10⁸ m) subtends an angle α ≈ 80×10³/3.78×10⁸ ≈ 2.12×10⁻⁴ radians, using the same small-angle approximation from session 39.",
       "Since α > θ_eye, the crater's angular size is larger than the eye's diffraction limit — the naked eye <em>can</em>, in principle, resolve it, which is a genuinely striking result: the largest lunar craters sit right at the edge of naked-eye visibility, given a dark sky and excellent vision.",
       "This is an idealised ceiling, not a guarantee. The eye's actual performance is usually worse than its diffraction limit because of imperfect lens shape, the spacing of retinal receptors, and atmospheric blurring — but the diffraction number sets the absolute best case no biology could ever beat.",
       "The identical formula, the identical logic — only the aperture changed, from a 6 m mirror in session 39 to a 6 mm pupil here. That is the entire point of writing resolving power as a ratio: it does not care what is doing the resolving."]},
 fact:{body:["In bright daylight your pupil contracts to roughly 2-4 mm, which actually <em>worsens</em> diffraction-limited resolution — but daylight vision is instead limited by the spacing of cone cells on the retina, not diffraction, so it doesn't matter in practice.",
  "Fully dark-adapted, the pupil opens to about 6-7 mm — the exact regime where the Moon-crater calculation applies, and where diffraction genuinely becomes the limiting factor for a keen-eyed observer under a clear sky.",
  "<em>Whenever you've heard that a sharp-eyed person could 'just make out' Tycho or Copernicus without a telescope, this calculation is the reason it's physically plausible.</em>"]},
 drill:{q:"Under the same assumptions (6 mm pupil, 500 nm light), the smallest lunar crater diameter the naked eye could just resolve is closest to:",opts:["8 km","32 km","80 km","320 km"],truth:1},
 prompt:"Telescopes buy resolving power with a bigger D. What would you have to change about human eyes — evolutionarily impossible or not — to meaningfully improve on 8.3×10⁻⁵ radians?"},

{n:42,title:"Naming the stars",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Aldebaran. α Tauri. 87 Tauri. HD 29139. Same point of light, four different names — each one a fossil of a different century's cataloguing project.",
 q:"A Bayer designation like 'α Tauri' combines a Greek letter with:",
 opts:["The star's spectral class","The genitive (possessive) form of its constellation's Latin name","Its Flamsteed number","Its right ascension in hours"],truth:1,sim:"opt_catalogue",
 notice:"Step through the four naming systems and watch the same star relabelled each time.",
 law:{name:"Four layers of star-naming convention",eq:"proper name → Bayer (α Tauri) → Flamsteed (87 Tauri) → HD (HD 29139)",
  terms:[["Bayer designation","a Greek letter (roughly ranked by brightness within the constellation) plus the constellation's genitive Latin name — devised by Johann Bayer in 1603, covering 1,564 stars."],
         ["Flamsteed number","a plain number plus the constellation's genitive name, assigned by John Flamsteed's catalogue, covering 2,554 stars — denser coverage than Bayer's Greek alphabet allows."],
         ["Henry Draper (HD) Catalogue","a single running number (HD 1 to HD 225,300) assigned in order of increasing right ascension for epoch 1900.0, published 1918-1924, each entry carrying a spectroscopic classification."],
         ["genitive form","the 'possessive' Latin case — Taurus becomes Tauri, meaning 'of Taurus,' exactly like English 'the Bull's' star."]],
  why:["Only a few hundred stars ever earned individual proper names — Sirius ('the scorcher'), Antares, Aldebaran ('the follower'), Procyon ('preceding the dog') — names that predate any systematic catalogue and mostly survive from Arabic or Greek antiquity.",
       "Johann Bayer's 1603 star atlas needed a scalable system, so he assigned each constellation's stars Greek letters — usually, though not strictly, in order of decreasing brightness: α (alpha) for the brightest, β (beta) next, and so on — followed by the constellation's Latin genitive. Aldebaran becomes α Tauri: 'Alpha of Taurus.'",
       "The Greek alphabet has only 24 letters, so Bayer's system runs out fast within a rich constellation. John Flamsteed's later catalogue used plain running numbers instead, reaching many more stars — 2,554 versus Bayer's 1,564. This is why some famous stars are known chiefly by Flamsteed number: 51 Pegasi (the first main-sequence star found with an exoplanet) and 61 Cygni (the first star to have its parallax measured, session 4 of Act I) carry no memorable Greek letter at all.",
       "Flamsteed catalogued only what was visible from Great Britain, so far-southern stars have no Flamsteed number at all — some instead carry Gould numbers, from Benjamin Gould's southern-hemisphere catalogue Uranometria Argentina (marked with a trailing G, e.g. 82 G. Eridani), though these are rarely used today.",
       "By the early 20th century, spectroscopy demanded a catalogue built for a different purpose entirely: not naming bright stars, but classifying faint ones by spectral type. The Henry Draper Catalogue numbered 225,300 stars purely by right ascension, indifferent to constellation or brightness — which is why exoplanet host stars like HD 209458 (the first known transiting exoplanet system) are so often known only by an HD number: they were never bright or notable enough to earn anything else."]},
 fact:{body:["Modern surveys have made HD-style running-number catalogues the norm rather than the exception — Gaia's own catalogue numbers over a billion stars, none of which will ever get a Greek letter or a proper name.",
  "Bayer wasn't perfectly consistent with his brightness ordering — a handful of β stars are actually brighter than their constellation's α, usually because of naked-eye measurement error in 1603 or because Bayer prioritised position in the constellation's figure over strict brightness rank.",
  "<em>Every layer in this naming history survives because deleting the older layer would orphan whichever community — classical poets, 17th-century cartographers, or 20th-century spectroscopists — still relies on it.</em>"]},
 drill:{q:"51 Pegasi and 61 Cygni are both known chiefly by Flamsteed number rather than a Bayer designation. The most likely reason is:",opts:["They are too faint to have Greek letters at all","The Greek alphabet ran out before reaching them in their constellation","They were discovered after Bayer's catalogue was published","They lie in the far southern sky, outside Flamsteed's range"],truth:1},
 prompt:"If you had to design a catalogue today for a billion stars, would you use anything like Bayer's letters or Flamsteed's numbers — or does HD's approach (indifferent running numbers) win by default at that scale?"},

{n:43,title:"The basic triangle",ioaa:"Ch. 4 — Optics and Detectors",tool:"greatcircle",
 hook:"Draw a triangle on a globe with three 90° angles — three right angles adding to 270°, not 180°. Flat-plane geometry simply breaks the moment you're standing on a sphere.",
 q:"On the surface of a sphere, the interior angles of a triangle formed by three great-circle arcs:",
 opts:["Always sum to exactly 180°, just like flat trigonometry","Always sum to more than 180°","Always sum to less than 180°","Sum to a fixed value that depends only on the sphere's radius"],truth:1,sim:"opt_greatcircle",
 notice:"Drag the triangle size wider and picture the arcs bulging outward across a globe — every side is itself a curve, not a straight line.",
 law:{name:"The spherical-trigonometry basic triangle",eq:"three great circles → three vertices (A, B, C) → three sides (a, b, c)",
  terms:[["great circle","the largest possible circle that can be drawn on a sphere — its centre coincides with the sphere's own centre. The equator is a great circle; so is any circle through both poles."],
         ["vertex (A, B, C)","one of the three points where a pair of great circles cross, forming a corner of the triangle."],
         ["side (a, b, c)","the arc of a great circle opposite each vertex — itself an angle, since it subtends some angle as seen from the sphere's centre."]],
  why:["On a flat plane, the shortest path between two points is a straight line, and triangles are built from three of them. A sphere's surface has no straight lines at all — the closest analogue, the path of shortest distance between two points on the surface, is always an arc of a great circle.",
       "Take any three great circles on a sphere and, generically, each pair crosses at two antipodal points. Choosing one crossing from each pair (the 'front' set, by convention) gives three vertices — call them A, B, C — and the great-circle arcs connecting them form the sides of a spherical triangle, opposite the vertices sharing their lowercase letter: side a is opposite vertex A, and so on.",
       "Because each side is itself an arc of a circle centred on the sphere's centre, every side subtends its own angle as seen from that centre — which means a 'side' in spherical trigonometry is measured in degrees or radians, exactly like an angle, not in a length unit like metres. This single fact is what lets sessions 44 and 45 take sines and cosines of the sides themselves.",
       "This is also why plane trigonometry's sine and cosine rules cannot simply be reused here: they assume straight sides and angles summing to 180°. On a sphere, angle sums always exceed 180° (the surplus is called the <em>spherical excess</em>, and it grows with the triangle's area), and a triangle can genuinely have three right angles — an equilateral triangle occupying an eighth of the globe, with each vertex sitting where two great circles meet at exactly 90°.",
       "In astronomy, this construction is not abstract: the celestial sphere is a real working tool, and any two objects on the sky, together with the celestial pole, form exactly this kind of basic triangle. Sessions 44 and 45 build the actual working formulas — the spherical cosine and sine rules — on top of this triangle."]},
 fact:{body:["Airline great-circle routes look curved on a flat map for the same reason — a straight line on a Mercator projection is almost never the shortest path between two cities, because the map itself distorts the sphere.",
  "The 'triangle with three right angles' is not a curiosity — any octant of a sphere (one-eighth of its surface, bounded by three quarter-great-circles) is exactly this triangle, with angle sum 270°.",
  "<em>Every angular separation you will ever compute between two stars is secretly a side of a spherical triangle whose third vertex is the celestial pole.</em>"]},
 drill:{q:"A spherical triangle covering a very small patch of a very large sphere (e.g. a small patch of Earth's surface) will have an angle sum that is:",opts:["Exactly 180°","Slightly more than 180°, approaching 180° as the patch shrinks","Always exactly 270°","Undefined — small triangles don't behave spherically"],truth:1},
 prompt:"Why do you think it makes sense that a small enough patch of a sphere starts to look and behave like a flat plane?"},

{n:44,title:"The cosine rule of the sky",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Two stars, each pinned down by nothing but a right ascension and a declination. No ruler in the sky can span the gap between them — only a spherical cosine rule can.",
 q:"To find the angular separation between two stars from their coordinates, the spherical cosine rule needs:",
 opts:["Only their two declinations","Only their two right ascensions","Both stars' declinations and the difference in their right ascensions","Their apparent magnitudes and colours"],truth:2,sim:"opt_costriangle",
 notice:"Set two sides and the angle between them, and watch the third side — the angular separation — respond.",
 law:{name:"The spherical cosine rule",eq:"cos a = cos b cos c + sin b sin c cos A",
  terms:[["a","the side opposite vertex A — the quantity usually being solved for."],
         ["b, c","the other two sides of the basic triangle (session 43)."],
         ["A","the vertex angle included between sides b and c."],
         ["(cyclic)","the rule holds for any relabelling: cos b = cos c cos a + sin c sin a cos B, and cos c = cos a cos b + sin a sin b cos C — all three are the same statement, just relabelled."]],
  why:["Session 43 established that spherical triangle sides are themselves angles. The cosine rule is the formula that relates all six quantities of that triangle — three sides, three angles — two sides and their included angle at a time.",
       "To find the angular separation between two stars, build the basic triangle out of the north celestial pole and the two stars. The side from the pole to each star is simply its <em>co-declination</em> (90° − declination), and the angle at the pole between the two stars is the difference in their right ascensions. Plug those two known sides and the known included angle into the cosine rule, and the third side — the star-to-star angular separation — falls out directly.",
       "This is the exact machinery behind converting a star catalogue's coordinates (session 42) into something you can actually observe: a real angular gap on the sky, ready to compare against a telescope's field of view or resolving power (sessions 38-41).",
       "Notice the rule collapses sensibly in a limiting case: if A = 90° (the two directions are perpendicular, as happens locally between the right-ascension and declination directions), cos A = 0 and the equation reduces to cos a = cos b cos c — a spherical analogue of Pythagoras' theorem for a right triangle. And for very small b, c (nearby points on the sky), you can Taylor-expand the cosines and recover something close to ordinary flat-plane distance, consistent with session 43's remark that small patches of a sphere look flat.",
       "Session 46 puts every piece of this to work on a real photograph — two real stars from the Ursa Major table, real coordinates, one number for the angular separation between them."]},
 fact:{body:["This is precisely the formula behind the everyday phrase 'great-circle distance' used in aviation and satellite navigation — swap 'star declination' for 'latitude' and 'right ascension' for 'longitude,' and the identical cosine rule gives the shortest flight path between two cities.",
  "Professional astrometry software (and every planetarium app) runs this exact calculation continuously behind the scenes any time it reports the separation between two objects on the sky.",
  "<em>One formula does double duty: it is simultaneously 'how far apart are two stars' and 'how far apart are two cities' — spherical geometry does not know the difference.</em>"]},
 drill:{q:"Two stars share the same right ascension but differ in declination by 12°. Their angular separation is:",opts:["0°, since right ascension matches","Exactly 12°","Slightly less than 12°","Impossible to determine without more data"],truth:1},
 prompt:"Why does sharing the same right ascension turn the general cosine rule into something much simpler — and does that match what you'd expect geometrically?"},

{n:45,title:"The sine rule of the sky",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"The cosine rule hands you a side. The sine rule hands you something almost eerie: one ratio, identical everywhere in the triangle, tying every side to its opposite angle at once.",
 q:"In the spherical sine rule sinA/sina = sinB/sinb = sinC/sinc, if you know angle A, side a, and angle B, you can solve directly for:",
 opts:["Side c only","Angle C only","Side b","Nothing further — three more quantities are needed"],truth:2,sim:"opt_sinetriangle",
 notice:"Adjust one side and one angle and watch the third quantity resolve, holding the same ratio across the whole triangle.",
 law:{name:"The spherical sine rule",eq:"sin A / sin a  =  sin B / sin b  =  sin C / sin c",
  terms:[["A, B, C","the three vertex angles of the basic triangle."],
         ["a, b, c","the three opposite sides (session 43) — themselves angles, subtended at the sphere's centre."],
         ["the shared ratio","a single constant value for the entire triangle, exactly as in flat-plane trigonometry's sine rule."]],
  why:["Flat-plane trigonometry has a sine rule linking side length to opposite angle: sinA/a = sinB/b = sinC/c, with a, b, c as literal lengths. Spherical trigonometry keeps the exact same structure but, following session 43, replaces lengths with angles — sin of the side, not the side itself.",
       "The proof mirrors the flat case: drop a construction that relates two triangle elements through a common third quantity, and the ratio falls out identical from either pair you choose. The remarkable part is that this identical-ratio property survives the jump from flat to curved geometry completely intact, even though the cosine rule (session 44) needed to change form entirely.",
       "Practically, the sine rule is the tool of choice whenever you have an angle-side-angle or side-angle-angle situation and want a partner quantity without dragging the full cosine rule through an inverse cosine. Given any angle and its opposite side, the shared ratio sinX/sinx is fixed for the whole triangle, so a second known angle immediately hands you its opposite side (or vice versa).",
       "One caution inherited from flat trigonometry: the inverse sine is two-valued (sin θ = sin(180° − θ)), so solving for an unknown angle from the sine rule alone can leave a genuine ambiguity that the cosine rule does not have — worth remembering whenever the two rules are used together to fully pin down a triangle.",
       "Sessions 44 and 45 together are the complete toolkit: the cosine rule for side-angle-side or side-side-side triangles, the sine rule for angle-side-angle configurations — everything session 46 needs to turn raw star coordinates into a measured focal length."]},
 fact:{body:["The same ambiguity (two possible triangles satisfying one sine-rule equation) shows up in ordinary trigonometry as the 'ambiguous case' of the law of sines — ASS triangles that can be constructed two different valid ways.",
  "Celestial navigation at sea historically leaned on exactly this pair of spherical rules, worked by hand with logarithm tables, to fix a ship's position from star sightings, long before electronic positioning existed.",
  "<em>Two rules, one triangle: between the cosine and sine rules, any three known quantities of a spherical triangle (in the right combination) unlock the other three.</em>"]},
 drill:{q:"In a spherical triangle, angle A = 90°, side a = 40°, and angle B = 30°. Side b is closest to:",opts:["13°","20°","30°","40°"],truth:1},
 prompt:"The sine rule looks almost identical between flat and spherical trigonometry, while the cosine rule looks completely different. What do you think that difference reveals about which relationships are 'deep' geometry versus which are coincidences of flat space?"},

{n:46,title:"Measuring a star field",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"One photograph, two stars whose coordinates you already know, a ruler, and the spherical cosine rule — that's the entire recipe for measuring a telescope's focal length without ever opening it up.",
 q:"In the Ursa Major focal-length method, the physical separation of two stars' images on a CCD chip, combined with their known angular separation on the sky, lets you directly determine:",
 opts:["The stars' true distances from Earth","The telescope's focal length","The CCD chip's exact pixel count","The stars' apparent magnitudes"],truth:1,sim:"opt_focallength",
 notice:"Match the sim's default numbers — 3.86 mm on the chip, 5.13° on the sky — to the worked example, then explore what changes the focal length.",
 law:{name:"Focal length from angular and physical separation",eq:"f = (d/2) / tan(φ/2)",
  terms:[["φ","angular separation between two stars on the sky (from the cosine rule, session 44)."],
         ["d","physical separation between the two stars' images on the CCD chip, corrected for any enlargement between chip and printed/viewed image."],
         ["f","the telescope/camera system's focal length — the distance from the lens or mirror to the focal plane where the CCD sits."]],
  why:["Take the Ursa Major stars Dubhe (α UMa, RA 11h03m43.84s, Dec 61°45′04.0″) and Merak (β UMa, RA 11h01m50.39s, Dec 56°22′56.4″). Their coordinate differences give a right-ascension-direction side of about 0.236° (the raw RA difference scaled by cos(declination), since RA circles shrink toward the pole) and a declination-direction side of about 5.37°. Treating these as two sides of a basic triangle (session 43) meeting at very close to a right angle, the cosine rule (session 44) gives the true angular separation on the sky: φ ≈ 5.13° = 0.0896 radians.",
       "Now look at the photograph. If the printed or displayed image measures 105.5 × 81.5 mm while the actual CCD chip behind the lens measures 22.0 × 17.0 mm, the image has been enlarged by a factor S_enlarge = average(22.0/105.5, 17.0/81.5) ≈ 0.209. Measuring the star-to-star gap on the printed image (≈1.85 cm) and applying that factor gives the true separation on the chip itself: d = 0.209 × 1.85 cm ≈ 0.386 cm.",
       "The geometry closing the loop is simple similar-triangles optics: light from the two stars converges through the focal point and diverges again onto the chip, so the half-angle between the two converging rays, as measured at the focal point, equals half the angular separation on the sky, φ/2. That half-angle's tangent equals (d/2)/f — half the chip separation over the focal length — which rearranges to f = (d/2)/tan(φ/2).",
       "Plugging in: f = (0.193 cm)/tan(2.57°) = 0.193/0.0448 ≈ 4.3 cm. A single photograph of a well-known star field, combined with a catalogue of known coordinates, has just handed back the focal length of the optical system that took it — no manufacturer's spec sheet required.",
       "This is the reverse of sessions 39-41's design question: instead of asking 'how big must my aperture be to resolve X,' this asks 'given what a real photograph shows, what optics produced it.' Session 47 examines how much to trust the 4.3 cm answer, and session 48 folds the whole pipeline — coordinates to φ to d to f — into one continuous chain."]},
 fact:{body:["This exact calculation is IOAA 2013's data-analysis round question 1 — the technique (catalogue coordinates plus a measured photograph) is standard olympiad and amateur-astrometry practice, not a textbook simplification.",
  "Amateur astrophotographers routinely use this kind of star-pair calibration (called <em>plate solving</em> in modern automated form) to determine or verify an unfamiliar telescope-camera combination's true focal length and pixel scale.",
  "<em>A focal length is normally read off a lens barrel — here it is reconstructed purely from geometry, using the sky itself as the calibration ruler.</em>"]},
 drill:{q:"If the same two stars' images on the CCD were separated by twice the measured distance (d ≈ 0.772 cm) while the angular separation φ stayed at 5.13°, the inferred focal length would be approximately:",opts:["4.3 cm (unchanged)","2.15 cm","8.6 cm","17.2 cm"],truth:2},
 prompt:"Every quantity in f = (d/2)/tan(φ/2) came from somewhere else — a catalogue, a ruler on a photo, a cosine rule. Which of those inputs do you trust the least, and why?"},

{n:47,title:"How wrong could you be",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"You measured 1.85 cm on the photograph. But did you measure 1.84, or 1.86? That sliver of doubt doesn't stay a sliver — it rides along through every step to the final answer.",
 q:"In the Ursa Major focal-length calculation, a roughly 1 mm uncertainty in measuring the ~1.85 cm star separation on the photograph corresponds to a relative uncertainty of about:",
 opts:["0.5%","5%","20%","50%"],truth:1,sim:"opt_error",
 notice:"Keep the measurement uncertainty fixed and stretch the chosen star pair's separation wider — watch the relative error shrink even though nothing about your ruler improved.",
 law:{name:"Relative uncertainty from a fixed measurement error",eq:"(Δf / f)  ≈  (Δd / d)",
  terms:[["Δd","the absolute uncertainty in the measured separation — set by how precisely you can read a ruler against the photograph, roughly ±1 mm here."],
         ["d","the measured separation itself."],
         ["Δf / f","the resulting relative (fractional) uncertainty carried through into the final focal length."]],
  why:["Session 46's largest source of error is not the coordinates (known to high precision from a catalogue) but the one genuinely hands-on measurement: reading the star-to-star gap off a printed photograph with a ruler, good to about ±1 mm out of roughly 18.5 mm — a relative uncertainty of about 1/18.5 ≈ 5%.",
       "To see why that 5% survives essentially unchanged all the way to the final answer, look at the chain of operations in f = (d/2)/tan(φ/2). Multiplying or dividing by an exact, error-free constant (the enlargement factor S_enlarge, or the 1/2) does not change a <em>relative</em> error — a 5% wobble in d is still a 5% wobble in d/2. And because tan(φ/2) is being evaluated at a small angle, it behaves nearly linearly there (echoing session 4 of Act I's small-angle approximation), so it neither amplifies nor damps the error passing through it.",
       "The result: since f is (to good approximation) directly proportional to d, the fractional error propagates one-to-one — Δf/f ≈ Δd/d ≈ 5%, or about ±0.2 cm on a 4.3 cm answer.",
       "This is the general rule for propagating uncertainty through multiplication, division, and (for small angles) even the tangent: fractional errors add in quadrature for products or quotients of independent quantities, but when one single measurement dominates all the others, the total fractional error is simply that measurement's own fractional error.",
       "The fix is not a better ruler — it's better geometry. Choosing a star pair with a larger true separation, like Dubhe (α UMa) and Alkaid (η UMa), spreads the same physical ±1 mm reading error over a much longer measured gap on the photograph, directly shrinking the fractional error. Several pairs measured and averaged together reduce it further still. Neither option requires touching the measuring instrument at all."]},
 fact:{body:["This is exactly why survey instruments and astrometric missions favour long baselines wherever possible — Gaia's parallax measurements (Act I, session 4) get more precise for configurations that maximise the geometric baseline relative to the fixed measurement noise floor, the identical principle at work here.",
  "In laboratory physics generally, this is called relative (or fractional) error, and 'choose a bigger baseline' is one of the most common and most effective ways to beat down a systematic measurement floor — far more effective than demanding an ever more precise ruler.",
  "<em>A 1 mm reading error is fixed by your eyesight and the ruler. Everything else in the calculation is a choice — and the smartest choice available here costs nothing but picking different stars.</em>"]},
 drill:{q:"Switching from the Dubhe-Merak pair (separation ≈1.85 cm on the photo) to the Dubhe-Alkaid pair (separation ≈5.6 cm on the same photo), while keeping the same ±1 mm ruler-reading uncertainty, changes the relative error in f from about 5% to approximately:",opts:["5% (unchanged)","1.8%","15%","0.5%"],truth:1},
 prompt:"If a systematic error also crept into the catalogue coordinates themselves (rather than your ruler), would 'choosing stars farther apart' fix that error too? Why or why not?"},

{n:48,title:"Putting the eye to the sky",ioaa:"Ch. 4 — Optics and Detectors",tool:null,
 hook:"Coordinates on a page. A cosine rule. A ruler on a printed photograph. A tangent. Somehow, out the other end, comes the exact focal length of a telescope you've never touched.",
 q:"Putting sessions 37-47 together, the correct order of the full pipeline from star catalogue to focal length is:",
 opts:["Focal length → angular separation → CCD separation → catalogue coordinates","Catalogue coordinates → cosine rule → angular separation → CCD separation (with enlargement correction) → focal length via tangent","CCD separation → catalogue coordinates → Rayleigh criterion → focal length","Angular separation → Rayleigh criterion → aperture diameter → focal length"],truth:1,sim:"opt_pipeline",
 notice:"Slide the focal length and watch the fixed 5.13° sky angle translate into a changing physical gap on the chip — the whole pipeline compressed into one relationship.",
 law:{name:"The full seeing-the-sky pipeline",eq:"(RA, Dec) → cosine rule → φ → d = 2f·tan(φ/2) → f",
  terms:[["(RA, Dec)","catalogue coordinates of two stars — session 42's naming and cataloguing systems are what makes these numbers findable and trustworthy in the first place."],
         ["cosine rule","session 44's tool for turning two catalogue positions into one angular separation φ, using the basic triangle of session 43."],
         ["φ","the angular separation on the sky — the same kind of quantity that sessions 38-41 measured against a telescope's or an eye's resolving limit."],
         ["d = 2f·tan(φ/2)","session 46's optics relation linking sky angle, focal length, and the physical separation of the images on a detector."],
         ["f","the recovered focal length — or, run the other direction, the predicted image separation for a known focal length."]],
  why:["Trace the whole arc of this act. Session 37 established that no optical system beats diffraction; session 38 turned that into the exact Rayleigh number θ = 1.22λ/D; sessions 39-41 applied it to a telescope resolving an exoplanet, a radio dish, and the naked eye. That thread answers one question: <em>what is the smallest angle any given instrument can even detect as two separate things?</em>",
       "A second thread, sessions 42-45, built the language and mathematics for handling positions and gaps on the sky at all — star names and coordinates (42), the basic triangle (43), and the cosine and sine rules that convert coordinates into actual angular separations (44, 45). That thread answers a different question: <em>given two objects' positions, how far apart do they actually appear?</em>",
       "Session 46 fused both threads on a single real example: two Ursa Major stars' cataloged coordinates fed through the cosine rule gave φ = 5.13°; a ruler on a real photograph, corrected for print enlargement, gave a physical chip separation d; and the small-angle optics relation between φ, d, and focal length f closed the loop, yielding f ≈ 4.3 cm entirely from observation and geometry.",
       "Session 47 then asked how much to trust that number — and found that the dominant error is the one human measurement in the chain (reading a ruler against a photo), and that the fix is purely geometric: pick a wider-spaced star pair and the same absolute error becomes a smaller fraction of the answer.",

/* ===== Act V: Beyond the Stars — sessions 49–60 ===== */
/* Depends on helpers already defined in the app: blob, lbl, axis, tempColour, rgb */

const SIMS_ACT5 = {

gal_binmass:{ctrls:[{id:"a",label:"Average separation",min:10,max:80,step:1,val:40,unit:" AU"},
 {id:"P",label:"Orbital period",min:20,max:200,step:1,val:100,unit:" yr"},
 {id:"ratio",label:"Mass ratio, heavier : lighter",min:1,max:5,step:.1,val:3,unit:"×"}],
 draw(ctx,w,h,v){const Mtot=Math.pow(v.a,3)/Math.pow(v.P,2);
  const mLight=Mtot/(1+v.ratio),mHeavy=Mtot-mLight;
  const rHeavy=v.a/(1+v.ratio),rLight=v.a*v.ratio/(1+v.ratio);
  const cx=w/2,cy=h*.46,scale=(w*.38)/v.a;
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.arc(cx,cy,rHeavy*scale,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,rLight*scale,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#5FC8FF";ctx.beginPath();ctx.arc(cx,cy,2.4,0,7);ctx.fill();lbl(ctx,cx,cy-10,"COM","#5FC8FF");
  blob(ctx,cx+rHeavy*scale,cy,60*Math.pow(mHeavy,.4),30);lbl(ctx,cx+rHeavy*scale,cy+26,`heavier — ${mHeavy.toFixed(2)} M☉`);
  blob(ctx,cx-rLight*scale,cy,60*Math.pow(mLight,.4),30);lbl(ctx,cx-rLight*scale,cy+26,`lighter — ${mLight.toFixed(2)} M☉`);
  lbl(ctx,cx,h-12,`total mass = a³/P² = ${Mtot.toFixed(2)} M☉`,"#A79FD4");
  v._Mtot=Mtot;v._mH=mHeavy;v._mL=mLight},
 read(v){return `M_total = <b>${(v._Mtot||0).toFixed(2)} M☉</b> · heavier = <b>${(v._mH||0).toFixed(2)} M☉</b> · lighter = <b>${(v._mL||0).toFixed(2)} M☉</b><br>`+
  `<em>The heavier star always sits closer to the centre of mass — it has less lever arm to work with.</em>`}},

gal_doubles:{ctrls:[{id:"dz",label:"Star B's true depth behind Star A",min:-200,max:200,step:5,val:120,unit:" pc"}],
 draw(ctx,w,h,v){const skyY=h*.24;
  lbl(ctx,w/2,skyY-30,"WHAT THE TELESCOPE SEES","#6E6699");
  blob(ctx,w/2-9,skyY,60,14);blob(ctx,w/2+9,skyY,60,14);
  lbl(ctx,w/2,skyY+26,"two points of light, close together — always, regardless of dz");
  const oy=h*.66,ox0=26,earthX=ox0,scaleX=(w-70)/300;
  axis(ctx,ox0,oy,w-14,oy);
  ctx.fillStyle="#5FC8FF";ctx.beginPath();ctx.arc(earthX,oy,4,0,7);ctx.fill();lbl(ctx,earthX,oy+16,"Earth");
  const dA=150,xA=ox0+dA*scaleX*.55;

  const dB=dA+v.dz,xB=ox0+Math.max(10,dB)*scaleX*.55;

  (close?`Being at nearly the same distance is <em>necessary but not sufficient</em> — the real test is whether the two share one orbit.`
  :`These two stars only <em>look</em> paired. Move either one and the illusion breaks instantly — this is a visual double, not a binary.`)}},

gal_eclipse:{ctrls:[{id:"incl",label:"Tilt of orbital plane from edge-on",min:0,max:90,step:1,val:10,unit:"°"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h*.28,rx=w*.30,ry=rx*Math.sin(v.incl*Math.PI/180);
  ctx.strokeStyle="#2C2352";ctx.beginPath();ctx.ellipse(cx,cy,rx,Math.max(2,ry),0,0,7);ctx.stroke();
  blob(ctx,cx+rx,cy,55,13);blob(ctx,cx-rx,cy,20,9);
  lbl(ctx,cx,cy-ry-16,"orbit as seen from Earth","#6E6699");
  const L=26,R=w-16,B=h-14,T0=h*.52,depthMax=.42,dip=depthMax*Math.max(0,Math.cos(v.incl*Math.PI/180));
  axis(ctx,L,B,R,B);axis(ctx,L,B,L,T0);
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=1.6;ctx.beginPath();
  for(let i=0;i<=260;i++){const ph=(i/260*2)%1;
   let y=1;
   if(Math.abs(ph-.25)<.05)y=1-dip*(1-Math.abs(ph-.25)/.05);
   else if(Math.abs(ph-.75)<.05)y=1-dip*.4*(1-Math.abs(ph-.75)/.05);
   const x=L+(i/260)*(R-L),yy=B-y*(B-T0);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}
  ctx.stroke();lbl(ctx,w/2,B+12,"brightness over two orbits","#6E6699");
  v._dip=dip},
 read(v){const d=v._dip||0;return d<.02?`Tilted ${v.incl}° from edge-on — the stars miss each other entirely. No dips at all.`
  :`Tilted ${v.incl}° from edge-on — dip depth ≈ <b>${(d*100).toFixed(0)}%</b>. Two unequal dips per orbit: a deep primary (the brighter star blocked) and a shallow secondary.<br><em>Near-perfect edge-on alignment is required — and yet the sky is full of these.</em>`}},

gal_combmag:{ctrls:[{id:"ratio",label:"Brightness ratio, F_A / F_B",min:1,max:10,step:.1,val:2,unit:"×"}],

  `A = <b>${(v._mA||0).toFixed(2)}</b> · B = <b>${(v._mB||0).toFixed(2)}</b><br>`+
  `<em>Neither individual magnitude equals the combined one, and their average doesn't either.</em>`}},

gal_obafgkm:{ctrls:[{id:"T",label:"Surface temperature",min:2500,max:32000,step:100,val:5800,unit:" K"},

  g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(w*.24,h*.4,60,0,7);ctx.fill();

 read(v){const T=v.T,cls=T>=30000?"O":T>=10000?"B":T>=7300?"A":T>=6000?"F":T>=5300?"G":T>=3900?"K":"M";

gal_milkyway:{ctrls:[{id:"r",label:"Your distance from the galactic centre",min:0,max:15,step:.1,val:8,unit:" kpc"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,scale=(Math.min(w,h)*.42)/15;
  const bulgeR=1.5*scale,diskR=15*scale;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,diskR);
  g.addColorStop(0,"rgba(255,190,120,.22)");g.addColorStop(.14,"rgba(255,190,120,.10)");
  g.addColorStop(.4,"rgba(95,200,255,.10)");g.addColorStop(1,"rgba(95,200,255,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,diskR,0,7);ctx.fill();
  ctx.strokeStyle="rgba(95,200,255,.35)";ctx.lineWidth=1.3;
  for(let arm=0;arm<2;arm++){ctx.beginPath();
   for(let t=0;t<=1;t+=.02){const ang=t*3.4*Math.PI+arm*Math.PI,rr=bulgeR+t*(diskR-bulgeR);
    const x=cx+rr*Math.cos(ang),y=cy+rr*Math.sin(ang)*.55;t?ctx.lineTo(x,y):ctx.moveTo(x,y)}
   ctx.stroke()}
  ctx.save();ctx.translate(cx,cy);ctx.rotate(.5);ctx.fillStyle="rgba(255,210,140,.5)";
  ctx.beginPath();ctx.ellipse(0,0,bulgeR*1.7,bulgeR*.55,0,0,7);ctx.fill();ctx.restore();
  blob(ctx,cx,cy,90,22,"255,205,140");
  const ang=-Math.PI/2,rx=v.r*scale,px=cx+rx*Math.cos(ang),py=cy+rx*Math.sin(ang)*.55;
  const inBulge=v.r<1.5;
  ctx.fillStyle=inBulge?"#FF7BA8":"#5FC8FF";ctx.beginPath();ctx.arc(px,py,3.6,0,7);ctx.fill();
  lbl(ctx,px,py-12,"you are here",inBulge?"#FF7BA8":"#5FC8FF");
  lbl(ctx,cx,h-10,"orange = bulge (old, quiescent) · blue arms = disk (star-forming)","#6E6699");
  v._inBulge=inBulge},
 read(v){return `r = <b>${v.r.toFixed(1)} kpc</b> from the centre<br>`+
  (v._inBulge?`Inside the bulge: old, red/yellow stars, essentially no gas left to form new ones.`
  :`Inside the disk: gas, dust, and young blue O/B stars (Session 53) forming at roughly <b>1 M☉/year</b> galaxy-wide. The real Sun sits at ≈8 kpc — right where this marker starts.`)}},

gal_21cm:{ctrls:[{id:"dust",label:"Dust column along the sightline",min:0,max:100,step:5,val:50,unit:"%"}],
 draw(ctx,w,h,v){const tv=Math.exp(-v.dust/18)*100,tr=Math.exp(-v.dust/2000)*100;

gal_himap:{ctrls:[{id:"lon",label:"Direction you point the dish (galactic longitude)",min:10,max:80,step:1,val:45,unit:"°"}],
 draw(ctx,w,h,v){const cx=w*.30,cy=h*.55,scale=(Math.min(w,h)*.34)/9,R0=8,v0=220;
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(cx,cy,R0*scale,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(255,205,140,.6)";ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();lbl(ctx,cx,cy-12,"centre","#6E6699");
  const sunAng=-Math.PI/2,sx=cx+R0*scale*Math.cos(sunAng),sy=cy+R0*scale*Math.sin(sunAng);
  ctx.fillStyle="#5FC8FF";ctx.beginPath();ctx.arc(sx,sy,4,0,7);ctx.fill();lbl(ctx,sx+26,sy,"Sun","#5FC8FF");
  const l=v.lon*Math.PI/180,rayAng=sunAng+Math.PI+l,rayLen=R0*scale*2.4;
  const ex=sx+rayLen*Math.cos(rayAng),ey=sy+rayLen*Math.sin(rayAng);
  ctx.strokeStyle="rgba(169,114,255,.5)";ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  const Rtp=R0*Math.sin(v.lon*Math.PI/180),vtp=v0*(1-Math.sin(v.lon*Math.PI/180));
  const dTp=Math.sqrt(R0*R0-Rtp*Rtp),tx=sx+dTp*scale*Math.cos(rayAng),ty=sy+dTp*scale*Math.sin(rayAng);
  ctx.fillStyle="#A972FF";ctx.beginPath();ctx.arc(tx,ty,3.6,0,7);ctx.fill();
  ctx.strokeStyle="rgba(169,114,255,.35)";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,tx,ty-12,"tangent point","#A972FF");
  const L=w*.62,Rr=w-20,B=h-24,T0=h*.22;axis(ctx,L,B,Rr,B);axis(ctx,L,B,L,T0);
  lbl(ctx,(L+Rr)/2,T0-4,"line-of-sight velocity along this ray","#6E6699");
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=1.6;ctx.beginPath();
  for(let i=0;i<=40;i++){const R=R0-(R0-Rtp)*i/40,x=L+(i/40)*(Rr-L);
   const vlos=R>0?v0*(R0/R-1)*Math.sin(l):vtp,y=B-(vlos/v0)*(B-T0);
   i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.stroke();lbl(ctx,(L+Rr)/2,B+16,"near → tangent point","#6E6699");
  v._Rtp=Rtp;v._vtp=vtp},
 read(v){return `l = <b>${v.lon}°</b> → tangent point at R ≈ <b>${(v._Rtp||0).toFixed(2)} kpc</b>, v ≈ <b>${(v._vtp||0).toFixed(0)} km/s</b><br>`+
  `<em>Sweep this across every longitude and the peaks trace out the Galaxy's entire rotation curve — measured from a point stuck inside the disk.</em>`}},

gal_redshift:{ctrls:[{id:"fobs",label:"Observed frequency",min:1416,max:1425,step:.01,val:1421.65,unit:" MHz"}],
 draw(ctx,w,h,v){const frest=1420.406,c=299792.458;
  const z=(frest-v.fobs)/v.fobs,vApprox=z*c,onePlusZ2=Math.pow(1+z,2),beta=(onePlusZ2-1)/(onePlusZ2+1),vExact=beta*c;
  const L=30,R=w-20,y=h*.36,fmin=1416,fmax=1425;
  ctx.strokeStyle="#2C2352";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();
  const xr=f=>L+((f-fmin)/(fmax-fmin))*(R-L);
  ctx.strokeStyle="#5FC8FF";ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xr(frest),y-20);ctx.lineTo(xr(frest),y+20);ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,xr(frest),y-26,"rest — 1420.406 MHz","#5FC8FF");
  ctx.fillStyle="#A972FF";ctx.beginPath();ctx.arc(xr(v.fobs),y,4.4,0,7);ctx.fill();
  lbl(ctx,xr(v.fobs),y+34,"observed","#A972FF");
  lbl(ctx,w/2,y+56,z<0?"blueshifted — approaching":"redshifted — receding",z?"#A972FF":"#6E6699");
  v._z=z;v._va=vApprox;v._ve=vExact},
 read(v){const z=v._z||0;return `z = <b>${z.toFixed(6)}</b><br>v ≈ cz = <b>${(v._va||0).toFixed(1)} km/s</b> · exact relativistic v = <b>${(v._ve||0).toFixed(1)} km/s</b><br>`+
  `<em>At galactic speeds the two agree to a fraction of a percent. Push z toward 1 and they won't.</em>`}},

gal_sgra:{ctrls:[{id:"r",label:"Orbital radius of the gas cloud",min:.05,max:1,step:.01,val:.2,unit:" pc"},

gal_types:{ctrls:[{id:"type",label:"Galaxy type",min:0,max:3,step:1,val:0,unit:""}],
