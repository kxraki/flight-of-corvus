{n:26,title:"The sky as a shell around you",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"The Sun is 150 million km away. Sirius is 82 trillion km away. On a clear night they look like they're painted on the same dome.",
 q:"The celestial equator is:",opts:["Where the Moon's orbit crosses the sky","The projection of Earth's equator onto the sky","The path the Sun follows through the year","A line only visible from Earth's own equator"],truth:1,sim:"sky_sphere",
 notice:"Slide declination from −90° to +90° and watch the star sweep from the south celestial pole, through the celestial equator, to the north celestial pole.",
 law:{name:"The celestial sphere and declination",eq:"δ = angular distance from the celestial equator",
  terms:[["celestial sphere","an imaginary shell of arbitrarily large radius, centred on the observer, onto which every object's <em>direction</em> is projected. Distance is deliberately thrown away."],
         ["celestial equator","the circle where Earth's equatorial plane, extended outward, slices the celestial sphere. It sits directly 'above' Earth's own equator."],
         ["celestial poles","where Earth's spin axis, extended outward, pierces the sphere. The north celestial pole sits near Polaris."],
         ["δ (declination)","the sky's version of latitude — angular distance north (+) or south (−) of the celestial equator, in degrees, arcminutes, arcseconds."]],
  why:["The trick that makes the celestial sphere useful is throwing away a variable you don't need. For plotting positions on the sky, distance is irrelevant — a star 4 light years away and a galaxy 4 billion light years away, sitting in the same direction, occupy the same point on the sphere. Only Act I's parallax cared about distance; this act is entirely about direction.",
       "Because the sphere is centred on Earth and Earth's equatorial plane doesn't change, every plane that matters on Earth has a direct echo in the sky: extend the equatorial plane and you get the celestial equator; extend the spin axis and you get the celestial poles.",
       "This is why declination behaves exactly like latitude and uses the same units. Sirius's declination, −16°42′58″, means: if you extended Earth's equatorial plane out to Sirius, the star sits 16°42′58″ south of that plane. Polaris, at +89°15′51″, sits almost exactly on the extended spin axis — which is precisely why it barely moves as Earth turns (Session 29 depends on this).",
       "One consequence follows immediately: your latitude on Earth equals the altitude of the celestial pole above your horizon. Stand at the North Pole (lat 90°N) and the celestial pole sits at your zenith, directly overhead. Stand on the equator (lat 0°) and the celestial pole sits on your horizon. <em>Latitude and 'how high the pole sits' are the same number wearing different clothes.</em>",
       "Declination alone is not enough to locate a star — it only gives the sky's latitude. You still need the sky's longitude. That's Session 27."]},
 fact:{body:["Because the celestial sphere throws away distance, it can comfortably hold Polaris (about 430 light years away) and the Andromeda Galaxy (2.5 million light years away) at almost the same declination, +89° and +41° respectively — utterly different distances, perfectly ordinary shared coordinates.",
  "The celestial equator is tilted 23.4° from the ecliptic (Session 31) precisely because Earth's spin axis is tilted 23.4° from its orbital axis — the same number shows up in two different guises throughout this act.",
  "<em>Every planetarium dome you've ever sat under is a physical model of exactly this idea</em> — a shell with no real depth, built because direction was all anyone in the room needed."]},
 drill:{q:"An object has declination −90°. It is located:",opts:["On the celestial equator","At the north celestial pole","At the south celestial pole","This is not a valid declination"],truth:2},
 prompt:"Why do you think astronomers kept 'declination' rather than just reusing the word 'latitude' for the sky?"},

{n:27,title:"The sky's own longitude",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"Declination alone tells you a star is '20° north of the celestial equator.' So is a huge ring of stars circling the whole sky. You need a second number.",
 q:"Right ascension is measured in hours instead of degrees mainly because:",opts:["Astronomers dislike degrees","It directly tracks how long you must wait for an object to cross your meridian","It's easier to type","Hours are more precise than degrees"],truth:1,sim:"sky_radec",
 notice:"Set Dec to +20° and sweep RA from 0h to 24h. Watch the star slide all the way around and return to where it started.",
 law:{name:"Right ascension and declination",eq:"position on the sky = (α, δ), where α runs 0h–24h eastward",
  terms:[["α (right ascension, RA)","angular distance measured eastward along the celestial equator from a fixed zero point, in hours-minutes-seconds (0h to 24h, since Earth takes 24h to rotate under a full circle)."],
         ["δ (declination, Dec)","north-south position, as in Session 26."],
         ["the zero point for α","the vernal equinox — not tied to Earth's surface at all. Session 28 is entirely about why."],
         ["eastward","RA increases in the direction Earth rotates — opposite to how the sky appears to drift westward over a night. RA is a fixed grid; the sky's apparent motion is your own spin, subtracted back out."]],
  why:["Longitude on Earth needs an arbitrary zero (Session 25's Greenwich) because rotation gives it no natural one. RA has the same problem, doubled: not only is there no physically special meridian on the celestial sphere, the sphere isn't even attached to anything solid you could paint a line on.",
       "The fix mirrors longitude directly: pick one meridian on the celestial sphere — the one through the vernal equinox — and call it α = 0h. Every other object's RA is how far east of that line it sits, in hours because Earth's rotation converts angle into time for free: 24h = 360°, so 1h = 15°.",
       "That hour unit is not cosmetic. If a star with RA = 6h is currently on your meridian, a star at RA = 8h will cross your meridian 2 hours later, clock-on-the-wall time. RA doubles as a stopwatch for 'when will this object be up.'",
       "Together, (α, δ) behave exactly like (longitude, latitude) — except the whole grid is painted on a sphere that doesn't rotate with Earth. A star's RA and Dec stay fixed for centuries (aside from slow effects like precession), while your own longitude sweeps under the grid once every 24 hours. This is the entire reason the coordinate system exists: a catalogue of a million stars is only useful if their coordinates don't need updating every night.",
       "Contrast the Sun: because its apparent position drifts along the ecliptic all year (Session 31), its RA and Dec cycle through the full range annually rather than sitting fixed like a star's — which is exactly why the zero point for RA needed to be pinned to a moment in the Sun's yearly path, rather than to any star. That's Session 28's question."]},
 fact:{body:["IOAA 2008 posed this almost literally: two observers, on the equator, 180° apart in longitude, look at the Moon at the same instant. Using REarth = 6.3708×10⁶ m and the Moon's distance 3.78×10⁸ m, simple trigonometry (tan(½Δα) = REarth/dMoon) gives Δα = 1.93° ≈ 0h07m43s — the two observers genuinely disagree about the Moon's right ascension, because they're looking from different points on a baseline that isn't negligible compared to the Moon's distance. Stars, being millions of times farther, show no such disagreement.",
  "A catalogue entry like 'RA 05h34m32s, Dec +22°00′52″' (the Crab Nebula) is a complete, telescope-ready address — punch it into any properly aligned mount anywhere on Earth and it points at the same patch of sky.",
  "<em>Longitude tells you where you are. Right ascension tells you where something else is — permanently, regardless of where you happen to be standing.</em>"]},
 drill:{q:"A star has RA = 14h. Roughly how many hours after a star at RA = 2h does it cross your meridian?",opts:["2 hours later","8 hours later","12 hours later","24 hours later"],truth:2},
 prompt:"What would go wrong with astronomy if RA were pinned to Greenwich's meridian instead of the vernal equinox?"},

{n:28,title:"A zero point that isn't tied to Earth",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"Every star catalogue on the planet agrees on RA = 0h. It's defined by where the Sun happens to be crossing a particular line — on a particular day, seen from a planet that is itself spinning and orbiting.",
 q:"The vernal equinox, RA's zero point, is defined by:",opts:["The star currently closest to Earth's north pole direction","Where the Sun crosses the celestial equator heading north, around 20 March","The centre of the Milky Way","Wherever Earth's longitude-zero meridian points at midnight"],truth:1,sim:"sky_equinox",
 notice:"Turn the hour dial. Watch your local meridian (pink) sweep past every RA mark on the fixed grid — while the ♈ marker at RA=0 never moves at all.",
 law:{name:"The vernal equinox as RA's origin",eq:"α(vernal equinox) ≡ 0h00m00s — by definition",
  terms:[["vernal equinox","the point on the celestial sphere where the Sun's apparent path (the ecliptic, Session 31) crosses the celestial equator, moving from south to north. It happens around 20 March each year."],
         ["♈","the astronomical symbol for the vernal equinox, inherited from when this point sat in the constellation Aries — it has since drifted into Pisces due to precession, but the symbol stuck."],
         ["why not a star","because it needs to be a <em>direction defined by geometry</em>, not an object. Any real star has its own tiny motion and lies at some declination other than exactly 0°."],
         ["why not a point on Earth","because Earth spins once a day. Any Earth-fixed reference (like Greenwich) would drag the entire RA grid around with it every 24 hours, destroying the one property that makes RA useful."]],
  why:["Session 27 established what RA needs: a fixed meridian on the celestial sphere that objects' positions can be measured against for centuries without updating. The candidate has to satisfy two things at once — it must be defined purely by geometry, not by picking a favourite star (which drifts and has no special claim to zero), and it must not rotate with the Earth, which rules out anything like Greenwich.",
       "The Sun's yearly path — the ecliptic — crosses the celestial equator at exactly two points, six months apart. One crossing, heading north, happens around 20 March; the other, heading south, around 22–23 September (Session 31 works out why these dates and not others). Both crossings are pure geometry: intersections of two great circles, the celestial equator and the ecliptic. Neither depends on Earth's spin, and neither is a physical object that can move on its own.",
       "Astronomers picked the northward crossing and called it zero. It could just as easily have been the southward one — there's nothing more 'natural' about March over September. Like Greenwich, once one is picked, everyone keeps using it, because the value of a shared reference frame comes from everyone agreeing, not from the choice being uniquely correct.",
       "This is subtly different from the vernal equinox as a <em>date</em> (which you'll meet again in Session 31) and the vernal equinox as a <em>point on the sky</em> (which is what RA = 0h means). The date is when the Sun visits that point. The point itself sits at fixed coordinates (RA 0h, Dec 0°) all year round, whether or not the Sun happens to be there.",
       "This is exactly why a catalogue works at all: point a telescope at RA 5h34m, Dec +22° tonight, next year, or in a decade, and — precession aside — you get the same patch of sky, because the reference itself is anchored to orbital geometry, not to a spinning platform or a moving light source."]},
 fact:{body:["The name is a fossil of a much older sky. When Hipparchus catalogued stars around 130 BC (the same Hipparchus who built the magnitude scale in Act I, Session 2), the vernal equinox point sat inside the constellation Aries — hence ♈, the ram's-horns symbol. Precession has since dragged it into Pisces, and it will enter Aquarius within a few centuries. The symbol never got updated.",
  "Because the equinox point is defined by where two great circles cross, it very slowly moves anyway — Earth's axis wobbles (precesses) over a 26,000-year cycle, dragging the celestial equator, and hence the crossing point, with it. Star catalogues quietly specify an <em>epoch</em>, like J2000.0, meaning 'RA and Dec as measured against the vernal equinox of the year 2000' — a reminder that even the 'fixed' zero point is fixed only for practical purposes.",
  "<em>Astronomy's most-used coordinate origin isn't a place. It's an event that recurs every year, frozen into a permanent direction.</em>"]},
 drill:{q:"Which of these could NOT serve as RA's zero point, for the reason given in this session?",opts:["The September equinox crossing, moving south — wrong direction by convention, but still a valid geometric crossing","The star Polaris — it's a specific object, not a geometric crossing, and isn't exactly on the equator","The March equinox crossing — the one actually used","Either equinox crossing, since both are geometric intersections"],truth:1},
 prompt:"The vernal equinox is a direction, not a place or an object. Can you name another 'thing' in physics that's defined the same way — by where two things cross, rather than by what's there?"},

{n:29,title:"The stars that never set",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"From Singapore, Polaris barely clears the horizon. From the North Pole, it sits motionless at the zenith all night, every night, forever.",
 q:"A star is circumpolar for your location if:",opts:["It's one of the brightest stars in the sky","Its declination is close enough to 90° (same sign as your latitude) that it never dips below your horizon","It's part of a specific constellation","It's visible only in one season"],truth:1,sim:"sky_circumpolar",
 notice:"Drag latitude down toward 1° (Singapore's) and watch the circumpolar band above Polaris's line nearly vanish.",
 law:{name:"The circumpolar condition",eq:"δ ≥ 90° − |φ|   (northern sky; mirror for southern)",
  terms:[["φ","your latitude."],
         ["δ","the star's declination."],
         ["90° − φ","the minimum declination for a star to just graze the horizon at its lowest point rather than set — the circumpolar boundary."],
         ["the mirror rule","stars with δ ≤ −(90° − φ) never rise at all, for the same reason on the opposite side of the pole."]],
  why:["Recall from Session 26: the celestial pole sits at altitude equal to your latitude, φ, above your horizon. As Earth turns, every star traces a circle around that pole once per sidereal day (Session 34), staying at constant angular distance (90° − δ) from it.",
       "A star never sets if its entire daily circle stays above the horizon. The lowest point of that circle, at its farthest swing below the pole, sits at altitude φ − (90° − δ). For the star to stay up all night, this lowest point must be ≥ 0°: φ − (90° − δ) ≥ 0, which rearranges to exactly δ ≥ 90° − φ.",
       "This is a direct trade: raise your latitude, and the circumpolar boundary drops — more of the sky becomes permanently visible, at the cost of losing the same amount permanently below the horizon on the opposite side. At the pole itself (φ = 90°), the boundary is δ ≥ 0°: the entire visible hemisphere is circumpolar, nothing ever rises or sets, and the other hemisphere is never seen at all.",
       "At the equator (φ = 0°), the boundary becomes δ ≥ 90° — nothing qualifies except a star sitting exactly at the pole. Every other star rises and sets, spending close to 12 hours above the horizon. Singapore, at φ ≈ 1.3°N, is close enough to this that Polaris (δ = +89°16′) only <em>just</em> squeaks over the 90° − 1.3° = 88.7° threshold — 'barely circumpolar,' exactly as the source material puts it.",
       "Real observers get a small bonus: standing on a mountain lets you see slightly past the geometric horizon, and atmospheric refraction (Session 30) lifts things further. The Damavand Mountain problem below combines both corrections to find the true circumpolar boundary for a real observatory site."]},
 fact:{body:["Worked exactly, IOAA 2009: an observer atop Damavand Mountain (φ = 35°57′N, altitude 5,600 m) looking north over the Caspian Sea. Sea-level circumpolar boundary: 90° − 35°57′ = 54°03′. Standing 5.6 km up lets them see β = 2°24′ further round Earth's curve (from cos β = REarth/(REarth+h)), and refraction adds another 34′. Net boundary: 54°03′ − 2°24′ − 34′ = <b>51°05′</b> — nearly 3° more sky made permanently visible, just by climbing a mountain.",
  "Because Earth's axis wobbles over roughly 26,000 years (Session 28's precession), which stars are circumpolar from a given latitude slowly changes. Around 3000 BC, the 'pole star' was Thuban, in Draco — not Polaris at all.",
  "<em>Circumpolar isn't a property of a star. It's a relationship between a star and a latitude</em> — the same star can be permanently visible from Reykjavík and permanently invisible from Singapore."]},
 drill:{q:"An observer at latitude 60°N. What is the minimum declination for a star to be circumpolar (ignore refraction)?",opts:["30°","60°","−30°","90°"],truth:0},
 prompt:"Is there a star that is simultaneously circumpolar as seen from Singapore AND circumpolar as seen from London? What would that require?"},

{n:30,title:"Seeing a sun that has already set",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"The photo exists: a full, round Sun, sitting on the horizon — taken minutes after sunset, when geometry says it should already be gone.",
 q:"Atmospheric refraction at the horizon is strongest because:",opts:["The Sun is more powerful there","Light there travels through the most atmosphere, at the shallowest angle","The ozone layer is thinner near the horizon","It's an illusion with no physical cause"],truth:1,sim:"sky_refraction",
 notice:"Push the Sun's true depression past 35 arcminutes. Watch it vanish for good — refraction has a hard limit.",
 law:{name:"Atmospheric refraction at the horizon",eq:"R_horizon ≈ 35.4′   (vs. R_zenith = 0)",
  terms:[["R","the refraction correction — how much higher an object <em>appears</em> than its true, geometric position."],
         ["R_zenith = 0","straight overhead, light enters the atmosphere perpendicular to its layers and bends not at all."],
         ["R_horizon ≈ 35.4′","at the horizon, light grazes the atmosphere at the shallowest possible angle and bends the most — over half a degree."],
         ["30′","the Sun's (and Moon's) angular diameter — coincidentally close to the horizon refraction value, which is what makes the 'whole Sun after sunset' effect possible."]],
  why:["Earth's atmosphere is a stack of air layers that get denser toward the ground. Light bends whenever it crosses from one density to another at an angle — the same reason a straw looks bent in a glass of water. Looking straight up, light from a star crosses each layer head-on and bends by zero. Looking toward the horizon, that same light crosses each layer at a steep slant, and the bending compounds through the entire depth of atmosphere it must cross.",
       "This is why refraction isn't a fixed number — it depends entirely on how much atmosphere the light passes through, which depends on altitude above the horizon. It's zero at the zenith and grows, faster than linearly, as an object approaches the horizon, reaching its maximum, about 35.4′, exactly at the horizon itself.",
       "Now compare that to the Sun's own angular size: about 30′ across (Session 33 works this out properly for the Moon; the Sun is nearly the same apparent size — one of the more striking coincidences in the sky, and the reason solar eclipses can be total). 35.4′ of lift is bigger than the Sun's entire 30′ diameter.",
       "So: when the Sun's true, geometric position has already dropped up to about 20′ below the horizon (bringing its upper limb down to the horizon), refraction can still lift the <em>whole disc</em> back above it. You watch a complete, round Sun sitting on the horizon that is, geometrically, no longer there at all — you are seeing bent light, not the Sun's true direction.",
       "The same physics shortens both sunrise and sunset slightly relative to the pure geometry of Session 29's circumpolar calculation, which is exactly why real observatory calculations — like the Damavand Mountain problem — always fold in this 34′–35.4′ correction alongside the geometric one."]},
 fact:{body:["The 'green flash' — a real, photographable, brief green sliver at the very top of the setting Sun — happens because refraction bends different colours of light by very slightly different amounts, splitting the Sun's limb into a spectrum for a few seconds right at the horizon.",
  "Refraction also distorts shape, not just position: because the lower limb of the Sun is refracted more than the upper limb (it's nearer the horizon), the setting or rising Sun visibly flattens into an oval — you can see this with the naked eye on any clear evening.",
  "<em>Every sunset you've ever watched finished a few minutes 'late,' by geometry's clock. Your eyes were being lied to by physics the entire time — consistently, and predictably.</em>"]},
 drill:{q:"Looking at a star 45° above the horizon rather than at the zenith, refraction is:",opts:["Exactly the same, 0′","Larger than at the zenith but smaller than at the horizon","Larger than at the horizon","Undefined at that altitude"],truth:1},
 prompt:"Now that you know sunset is 'late,' does that change how you'd define the moment of sunset for a precise astronomical calculation?"},

{n:31,title:"Why the year has seasons",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"Earth's axis points at Polaris every single day of the year, without wavering. And yet six months from now, your hemisphere will be tilted the opposite way toward the Sun.",
 q:"Solstices and equinoxes happen because:",opts:["Earth's distance from the Sun changes through the year","Earth's spin axis stays fixed in space while Earth's position around the Sun changes","The Sun's own brightness varies seasonally","Earth's rotation speed changes"],truth:1,sim:"sky_tilt",
 notice:"Drag through the year. Watch the tilt arrow — it never turns. Only Earth's position around the Sun changes which hemisphere it points toward.",
 law:{name:"The ecliptic and axial tilt",eq:"δ_Sun(day) ≈ 23.4° · sin[2π(day − 79)/365.25]",
  terms:[["ecliptic","the Sun's apparent yearly path across the celestial sphere — really a reflection of Earth's own orbital plane."],
         ["23.4°","the tilt of the ecliptic relative to the celestial equator — identically, the tilt of Earth's spin axis relative to its orbital axis."],
         ["day 79","≈ 20 March, the vernal equinox (Session 28) — where this formula is anchored to δ = 0°, heading north."],
         ["δ_Sun","the Sun's declination on a given day — how far north or south of the celestial equator it currently sits."]],
  why:["Earth's spin axis behaves like a gyroscope: over the course of a single year, it points at essentially the same fixed direction in space (currently, near Polaris) no matter where Earth is in its orbit. This is the single fact the whole session rests on — the axis does not tilt toward or away from the Sun as the seasons change; it simply <em>stays put</em> while Earth moves around it.",
       "So the changing angle between 'my hemisphere' and 'the Sun' comes entirely from orbital position, not from the axis wobbling. When Earth sits on the side of its orbit where the fixed-direction north pole happens to lean toward the Sun, the northern hemisphere gets more direct sunlight and longer days — that's the northern summer solstice, around 21 June, when the Sun reaches +23.4° declination. Half an orbit later, the same fixed axis now leans away from the Sun — northern winter solstice, δ = −23.4°, around 21 December.",
       "Because Earth's equatorial plane is tilted 23.4° from its orbital plane, the Sun's apparent path (the ecliptic) is tilted 23.4° from the celestial equator, by the same geometry that makes the celestial equator itself an extension of Earth's own equator (Session 26). The Sun spends half the year north of the celestial equator, half south, crossing it at exactly two points — the equinoxes of Session 28.",
       "At an equinox, Earth's axis points neither toward nor away from the Sun — it points 'sideways,' perpendicular to the Sun-Earth line — so both hemispheres get equal illumination and day length is close to 12 hours everywhere on Earth. That's the literal meaning of equinox: 'equal night.'",
       "This also pins down exactly where the Sun sits overhead on each solstice: at the December solstice, the Sun is directly overhead at local noon only at latitude 23.4°S, the Tropic of Capricorn. The Persian tabeshband problem below is built entirely on tracking this one angle through the year at a fixed latitude."]},
 fact:{body:["The IOAA 2009 tabeshband problem puts real numbers on this: at latitude 36.0°N, the Sun stands 36.0° − 23.4° = 12.6° from the zenith at summer solstice noon, but 36.0° + 23.4° = 59.4° from the zenith at winter solstice noon — a 46.8° swing in the Sun's noon altitude across the year, from the same fixed spot on Earth, purely from this one 23.4° tilt appearing with opposite sign.",
  "Traditional Persian architects used exactly that swing: a tabeshband (shade structure) sized so summer's high, steep sun (12.6° from zenith) is blocked entirely, while winter's low, shallow sun (59.4° from zenith) reaches deep into the room — verified to save about <b>20%</b> on energy costs, centuries before anyone wrote down the trigonometry explaining why it worked.",
  "<em>Mars tilts 25.2°, oddly close to Earth's 23.4°, so Mars has genuine seasons too. Venus tilts only 2.6°, and essentially has none.</em>"]},
 drill:{q:"At latitude 36.0°N on the winter solstice at noon, the Sun's angle from the zenith is:",opts:["12.6°","36.0°","23.4°","59.4°"],truth:3},
 prompt:"If Earth's axial tilt were 0° instead of 23.4°, what would happen to seasons — and to the distinction between the ecliptic and the celestial equator?"},

{n:32,title:"The vocabulary of alignment",ioaa:"Ch. 3 — Geometric Astronomy and Time",tool:null,
 hook:"Venus never wanders far from the Sun in our sky — it's never up at midnight, never opposite the Sun. Mars, by contrast, can sit directly opposite it, visible dusk to dawn.",
 q:"Venus's greatest elongation is about 46°. This is possible for Venus but never for Mars because:",opts:["Venus is closer to the Sun than Earth is; Mars is farther","Venus is smaller","Venus orbits faster","Mars has no atmosphere"],truth:0,sim:"sky_elongation",
 notice:"Drag elongation to 46° and read off Venus's orbital radius. Then push past 90° and see why that's geometrically impossible for an inferior planet.",
 law:{name:"Elongation and the inferior-planet triangle",eq:"sin(elongation_max) = r_planet / r_Earth   (both from the Sun)",
  terms:[["elongation","the angular separation between a planet and the Sun, as seen from Earth."],
         ["conjunction","planet and Sun appear at (nearly) the same place in the sky — elongation ≈ 0°. Inferior planets (Mercury, Venus) have two kinds: <b>inferior conjunction</b> (planet between Earth and Sun) and <b>superior conjunction</b> (planet behind the Sun). Superior planets can only reach superior conjunction."],
         ["greatest elongation","the maximum angular separation an inferior planet ever reaches from the Sun, as seen from Earth — the best time to observe Mercury or Venus, since they're never buried in the Sun's glare there."],
         ["opposition","planet and Sun appear on opposite sides of the sky, elongation = 180°. Only possible for superior planets — an inferior planet, orbiting inside Earth's orbit, can never geometrically get behind Earth."]],
  why:["Draw the Sun, Earth, and an inferior planet (orbit radius smaller than Earth's) as a triangle. As the planet orbits, the angle at Earth — the elongation — grows from 0° (conjunction) to some maximum, then shrinks back to 0° at the other conjunction. It can never reach 90°, because once the Earth-planet line is tangent to the planet's orbit, that's as wide as the angle can get; past that point there's no orbital position left for the planet to swing further out.",
       "That tangent condition is a right angle at the planet itself (Earth–Venus–Sun = 90°), which turns the triangle into a simple right triangle: the far side (Venus-Sun, the orbital radius) equals sin(elongation) times the hypotenuse (Earth-Sun, 1 AU). Rearranged: r_Venus = 1 AU × sin(46°) ≈ <b>0.72 AU</b> — Venus's real orbital radius, recovered from a single angle measured entirely from Earth.",
       "A superior planet has no such ceiling, because Earth's orbit lies entirely inside its own — there's no tangent-line limit stopping the angle from growing all the way to 180°, which is opposition. This is also why only superior planets are ever visible all night: at opposition, the planet rises as the Sun sets and is up until dawn, directly overhead at local midnight.",
       "Mercury and Venus, by contrast, are geometrically bound to stay near the Sun in our sky — Mercury's elongation tops out around 28°, Venus's around 46°, and both set within a few hours of the Sun no matter the date. This is exactly why they only ever appear as 'morning star' or 'evening star,' hugging twilight, never visible at midnight.",
       "Note what this triangle needed as input: only the elongation angle, measured with nothing more than a protractor pointed at the sky. Compare Act I's parallax triangle — same right-triangle trick, a completely different pair of angles being exploited."]},
 fact:{body:["This is the exact method behind IOAA 2007's opening problem: measured elongation 46° in, orbital radius 0.72 AU out — no telescope resolution of Venus's disc required, no radar, just a protractor and trigonometry, and it's accurate to within 1% of Venus's true 0.723 AU.",
  "Ancient astronomers used greatest elongation as effectively their only tool for pinning down Mercury and Venus's orbits, centuries before anyone could measure a planet's distance directly — it's one of the oldest quantitative results in astronomy that still holds up exactly as originally derived.",
  "<em>Whether a planet can ever be 'up all night' is not a coincidence of brightness or size — it's a hard geometric fact set entirely by whether its orbit is smaller or larger than Earth's.</em>"]},
 drill:{q:"Mercury's greatest elongation is about 28°. Its orbital radius is closest to:",opts:["0.15 AU","0.31 AU","0.47 AU","0.72 AU"],truth:2},
 prompt:"Why do you think 'opposition' is the best time to observe Mars, but greatest elongation is the best time to observe Venus?"},

{n:33,title:"Half is always lit. Which half is the question.",ioaa:"Ch. 3 — Geometric Astronomy and Time",tool:null,
 hook:"Common wrong answer: 'phases are Earth's shadow on the Moon.' That's a lunar eclipse — a rare, different event. The truth is simpler and always in effect.",
 q:"At any given moment, how much of the Moon's surface is lit by the Sun?",opts:["It varies with phase, from 0% to 100%","Always very close to 50%, regardless of phase","Depends on Earth's shadow","Depends on the Moon's distance from Earth"],truth:1,sim:"sky_phases",
 notice:"Sweep the Moon around its orbit. The small icon's lit half never changes — but the big disc, showing the view from Earth, cycles through every phase.",
 law:{name:"Moon phase geometry",eq:"illuminated fraction seen from Earth, k = (1 + cos i) / 2",
  terms:[["i","the Sun–Moon–Earth phase angle — how far around its orbit the Moon has swung, from 'Moon on the far side of Earth from the Sun' (i=0°, full Moon) to 'Moon between Earth and Sun' (i=180°, new Moon)."],
         ["k","the fraction of the Moon's visible disc that appears lit, from Earth. k=1 is full, k=0 is new, k=0.5 is a quarter."],
         ["the misconception, corrected","Earth's shadow is <em>not</em> involved in ordinary phases. It only matters during a lunar eclipse, when Sun, Earth and Moon align almost exactly — a specific, rare geometry, not the everyday cause of phases."],
         ["what actually varies","not how much of the Moon is lit (always ~half), but how much of that lit half happens to face Earth."]],
  why:["The Moon does not emit light. Like every planet, it's visible purely because it reflects sunlight — and like any sphere lit by a single distant source, exactly one hemisphere is illuminated at any instant, the hemisphere currently facing the Sun. This never changes: half-lit, always, no matter where the Moon sits in its orbit.",
       "What changes is the angle between 'the half facing the Sun' and 'the half facing Earth.' At full Moon, the Moon is on the far side of its orbit from the Sun, so the same hemisphere faces both the Sun and, looking back, the Earth — the entire lit face looks straight at us, k=1. At new Moon, the Moon sits between Earth and Sun, so the hemisphere facing the Sun is the hemisphere facing <em>away</em> from Earth — we look at the dark far side, k=0.",
       "Between those extremes, the two hemispheres — lit and Earth-facing — overlap partially, giving crescents, quarters, and gibbous phases as the overlap grows or shrinks. The formula k=(1+cos i)/2 is just the geometry of that overlap: at i=90° (quarter phases), cos i=0, k=0.5, exactly half the visible disc lit, a clean terminator line straight down the middle.",
       "This cleanly separates phases (routine, monthly, pure illumination geometry, visible from anywhere the Moon is up) from eclipses (rare, requiring the Sun, Earth and Moon to line up almost exactly, which only happens when the Moon crosses the ecliptic plane near new or full phase — most months it passes slightly above or below Earth's shadow entirely).",
       "The same illumination logic explains angular size as a separate fact: at full Moon, the Moon subtends about 0.46° as seen from Earth (an IOAA 2007 problem works this out precisely from the Moon's real radius, 1.7374×10⁶ m, using β ≈ 2R_Moon/d). That size sets how big the phase disc looks, but has nothing to do with why phases occur — size and illumination are independent facts about the same object."]},
 fact:{body:["IOAA 2007's worked problem: a full Moon subtending 0.46° (0.00803 rad). Using the small-angle relation β ≈ 2R_Moon/d with R_Moon = 1.7374×10⁶ m gives d ≈ 4.3×10⁸ m — recovering the Earth-Moon distance from nothing but an angular measurement and the Moon's known radius.",
  "Because the Moon's orbit is tilted about 5° from the ecliptic, most new and full Moons narrowly miss a solar or lunar eclipse — direct proof that eclipses are a special-case alignment, not the routine mechanism behind ordinary phases.",
  "<em>Every planet and moon in the solar system shows phases by this identical logic</em> — Venus's phases, discovered by Galileo, were some of the first direct telescopic evidence that Venus orbits the Sun and not the Earth."]},
 drill:{q:"At first quarter Moon (i = 90°), what fraction of the visible disc is lit?",opts:["0%","25%","50%","100%"],truth:2},
 prompt:"Someone tells you phases are caused by Earth's shadow. In one sentence, what's the cleanest way to show them they're wrong?"},

{n:34,title:"The extra four minutes",ioaa:"Ch. 3 — Geometric Astronomy and Time",tool:null,
 hook:"Set a stopwatch running the instant a star crosses your meridian. It will cross again in 23h56m — four minutes before your clock says a full day has passed.",
 q:"A solar day is longer than a sidereal day because:",opts:["Earth's rotation is slowing down","While Earth spins once on its axis, it has also moved along its orbit, so it must turn a bit further for the Sun to return to the same spot","The Sun is much farther away than the stars","Sidereal days are only used by astronomers, not real time"],truth:1,sim:"sky_daylength",
 notice:"Rotate past 360°. The distant star realigns with you exactly there — the Sun needs a bit more.",
 law:{name:"Sidereal day vs. solar day",eq:"1 sidereal day = (365.25/366.25) × 24h ≈ 23h56m04s",
  terms:[["sidereal day","time for Earth to rotate once relative to the distant, essentially fixed stars."],
         ["solar day","time for Earth to rotate once relative to the Sun — the everyday 24-hour day your clock keeps."],
         ["why solar wins by ~4 min","Earth orbits the Sun (prograde, same direction as its spin) while it rotates, so after one full turn relative to the stars, it must rotate a little further before the Sun lines up again."],
         ["365.25 vs 366.25","in one year, Earth completes 365.25 solar days but 366.25 sidereal days — <em>exactly one extra rotation</em>, because Earth's own orbit adds one full turn's worth of 'catching up' over the year."]],
  why:["Picture Earth having just completed one full 360° spin relative to a distant star — the star is back on your meridian. But Earth hasn't stood still while spinning; it has also advanced along its orbit around the Sun. From your position, the Sun's direction has shifted slightly (about 360°/365.25 ≈ 0.9855° per day), so it is no longer exactly where it was a rotation ago. You must turn a little further to bring the Sun back onto your meridian.",
       "That 'little further' is 0.9855° of extra rotation, which at Earth's spin rate takes almost exactly 4 minutes (0.9855°/360° × 24h ≈ 3m56s). So: sidereal day = 23h56m04s, solar day = 24h00m00s, by definition — the solar day is what our clocks are built around.",
       "The cleanest way to see there's exactly one extra sidereal day per year: over 365.25 solar days, Earth rotates 365.25 times relative to the Sun, but the Sun itself has appeared to circle the sky once (Session 31's ecliptic) due to Earth's orbit — so relative to the stars, Earth has actually rotated 366.25 times. One year, one extra spin, always.",
       "This gives a neat trick for converting between the two: from noon on 1 July to noon on 31 December is exactly 183 solar days — but 183.5 <em>sidereal</em> days, because half a year has passed, so half of that 'extra spin' has accumulated too.",
       "IOAA 2012 pushes the idea further: if Earth spun the opposite direction (retrograde) at the same speed, the sidereal day would be unchanged (still 366.25 rotations per year, since orbital direction doesn't affect spin rate) — but now spin and orbit fight each other instead of cooperating, so there'd be one fewer solar day per year than sidereal days. Working the same arithmetic backward gives a solar day of 23h52m09.5s — <em>shorter</em> than the sidereal day, a complete reversal of which one wins."]},
 fact:{body:["This is why astronomical telescopes use sidereal clocks, not ordinary ones: a telescope tracking the stars must complete one rotation every 23h56m04s to stay locked onto a fixed point on the sky, not 24h00m00s — using a normal clock would let the target drift out of the eyepiece by a noticeable amount within weeks.",
  "The 4-minute gap accumulates visibly: a given star rises about 4 minutes earlier each night, 2 hours earlier each month, and a full 24 hours earlier after a year — which is exactly why the visible constellations cycle through the seasons.",
  "<em>Every clock on Earth quietly runs on solar time. The stars, meanwhile, keep sidereal time — about 4 minutes 'faster' every single day, forever.</em>"]},
 drill:{q:"Between noon on 1 July and noon on 31 December (183 solar days), how many sidereal days have passed?",opts:["183","183.5","184","182.5"],truth:1},
 prompt:"If you tracked a star with a clock running on ordinary 24-hour solar time instead of a sidereal clock, how far off would your telescope be after just one week?"},

{n:35,title:"How often the sky repeats itself",ioaa:"Ch. 3 — Geometric Astronomy and Time",tool:null,
 hook:"Mars was closest to Earth in 60,000 years on 27–28 August 2003. Astronomers had already worked out, from orbital periods alone, almost exactly when the next great opposition would fall — 8 August 2018.",
 q:"The synodic period of a planet — the time between two identical alignments with Earth and the Sun — depends on:",opts:["Only that planet's own orbital period","Only Earth's orbital period","Both the planet's period and Earth's period, combined","The planet's distance at closest approach"],truth:2,sim:"sky_synodic",
 notice:"Run time forward. Earth (inner) laps Mars (outer) roughly every 2.135 years — watch the purple 'opposition' line appear each time they align.",
 law:{name:"The synodic period relation",eq:"1/S = 1/E − 1/P (superior planets);   1/S = 1/E + 1/P (inferior planets)",
  terms:[["S","synodic period — time between two consecutive identical alignments (e.g. two oppositions, or two full Moons), as observed from Earth."],
         ["E","Earth's sidereal period, 1 year."],
         ["P","the other body's own sidereal period (true orbital period, measured against the stars)."],
         ["superior vs inferior","superior planets (Mars outward) orbit slower than Earth, so Earth 'laps' them — hence the minus sign. Inferior planets (Mercury, Venus) orbit faster than Earth and lap <em>it</em> — hence the plus sign."]],
  why:["A synodic period is fundamentally about relative angular speed, not either object's period alone. Earth sweeps around the Sun at 360°/E per year; Mars sweeps at 360°/P per year. Because Earth is faster (E < P for any superior planet), Earth gradually gains on Mars, and 'opposition' recurs whenever Earth has gained exactly one full lap on it.",
       "Angular speeds subtract when finding a relative rate: Earth's rate minus Mars's rate is 360°(1/E − 1/P) per year. The time for that relative gain to total a full 360° lap is exactly 1/(1/E − 1/P) — which is 1/S = 1/E − 1/P, rearranged.",
       "For an inferior planet like Venus, the roles flip: Venus is faster than Earth, so <em>Venus</em> laps <em>Earth</em>, and the same subtraction, done from Venus's point of view, flips the sign to 1/S = 1/E + 1/P.",
       "Worked exactly as IOAA 2012 does it: Mars's semi-major axis is 1.524 AU, so by Kepler's third law P²=a³, P_Mars = 1.524^1.5 = 1.88138 years. Then 1/S = 1/1 − 1/1.88138 = 0.4685, so S = 1/0.4685 ≈ <b>2.135 years</b> between consecutive Mars oppositions.",
       "That 2.135-year cadence is why great oppositions are rare and worth predicting precisely: from the confirmed great opposition at UT 17h56m on 28 August 2003, stepping forward by whole multiples of 2.135 years — 7 cycles ≈ 14.94 years — lands 21.4 days before 28 August 2018, i.e. almost exactly <b>8 August 2018</b>, matching the real recorded date to within a day."]},
 fact:{body:["Because Mars's orbit is noticeably elliptical, not every opposition is a 'great' one — Mars's closest approach to Earth varies between about 54 and 103 million km depending on where in its elliptical orbit the opposition happens to fall, and can occur up to 8.5 days away from the moment of exact opposition.",
  "The Moon's own synodic period — 29.53 days between full Moons — is why lunar calendars (like the Islamic Hijri calendar) drift against the solar year: 29.53 is neither a clean fraction of 365.25 nor equal to the Moon's true sidereal orbital period of 27.32 days, which is shorter, for exactly the same 'Earth also moved' reasoning as Session 34's solar day.",
  "<em>Every 'how often does this repeat' question in the solar system — full Moons, planetary oppositions, transits of Venus — reduces to this one relative-speed subtraction.</em>"]},
 drill:{q:"A hypothetical superior planet has a sidereal period of 4 years. Its synodic period is:",opts:["3 years","4/3 years","5 years","2 years"],truth:1},
 prompt:"Why do you think great oppositions of Mars are newsworthy events, but ordinary oppositions (every 2.135 years) barely make the news?"},

{n:36,title:"Whose noon is it, exactly",ioaa:"Ch. 3 — Geometric Astronomy and Time",tool:null,
 hook:"2:00 p.m. in Changi is not quite the same moment as 2:00 p.m. in Tuas — same city-state, same time zone, genuinely different solar time. Multiply that gap across a planet and you get chaos, unless everyone agrees on one shared clock.",
 q:"Universal Time (UT) exists mainly because:",opts:["Sundials are inaccurate","Astronomers need one shared, location-independent clock to describe when an event happened, anywhere on Earth","Mean solar time was made illegal","UT is more accurate than atomic clocks"],truth:1,sim:"sky_time",
 notice:"Fix UT and slide longitude across the globe. Watch local mean time change by exactly 4 minutes per degree of longitude — and find the one longitude where it's noon right now.",
 law:{name:"Apparent, mean, and Universal Time",eq:"local mean time = UT + longitude/15°   (east positive)",
  terms:[["apparent solar time","sundial time — literally the Sun's actual position, noon defined as the moment the Sun crosses your meridian. Varies slightly day to day, because Earth's orbit isn't a perfect circle and its axis is tilted (the same tilt from Session 31)."],
         ["mean solar time","clock time — the average length of a solar day over the year, smoothed out so every day is exactly the same length. This is what your watch actually shows."],
         ["time zones","a practical fix: instead of every longitude keeping a slightly different mean solar time, nearby longitudes agree to share one clock, usually rounded to the hour."],
         ["Universal Time (UT)","mean solar time at longitude 0° (Greenwich) specifically — for most purposes, the same as GMT. Astronomers use it so an event's reported time doesn't depend on where on Earth it was observed."]],
  why:["A sundial gives apparent solar time directly — but 'noon' by sundial doesn't fall exactly 24h00m00s apart every single day, because Earth's orbital speed varies slightly (faster near perihelion) and because the ecliptic's tilt means the Sun's eastward motion along it doesn't project evenly onto the celestial equator. These two effects combine into the equation of time, which can shift 'true noon' by up to about 16 minutes from clock noon depending on the date.",
       "Clocks that changed length every day would be unworkable, so mean solar time averages this out: it's built from a fictitious 'mean Sun' that moves at perfectly constant speed, giving every day exactly the same length. This mean solar time is what mechanical and digital clocks have always tracked.",
       "But mean solar time still depends on your exact longitude — Session 34's logic applies locally too, at 15° of longitude per hour (360°/24h). Two towns just 15° of longitude apart disagree on local noon by a full hour; even towns a few kilometres apart, like Changi and Tuas, disagree by seconds. Historically, every town ran its own clock, which was fine until railways and telegraphs made minute-level disagreement genuinely disruptive.",
       "Time zones are the practical compromise: group a band of longitudes and agree they all share one official clock, usually offset from UT by a whole (or half/quarter) number of hours. Singapore Time is UT+8 exactly, even though Singapore's true longitude, 103.8°E (Session 25), corresponds to a 'natural' mean solar time offset of 103.8/15 ≈ 6h55m, not a clean 8h. The extra offset is a political and practical choice, not an astronomical requirement.",
       "None of this works for coordinating a global science, though, so astronomers sidestep time zones entirely and report everything in UT — mean solar time at Greenwich specifically. It's the single reference every observer on Earth can convert into their own local time, but that everyone can also independently agree on without ambiguity, exactly like Session 25's Greenwich meridian is the single reference for longitude itself."]},
 fact:{body:["IOAA 2010 turns this into a prediction: Mars's great opposition on 28 August 2003 was recorded at precisely UT 17h56m — a single unambiguous timestamp usable by every observatory on the planet, from Chile to Beijing, without anyone needing to know each other's local clock.",
  "China spans roughly the same longitude range as the contiguous United States (about 60° of longitude, which is 4 solar hours) but keeps a single time zone, Beijing Time, UT+8 — meaning sunrise in far-western Xinjiang can trail sunrise in Shanghai by up to two hours of clock time, a purely political choice layered on top of the same physics.",
  "<em>Every 'what time did that supernova go off' in the astronomical literature is reported in UT — because the sky doesn't know what time zone you're standing in.</em>"]},
 drill:{q:"Singapore Time is UT+8. At UT 04:00, what is the local time in Singapore?",opts:["04:00","08:00","12:00","20:00"],truth:2},
 prompt:"You've now built the full toolkit — position (Sessions 25–31) and time (32–36). Which single idea from this act do you think matters most for planning a real observation?"}
];

/* ===== act4.js ===== */
const TOOLS_ACT4={
 greatcircle:{title:"Tool — great circles",
  body:"A <b>great circle</b> is the largest circle you can draw on a sphere — its centre coincides with the sphere's own centre. Earth's equator is a great circle; so is any circle running through both poles. Any smaller circle (a latitude line other than the equator) is not.<br><br>Great circles matter because they are the sphere's version of a straight line: the shortest path between two points on a sphere's surface always follows a great circle. Three great circles, crossing in pairs, build the 'basic triangle' used throughout this act — three vertices, three arc-sides, none of them straight."}
};
const SIMS_ACT4={

opt_diffraction:{ctrls:[{id:"D",label:"Aperture diameter",min:2,max:200,step:2,val:20,unit:" mm"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h*.46,lam=500e-9,Dm=v.D/1000,theta=1.22*lam/Dm;
  const pxRad=Math.min(90,Math.max(3,2000000*theta));
  for(let i=3;i>=1;i--){ctx.beginPath();ctx.arc(cx,cy,pxRad*i*0.85,0,7);
   ctx.strokeStyle=`rgba(169,114,255,${0.20/i})`;ctx.lineWidth=1;ctx.stroke()}
  blob(ctx,cx,cy,900,Math.max(3,pxRad*0.5));
  lbl(ctx,cx,cy+pxRad+30,`aperture D = ${v.D} mm`);
  v._theta=theta},
 read(v){return `A point of starlight spreads to an angular radius <b>θ ≈ ${(v._theta*206265).toFixed(2)}″</b><br><em>Shrink the aperture and the blur swells — no lens, however perfect, escapes this.</em>`}},

opt_rayleigh:{ctrls:[{id:"D",label:"Aperture diameter",min:5,max:150,step:5,val:30,unit:" mm"}],
 draw(ctx,w,h,v){const sepArcsec=1.4,cx=w/2,cy=h*.46,pxSep=70,lam=500e-9,Dm=v.D/1000;
  const theta=1.22*lam/Dm,thetaArcsec=theta*206265;
  const rad=Math.min(60,Math.max(4,300000*theta));
  blob(ctx,cx-pxSep/2,cy,600,rad);blob(ctx,cx+pxSep/2,cy,600,rad);
  const resolved=thetaArcsec<=sepArcsec;
  lbl(ctx,cx,cy+70,resolved?"resolved — two distinct images":"not resolved — merged into one blur",resolved?"#5FC8FF":"#FF7BA8");
  v._theta=thetaArcsec;v._resolved=resolved;v._sep=sepArcsec},
 read(v){return `Resolving angle <b>θ = ${v._theta.toFixed(2)}″</b> vs. true separation <b>${v._sep}″</b><br>${v._resolved?"<em>Just resolved or better — the Rayleigh criterion is met.</em>":"<em>The two Airy disks overlap too much to separate.</em>"}`}},

opt_exoplanet:{ctrls:[{id:"D",label:"Telescope diameter",min:1,max:12,step:.5,val:6,unit:" m"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h*.46,pxSep=50,lam=500e-9,thetaTrue=9.70e-8;
  const thetaRes=1.22*lam/v.D;
  const rad=Math.min(55,Math.max(4,9e7*thetaRes));
  blob(ctx,cx-pxSep/2,cy,700,rad);blob(ctx,cx+pxSep/2,cy,180,rad*.55,"95,200,255");
  const resolved=thetaRes<=thetaTrue;
  lbl(ctx,cx,cy+65,resolved?"star and planet resolved":"merged — planet lost in the glare",resolved?"#5FC8FF":"#FF7BA8");
  lbl(ctx,cx,cy+80,`D = ${v.D} m`,"#6E6699");
  v._resolved=resolved;v._thetaRes=thetaRes},
 read(v){return `Instrument resolving angle <b>θ = ${(v._thetaRes*206265*1000).toFixed(1)} mas</b> vs. the star-planet gap (≈20 mas)<br>${v._resolved?"<em>Above ~6 m aperture, the planet separates from its star.</em>":"<em>Below ~6 m, diffraction swallows the planet into the star's glow.</em>"}`}},

opt_radio:{ctrls:[{id:"lam",label:"Radio wavelength",min:.1,max:21,step:.1,val:1,unit:" cm"}],
 draw(ctx,w,h,v){const lamO=500e-9,Do=0.10,lamR=v.lam/100,Dr=Do*(lamR/lamO);
  const cx1=w*.28,cx2=w*.72,cy=h*.5,rOpt=18,rRad=Math.min(90,15*Math.log10(Dr/Do+1));
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx1,cy,rOpt,0,7);ctx.stroke();
  lbl(ctx,cx1,cy+rOpt+20,"optical, D = 10 cm","#5FC8FF");
  ctx.strokeStyle="#A972FF";ctx.beginPath();ctx.arc(cx2,cy,rRad,0,7);ctx.stroke();
  const label=Dr>=1?Dr.toFixed(0)+" m":(Dr*100).toFixed(0)+" cm";
  lbl(ctx,cx2,cy+rRad+20,`radio, D' = ${label}`,"#A972FF");
  v._Dr=Dr;v._label=label},
 read(v){return `To match a 10 cm optical telescope at λ = ${v.lam} cm, a radio dish needs <b>D' ≈ ${v._label}</b><br><em>Radio wavelengths run 10,000-100,000× longer than light — the aperture must grow to match.</em>`}},

opt_eye:{ctrls:[{id:"D",label:"Pupil diameter",min:2,max:8,step:.5,val:6,unit:" mm"}],
 draw(ctx,w,h,v){const lam=500e-9,Dm=v.D/1000,theta=1.22*lam/Dm,alpha=2.12e-4;
  const L=30,R=w-30,y=h*.5;axis(ctx,L,y,R,y);
  const X=t=>L+((Math.log10(t)+5)/2)*(R-L);
  const xa=X(alpha),xt=X(theta);
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xa,y-14);ctx.lineTo(xa,y+14);ctx.stroke();
  lbl(ctx,xa,y-20,"crater's angular size","#FF7BA8");
  ctx.strokeStyle="#5FC8FF";ctx.beginPath();ctx.moveTo(xt,y-14);ctx.lineTo(xt,y+14);ctx.stroke();
  lbl(ctx,xt,y+28,"your eye's limit","#5FC8FF");
  const resolved=theta<alpha;
  lbl(ctx,w/2,h-10,resolved?"resolvable by naked eye":"below the eye's limit",resolved?"#5FC8FF":"#6E6699");
  v._theta=theta;v._resolved=resolved},
 read(v){return `Eye's limit: <b>θ = ${(v._theta*206265).toFixed(1)}″</b> (pupil ${v.D} mm) vs. the crater's <b>${(2.12e-4*206265).toFixed(1)}″</b><br>${v._resolved?"<em>At a real 6 mm dark-adapted pupil, that 80 km crater is just within reach.</em>":"<em>Shrink the pupil and the same crater slips out of view.</em>"}`}},

opt_catalogue:{ctrls:[{id:"mode",label:"Naming convention",min:0,max:3,step:1,val:0,unit:""}],
 draw(ctx,w,h,v){const names=["Aldebaran","α Tauri","87 Tauri","HD 29139"];
  const tags=["proper name","Bayer designation","Flamsteed number","Henry Draper catalogue"];
  const c=tempColour(3900);blob(ctx,w/2,h*.42,700,40,c.join(","));
  ctx.fillStyle="#EFEBFF";ctx.font="600 16px 'IBM Plex Mono',monospace";ctx.textAlign="center";
  ctx.fillText(names[v.mode],w/2,h*.42+66);
  lbl(ctx,w/2,h*.42+86,tags[v.mode]);
  v._name=names[v.mode];v._tag=tags[v.mode]},
 read(v){return `Same star: <b>${v._name}</b> — ${v._tag}<br><em>Four naming systems, one object, each built for a different era's catalogue.</em>`}},

opt_greatcircle:{ctrls:[{id:"size",label:"Triangle size",min:10,max:150,step:5,val:80,unit:"°"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
  ctx.strokeStyle="#2C2352";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  const baseAngles=[-90,-90+v.size,-90+v.size*1.6];
  const pts=baseAngles.map(a=>{const rad=a*Math.PI/180;return[cx+R*Math.cos(rad),cy+R*Math.sin(rad)]});
  ctx.strokeStyle="#A972FF";ctx.lineWidth=1.6;
  for(let i=0;i<3;i++){const p1=pts[i],p2=pts[(i+1)%3];
   const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
   const dx=my-cy,dy=-(mx-cx),norm=Math.hypot(dx,dy)||1,bulge=8;
   const cxm=mx+dx/norm*bulge,cym=my+dy/norm*bulge;
   ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.quadraticCurveTo(cxm,cym,p2[0],p2[1]);ctx.stroke()}
  const labels=["A","B","C"];
  pts.forEach((p,i)=>{ctx.fillStyle="#5FC8FF";ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill();
   lbl(ctx,p[0]+(p[0]>cx?14:-14),p[1],labels[i],"#5FC8FF")});
  lbl(ctx,cx,cy+R+22,"three great circles, three vertices — the basic triangle")},
 read(v){return `Every side of this triangle is itself an arc of a great circle, so every "side" is also an angle, measured from the sphere's centre.<br><em>Stretch the spread and the triangle deforms — it is never made of straight lines.</em>`}},

opt_costriangle:{ctrls:[{id:"b",label:"Side b",min:5,max:90,step:1,val:40,unit:"°"},{id:"c",label:"Side c",min:5,max:90,step:1,val:50,unit:"°"},{id:"A",label:"Included angle A",min:5,max:175,step:1,val:90,unit:"°"}],
 draw(ctx,w,h,v){const toRad=d=>d*Math.PI/180;
  const b=toRad(v.b),c=toRad(v.c),A=toRad(v.A);
  const cosa=Math.cos(b)*Math.cos(c)+Math.sin(b)*Math.sin(c)*Math.cos(A);
  const a=Math.acos(Math.max(-1,Math.min(1,cosa)))*180/Math.PI;
  const cx=w*.5,cy=h*.52;
  const Ap=[cx,cy-60],Bp=[cx-70,cy+40],Cp=[cx+70,cy+40];
  ctx.strokeStyle="#A972FF";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(Ap[0],Ap[1]);ctx.lineTo(Bp[0],Bp[1]);ctx.lineTo(Cp[0],Cp[1]);ctx.closePath();ctx.stroke();
  lbl(ctx,Ap[0],Ap[1]-10,"A");lbl(ctx,Bp[0]-14,Bp[1]+14,"B");lbl(ctx,Cp[0]+14,Cp[1]+14,"C");
  lbl(ctx,(Bp[0]+Cp[0])/2,(Bp[1]+Cp[1])/2+18,`a = ${a.toFixed(1)}°`,"#5FC8FF");
  lbl(ctx,(Ap[0]+Bp[0])/2-16,(Ap[1]+Bp[1])/2,"c");
  lbl(ctx,(Ap[0]+Cp[0])/2+16,(Ap[1]+Cp[1])/2,"b");
  v._a=a},
 read(v){return `Sides b = ${v.b}°, c = ${v.c}°, included angle A = ${v.A}° → opposite side <b>a = ${(v._a||0).toFixed(1)}°</b><br><em>Two coordinates and the angle between them, turned into one angular separation.</em>`}},

opt_sinetriangle:{ctrls:[{id:"a",label:"Side a",min:5,max:90,step:1,val:40,unit:"°"},{id:"A",label:"Angle A (opposite a)",min:5,max:170,step:1,val:50,unit:"°"},{id:"B",label:"Angle B",min:5,max:170,step:1,val:70,unit:"°"}],
 draw(ctx,w,h,v){const toRad=d=>d*Math.PI/180;
  const k=Math.sin(toRad(v.a))/Math.sin(toRad(v.A));
  const sinb=Math.min(1,Math.max(-1,Math.sin(toRad(v.B))*k));
  const b=Math.asin(sinb)*180/Math.PI;
  const cx=w*.5,cy=h*.52;
  const Ap=[cx-70,cy+40],Bp=[cx+70,cy+40],Cp=[cx,cy-60];
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(Ap[0],Ap[1]);ctx.lineTo(Bp[0],Bp[1]);ctx.lineTo(Cp[0],Cp[1]);ctx.closePath();ctx.stroke();
  lbl(ctx,Ap[0]-14,Ap[1]+14,"A");lbl(ctx,Bp[0]+14,Bp[1]+14,"B");lbl(ctx,Cp[0],Cp[1]-10,"C");
  lbl(ctx,(Ap[0]+Bp[0])/2,(Ap[1]+Bp[1])/2+18,"c","#6E6699");
  lbl(ctx,(Bp[0]+Cp[0])/2+18,(Bp[1]+Cp[1])/2,`a = ${v.a}°`,"#A972FF");
  lbl(ctx,(Ap[0]+Cp[0])/2-18,(Ap[1]+Cp[1])/2,`b = ${b.toFixed(1)}°`,"#5FC8FF");
  v._b=b;v._k=k},
 read(v){return `sinA/sina = sinB/sinb = <b>${(v._k||0).toFixed(3)}</b> throughout → side b = <b>${(v._b||0).toFixed(1)}°</b><br><em>One ratio, fixed for the whole triangle — even though every "side" here is an angle.</em>`}},

opt_focallength:{ctrls:[{id:"d",label:"Star separation on chip",min:1,max:20,step:.1,val:3.86,unit:" mm"},{id:"phi",label:"Angular separation on sky",min:1,max:20,step:.1,val:5.13,unit:"°"}],
 draw(ctx,w,h,v){const f=(v.d/2)/Math.tan(v.phi*Math.PI/360);
  const L=50,R=w-40,cy=h/2,pxPerMm=6,half=Math.min(70,pxPerMm*v.d/2);
  ctx.strokeStyle="#2C2352";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(R,cy-90);ctx.lineTo(R,cy+90);ctx.stroke();
  lbl(ctx,R,cy-100,"CCD plane");
  ctx.fillStyle="#5FC8FF";[cy-half,cy+half].forEach(y=>{ctx.beginPath();ctx.arc(R,y,3.4,0,7);ctx.fill()});
  ctx.strokeStyle="rgba(169,114,255,.6)";ctx.beginPath();ctx.moveTo(L,cy);ctx.lineTo(R,cy-half);ctx.moveTo(L,cy);ctx.lineTo(R,cy+half);ctx.stroke();
  ctx.fillStyle="#EFEBFF";ctx.beginPath();ctx.arc(L,cy,3.4,0,7);ctx.fill();
  lbl(ctx,L,cy+16,"focal point");
  lbl(ctx,(L+R)/2,cy-half/2-10,`φ = ${v.phi}°`,"#A972FF");
  v._f=f},
 read(v){return `Chip separation <b>d = ${v.d} mm</b>, sky separation <b>φ = ${v.phi}°</b> → focal length <b>f = ${(v._f||0).toFixed(1)} mm</b> (${((v._f||0)/10).toFixed(1)} cm)<br><em>This is the Ursa Major calculation — Dubhe and Merak, one photograph, one focal length.</em>`}},

opt_error:{ctrls:[{id:"sep",label:"Star pair separation on chip",min:2,max:15,step:.5,val:3.86,unit:" mm"},{id:"err",label:"Measurement uncertainty",min:.05,max:.5,step:.05,val:.1,unit:" mm"}],
 draw(ctx,w,h,v){const relErr=100*v.err/v.sep;
  const L=30,R=w-30,y=h*.55,scale=(R-L-40)/15;
  axis(ctx,L,y,R,y);
  const x1=L+20,x2=x1+v.sep*scale;
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  const errPx=Math.max(2,v.err*scale);
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=1.4;
  [x1,x2].forEach(x=>{ctx.beginPath();ctx.moveTo(x-errPx/2,y-10);ctx.lineTo(x+errPx/2,y-10);ctx.stroke()});
  lbl(ctx,(x1+x2)/2,y+26,`separation ${v.sep} mm ± ${v.err} mm`);
  lbl(ctx,(x1+x2)/2,y-26,`relative error ≈ ${relErr.toFixed(1)}%`,"#A972FF");
  v._rel=relErr},
 read(v){return `Same absolute uncertainty (<b>±${v.err} mm</b>), different baseline (<b>${v.sep} mm</b>) → relative error <b>${(v._rel||0).toFixed(1)}%</b><br><em>Stretch the baseline and the same fixed error shrinks in proportion — farther-apart stars give a tighter focal length.</em>`}},

opt_pipeline:{ctrls:[{id:"f",label:"Focal length",min:20,max:400,step:5,val:100,unit:" mm"}],
 draw(ctx,w,h,v){const phi=5.13,d=2*v.f*Math.tan(phi*Math.PI/360);
  lbl(ctx,w*.22,22,"on the sky: φ = 5.13°");
  blob(ctx,w*.14,h*.5,500,10);blob(ctx,w*.30,h*.5,500,10);
  ctx.strokeStyle="rgba(169,114,255,.5)";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(w*.14,h*.5);ctx.lineTo(w*.30,h*.5);ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,w*.6,22,"on the chip");
  const ccx=w*.72,ccy=h*.5,pxPerMm=Math.min(30,(w*.32)/Math.max(d,1)),half=Math.min(80,pxPerMm*d/2);
  ctx.strokeStyle="#2C2352";ctx.strokeRect(ccx-90,ccy-50,180,100);
  ctx.fillStyle="#5FC8FF";[ccy-half,ccy+half].forEach(y=>{ctx.beginPath();ctx.arc(ccx,y,3.4,0,7);ctx.fill()});
  lbl(ctx,ccx,ccy+64,`d = ${d.toFixed(2)} mm`,"#5FC8FF");
  v._d=d},
 read(v){return `Focal length <b>f = ${v.f} mm</b> turns a fixed sky angle (φ = 5.13°) into a chip separation <b>d = ${(v._d||0).toFixed(2)} mm</b><br><em>The whole pipeline in one line: coordinates → cosine rule → φ → d = 2f·tan(φ/2) → f.</em>`}}
};
