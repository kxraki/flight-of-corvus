       "Session 24 will show this law is not a rule about the solar system specifically — it's Newton's gravitation (Session 17) plus circular-orbit balance (Session 18), generalised. Change the central mass, and the '1' in P²=a³ changes with it. That is how you weigh a world."]},
 fact:{body:["Check it against the outer planets: Neptune's a = 30.07 AU predicts P = 30.07^1.5 ≈ <b>164.9 years</b>. Its measured period is 164.8 years. Uranus: a=19.19 AU predicts 84.1 years against a measured 84.0. <em>The law was published in 1619, decades before Uranus or Neptune were even discovered.</em>",
  "The single-appearance comet problem in this chapter runs the law to its extreme: an object with aphelion 35,000 AU in the Oort cloud has a = 17,500 AU, giving P ≈ 2.3 million years — meaning about <b>1.2 million years</b> just to fall from the Oort cloud to the inner solar system once (Session 21).",
  "The law's reach goes well beyond comets. Every exoplanet's orbital size quoted in a discovery paper is typically <em>derived</em> from its measured period using this exact relation, run in reverse."]},
 drill:{q:"An asteroid has a semi-major axis of 4 AU. Its orbital period is closest to:",opts:["4 years","8 years","2 years","16 years"],truth:1},
 prompt:"You now have three quantities — period, distance, and nothing else — that fully pin down an orbit's size. What do you think this law can't tell you about an orbit's shape?"},

{n:16,title:"Three numbers, one shape",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Every ellipse looks different — some barely different from a circle, some a needle-thin sliver. Three numbers capture exactly which one you're looking at.",
 q:"An ellipse's semi-minor axis b, compared with its semi-major axis a, is always:",
 opts:["Larger than a","Equal to a","Smaller than or equal to a","Unrelated to a"],truth:2,sim:"orb_shape",
 notice:"Push eccentricity toward 0.9 while watching b. Then bring it back to 0 and check that b lands exactly on a.",
 law:{name:"The ellipse's shape parameters",eq:"f² = a² − b²      e = f / a",
  terms:[["a","semi-major axis — half the longest diameter."],
         ["b","semi-minor axis — half the shortest diameter. <b>Always no larger than a.</b>"],
         ["f","linear eccentricity — the distance from the centre C out to either focus. Same units as a and b."],
         ["e","eccentricity — the dimensionless <b>shape</b> number, ranging from 0 (a circle) up to just under 1 (an ever-thinner sliver)."]],
  why:["Draw an ellipse with centre C, and mark the two foci sitting on the major axis, symmetric about C. The distance from C to either focus is the linear eccentricity, f — it has the same units as a and b because it's a length, not a ratio.",
       "A line from the top of the minor axis down to either focus has length exactly a — a property of how an ellipse is built (the sum of distances to both foci from any point on the curve is always 2a; at the top of the minor axis, symmetry makes those two distances equal, so each is a). That segment, the semi-minor axis b, and the linear eccentricity f then form a right triangle. Pythagoras gives f² + b² = a², rearranged to <em>f² = a² − b²</em>.",
       "e is just f expressed as a fraction of a — how far the focus has wandered from the centre, relative to the ellipse's overall size. A circle has f=0 (the 'two' foci sit on top of each other, at the centre), so e=0. As e climbs toward 1, the foci push out toward the ends of the major axis and the ellipse flattens toward a line.",
       "This is Session 13's picture, quantified. The Sun sits at a focus displaced from the centre by f = ea — which is exactly why perihelion (a−f = a(1−e)) and aphelion (a+f = a(1+e)) differ."]},
 fact:{body:["Earth's orbit has e = <b>0.0167</b> — close enough to circular that b differs from a by less than 0.02%. Mercury, at e = 0.206, is the most eccentric planet in the solar system; Pluto (a dwarf planet since 2006) reaches e = 0.249, occasionally swinging inside Neptune's orbit.",
  "Trans-Neptunian object Sedna has e ≈ <b>0.85</b>, with an orbit so stretched its aphelion (around 940 AU) is roughly 27 times its perihelion (around 76 AU) — a foothold on the transition to the Oort cloud objects of Session 21.",
  "The IOAA comet problem (a = 16.0 AU, perihelion 0.5 AU) gives f = 16.0 − 0.5 = 15.5 AU, and then b = √(a²−f²) = √(256−240.25) ≈ <b>3.97 AU</b> — a sliver of an ellipse 32 AU long but under 8 AU wide."]},
 drill:{q:"An ellipse has a = 10 and e = 0.6. Its semi-minor axis b is:",opts:["10","8","6","4"],truth:1},
 prompt:"Why do you think astronomers bother separating 'size' (a) from 'shape' (e) instead of just quoting a and b?"},

{n:17,title:"The law behind the laws",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Kepler found three separate rules for how planets move, purely by staring at data. Newton found the one rule underneath all three.",
 q:"Doubling the distance between two masses changes the gravitational force between them by a factor of:",
 opts:["1/2","1/4","2","4"],truth:1,sim:"orb_newton",
 notice:"Hold separation fixed and drag B's mass up. Then hold mass fixed and drag separation out. Which one changes the force faster?",
 law:{name:"Newton's law of gravitation",eq:"Fg = G M₁M₂ / r²",
  terms:[["Fg","the gravitational force between the two bodies — attractive, and, by Newton's third law, identical in magnitude on both."],
         ["G","the gravitational constant, 6.6726 × 10⁻¹¹ N m² kg⁻². Universal — the same number for an apple and a galaxy."],
         ["M₁, M₂","the two masses. The force scales with <b>each</b> — double either one and the pull doubles."],
         ["r²","distance between centres, squared. <b>The same inverse-square shape as Act I's light law</b> — for the identical reason: something is spreading over the surface of a sphere."]],
  why:["Newton's insight, the story goes, began with a falling apple and a question: does whatever pulls the apple down also hold the Moon in its orbit? The answer required a force that reaches across empty space and weakens with distance in a very specific way.",
       "Why inverse-square specifically, rather than inverse-cube or inverse-linear? Newton showed that <em>only</em> an inverse-square central force produces a closed elliptical orbit that doesn't slowly rotate — Kepler's First Law is not compatible with any other power law. Get the force wrong and the ellipse doesn't close on itself, orbit after orbit.",
       "Kepler's Second Law falls out too, and more directly: gravity always points straight at the other body (a <em>central</em> force), so it can never give the planet a sideways twist. With no sideways force, the planet's rotational momentum about the Sun is conserved — and that conserved quantity is exactly twice the areal sweep rate of Session 14. <em>Equal areas in equal times is that conservation law, dressed in geometry.</em>",
       "And Kepler's Third Law is what you get when you require a stable orbit at all: set the gravitational pull equal to the centripetal force needed to hold a circular path (Session 18 works this out in full), and P² ∝ a³ drops straight out — with the missing constant of proportionality finally revealed as 4π²/GM.",
       "So Kepler spent decades reading three rules out of the sky. Newton, in 1687's <em>Principia</em>, showed they were never three rules — <em>they were one force, viewed from three angles.</em>"]},
 fact:{body:["G is the worst-measured of all fundamental constants — known to only about 1 part in 10,000, while other constants are pinned down to 1 part in a billion or better, because gravity is so weak that lab measurements are swamped by tiny stray effects. Henry Cavendish first measured it in 1798, using a torsion balance sensitive enough to detect the attraction between lead spheres.",
  "Because Fg scales with both masses, it is genuinely mutual: you pull on the Earth exactly as hard as the Earth pulls on you. The reason only you visibly accelerate is Newton's second law, not his law of gravitation — your mass is about 10²⁴ times smaller, so your acceleration is 10²⁴ times larger.",
  "The law is 'universal' in the most literal sense tested: it governs Cavendish's lab spheres, Newton's apple, the Moon's orbit, and — as measured by binary pulsar timing to extraordinary precision — pairs of neutron stars orbiting each other at a sizeable fraction of the speed of light."]},
 drill:{q:"Two masses are moved to 3× their original separation. The force between them becomes:",opts:["3× weaker","6× weaker","9× weaker","27× weaker"],truth:2},
 prompt:"Newton needed one law to explain three of Kepler's. What does that unification suggest about when a theory in physics is genuinely finished?"},

{n:18,title:"Gravity, doing double duty",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"An orbit is just a fall that keeps missing the ground — gravity supplying exactly the sideways pull needed to curve the path into a circle, forever.",
 q:"A heavier satellite, placed in the same circular orbit as a lighter one, orbits at:",
 opts:["A slower speed — more mass to move","A faster speed — more gravity acting on it","The same speed","It depends on the shape of the satellite"],truth:2,sim:"orb_circular",
 notice:"Fix the radius and drag the orbiting mass across its full range. Watch the speed number in the readout — does it move at all?",
 law:{name:"Circular orbit balance",eq:"GMm / r²  =  mv² / r    →    v² = GM / r",
  terms:[["GMm/r²","the gravitational force from Session 17, supplying the pull."],
         ["mv²/r","the centripetal force required to hold any mass m on a circular path of radius r at speed v — pure kinematics, nothing to do with gravity specifically."],
         ["m","the orbiting body's mass — <b>appears on both sides, and cancels.</b>"],
         ["v² = GM/r","what survives. <b>M is the central body's mass. The orbiting object's own mass has vanished from the answer entirely.</b>"]],
  why:["For a circular orbit, the net force on the planet must point toward the centre and have exactly the magnitude mv²/r — that's just what 'moving in a circle at constant speed' requires, true for anything from a planet to a swung conker on a string.",
       "Gravity is the only force acting here, so it must <em>be</em> that centripetal force: GMm/r² = mv²/r. If gravity pulled harder than this, the object would spiral inward; weaker, and it would spiral outward. This balance is the entire content of 'staying in a stable circular orbit.'",
       "Cancel one factor of m from both sides — it appears on the force side (from Newton's law) and again on the requirement side (from kinematics), so it drops out completely. What's left, v² = GM/r, depends only on the central mass M and the radius r. <em>A pebble and a planet, dropped into the same orbit, move at the identical speed.</em>",
       "This is the same cancellation, in spirit, that made Galileo's falling bodies land together regardless of mass — gravitational force is proportional to the falling object's mass, and so is its resistance to acceleration, so mass cancels out of the motion either way.",
       "Session 19 uses this same balance, run through energy instead of force, to find the speed at which an object stops orbiting and leaves entirely — escape velocity."]},
 fact:{body:["Every satellite at a given altitude — a tonne of scientific instruments or a spent rocket stage — moves at the same speed, which is precisely why geostationary satellites all sit at one specific altitude, 35,786 km, regardless of their individual mass: it's the only radius where v matches Earth's rotation.",
  "The IOAA problem from this chapter puts the balance to a very literal test: an astronaut on a 2.2 km asteroid needs 0.873 m/s to walk a full lap in 2.2 hours, but the asteroid's gravity (density 2200 kg/m³) only supplies 6.76 × 10⁻⁴ m/s² of pull against the 6.92 × 10⁻⁴ m/s² of centripetal acceleration required. <em>The astronaut cannot make the loop on foot — the asteroid's own gravity is too weak to hold a walking pace in a circle.</em>",
  "The ISS orbits at about 7.66 km/s at roughly 400 km altitude. Plug Earth's mass and that radius into v = √(GM/r) and you land on that number directly — no knowledge of the station's roughly 420-tonne mass required."]},
 drill:{q:"A satellite's orbital radius is quadrupled. Its orbital speed becomes:",opts:["4× larger","2× larger","Half as large","A quarter as large"],truth:2},
 prompt:"Why do you think this independence from mass surprises people more than the equivalent fact for falling objects?"},

{n:19,title:"Jumping off the world",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Stand on a small enough asteroid and an ordinary jump — the kind that barely clears a curb on Earth — is enough to leave it behind forever.",
 q:"Gravitational potential energy, U = −GMm/r, for an object near a planet is:",
 opts:["Always positive","Zero at the surface","Always negative","Positive far away, negative close up"],truth:2,sim:"orb_escape",
 notice:"Shrink the planet's radius down past about 1870 m, keeping density fixed at Earth's. Watch which bar — escape velocity or your jump — wins.",
 law:{name:"Escape velocity",eq:"½mv² − GMm/r = 0   (at the surface, aimed at just reaching infinity)",
  terms:[["U = −GMm/r","gravitational potential energy — <b>always negative</b>, for the same reason a debt is negative: it takes work to climb out of it, and 'zero' is defined as infinitely far away, where gravity's influence has faded to nothing."],
         ["½mv²","kinetic energy at the surface — <b>positive</b>, must supply exactly what's needed to climb out of the well."],
         ["0 at infinity","the target state — arriving infinitely far away with exactly zero velocity left. Any less and it never gets away; any more was overkill."],
         ["v_esc","the minimum surface speed for which this equation balances."]],
  why:["Total mechanical energy, kinetic plus potential, is conserved for an object under gravity alone. 'Just barely escaping' means reaching r = infinity with v = 0 — at that point both KE and U are zero, so total energy is zero. Since energy is conserved, it must also have been zero back at the surface.",
       "So: ½mvᵢ² − GMm/R = 0, where R is the planet's radius. Solve for vᵢ and the mass m of the escaping object cancels — exactly as in Session 18, escape velocity doesn't care what's trying to escape.",
       "Write M in terms of the planet's density: M = (4/3)πR³ρ. Substituting turns v_esc² = 2GM/R into v_esc² = (8/3)πGρR². <em>The escaping mass has vanished entirely, and now even the planet's total mass is gone — replaced by density and radius alone.</em>",
       "Which means: hold the density fixed (say, at Earth's roughly 5,000 kg/m³) and escape velocity is directly proportional to radius. Shrink the planet enough and eventually v_esc drops below any ordinary speed at all — even a human jump.",
       "Run the numbers for a person who can jump 0.5 m on Earth: that's a takeoff speed of about 3.13 m/s (from v²=u²+2as, with a=−9.81 m/s² and v=0 at the peak). Set v_esc = 3.13 m/s and solve for R and you get about <b>1.87 km</b>. Below that radius, jumping is enough to leave forever."]},
 fact:{body:["Earth's own escape velocity, at its real radius and density, is <b>11.2 km/s</b> — nothing a jump gets close to, which is exactly why we need rockets.",
  "Mars's moon Deimos, roughly 12 km across, has an escape velocity of only about <b>5.6 m/s</b> — genuinely close to human jumping range. A sufficiently enthusiastic astronaut on Deimos would need real caution about how hard they push off.",
  "This is also the equation behind gravitational slingshots. Voyager 1 and 2 used close flybys of Jupiter and Saturn to gain speed relative to the Sun without burning any fuel, borrowing a sliver of the giant planets' own orbital momentum — a trick only possible because the underlying energy bookkeeping is exact."]},
 drill:{q:"A planet has the same density as Earth but twice its radius. Its escape velocity, compared with Earth's, is:",opts:["The same","√2 times larger","2 times larger","4 times larger"],truth:2},
 prompt:"Before this session, did you think of gravity as something you could simply outrun with your legs? At what size does that stop sounding absurd?"},

{n:20,title:"The debt you pay in speed",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"A comet at perihelion crosses more sky in an hour than it will all year near aphelion. Nothing pushed it — the same conservation law explains both extremes.",
 q:"Compared with its speed at aphelion, a planet's speed at perihelion is:",
 opts:["Slower, since it has less far to fall","Faster","Identical — speed only depends on total energy","Impossible to say without its mass"],truth:1,sim:"orb_speed",
 notice:"Push eccentricity toward 0.9 and compare the two velocity arrows. At e=0, do they still differ?",
 law:{name:"Speed at the apsides",eq:"v_peri / v_ap = (1+e) / (1−e)",
  terms:[["apsides","perihelion and aphelion together — the two points where the planet's velocity is purely tangential (perpendicular to the line to the Sun), with no inward or outward component."],
         ["v_peri, v_ap","speed at perihelion and aphelion."],
         ["r_peri·v_peri = r_ap·v_ap","Session 14's equal-areas law, applied at the two apsides — where velocity is purely tangential, this is exact, not approximate."],
         ["(1+e)/(1−e)","the ratio that falls out once energy conservation is added in."]],
  why:["At perihelion and aphelion — and only there — the planet's velocity points exactly perpendicular to the Sun–planet line. That makes the instantaneous areal sweep rate simply ½·r·v at those two points, so Session 14's constant sweep rate gives r_peri·v_peri = r_ap·v_ap exactly.",
       "Now bring in energy. Total mechanical energy, ½v² − GM/r, is the same number at every point of the orbit (Session 19's conservation law, applied here instead of at infinity): ½v_peri² − GM/r_peri = ½v_ap² − GM/r_ap.",
       "Two equations, two unknowns. Substitute r_peri = a(1−e) and r_ap = a(1+e) from Session 16, use the first equation to write v_ap in terms of v_peri, and the algebra collapses to a clean ratio: <em>v_peri/v_ap = (1+e)/(1−e)</em>. At e=0 this is 1 — a circle has no 'fast' or 'slow' point at all, exactly as it should.",
       "Physically: potential energy U = −GMm/r is least negative (highest) at aphelion, where r is largest. Since total energy is fixed, kinetic energy must be lowest there. The planet has effectively spent kinetic energy climbing out to aphelion against gravity's pull, the way a ball thrown upward trades speed for height — and it gets that speed back on the way down to perihelion."]},
 fact:{body:["Earth's own numbers: about <b>30.29 km/s</b> at perihelion versus <b>29.29 km/s</b> at aphelion — only a 3.4% swing, because Earth's eccentricity is a mild 0.0167.",
  "Halley's Comet, at e ≈ 0.967, is the opposite extreme: roughly <b>54.5 km/s</b> at perihelion (just 0.586 AU out) against about <b>0.9 km/s</b> at aphelion (35.1 AU out) — a 60-fold difference between its fastest and slowest moments, all governed by the same equation.",
  "This is also the physics behind gravity-assist trajectories: a spacecraft timed to reach closest approach to a fast-moving planet picks up real momentum from the encounter — engineers are deliberately exploiting exactly this speed-versus-distance trade."]},
 drill:{q:"An orbit has e = 0.5. Perihelion speed compared with aphelion speed is:",opts:["1.5× faster","2× faster","3× faster","4× faster"],truth:2},
 prompt:"Kinetic energy 'borrowed' at perihelion gets 'repaid' climbing to aphelion. Where else in physics have you met this same borrow-and-repay pattern?"},

{n:21,title:"Where the comets sleep",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Most comets you'll ever hear about visit briefly and vanish for decades or millennia. They aren't leaving the solar system — they're going home.",
 q:"Long-period, single-appearance comets most likely originate from:",
 opts:["The asteroid belt","The Kuiper belt","The Oort cloud","Interstellar space, unrelated to the Sun"],truth:2,sim:"orb_farcountry",
 notice:"Slide from 1 AU out to 100,000 AU. Notice how much of the slider's range is the 'long emptiness' before you even reach the Oort cloud.",
 law:{name:"Structure of the outer solar system",eq:"asteroid belt (1.5–5.5 AU)  →  Kuiper belt (~30–50 AU)  →  Oort cloud (thousands–100,000+ AU)",
  terms:[["asteroid belt","rubble roughly between Mars (1.5 AU) and Jupiter (5.5 AU) that never coalesced into a planet — Jupiter's gravity kept stirring it up."],
         ["Kuiper belt","a donut-shaped ring of icy bodies around Neptune's orbit — source of most short-period comets, which return again and again on human timescales."],
         ["Oort cloud","a roughly spherical shell thought to hold around 2 trillion objects, extending halfway to the next star — source of long-period, single-appearance comets."],
         ["inner vs. outer Solar System","the asteroid belt is the traditional dividing line between the two."]],
  why:["The asteroid belt sits where a planet 'should' have formed, by simple spacing — but Jupiter's gravity, and the same Session 17 inverse-square pull that keeps planets on their tracks, kept stirring nearby material too fast and too often for it to accrete into a world. Session 23's resonance-driven Kirkwood gaps are part of the same story.",
       "Farther out, past Neptune, temperatures are low enough that ices survive as solids rather than boiling off — the Kuiper belt is the icy leftover construction material of the outer solar system, never swept up. Halley's Comet, at 75 years, is a classic short-period, Kuiper-family comet: it's been through the inner solar system dozens of times in recorded history and keeps coming back on a schedule.",
       "The Oort cloud is different in kind, not just distance: it's spherical, not flattened into a plane like the belt or the Kuiper ring, and it's so far out that Kepler's Third Law (Session 15) predicts orbital periods in the millions of years. An object with aphelion 35,000 AU has a semi-major axis of 17,500 AU, and P = 17,500^1.5 ≈ 2.3 million years — meaning a one-way trip in from the Oort cloud takes on the order of <b>1.2 million years</b>.",
       "That is why a long-period comet, once seen, is often never seen again on any human timescale — its orbit genuinely takes that long to complete, unlike a Kuiper-belt comet whose whole loop fits inside a human lifetime."]},
 fact:{body:["The Oort cloud was proposed by Dutch astronomer Jan Oort in 1950, based purely on the statistics of where long-period comets' orbits pointed when extrapolated backward — nobody has ever directly observed an Oort cloud object; its existence is inferred entirely from the orbits of the comets it occasionally releases.",
  "Voyager 1, the most distant human-made object, is over 160 AU from the Sun as of the mid-2020s and still hasn't reached interstellar space in any Oort-cloud sense — NASA estimates it would take roughly <b>300 years</b> just to reach the Oort cloud's inner edge, and about <b>30,000 years</b> to pass through it entirely.",
  "NASA's New Horizons flew past the Kuiper belt object Arrokoth in 2019, the most distant object ever closely imaged — a snapshot of the same icy leftover material this session describes, frozen since the solar system's formation 4.6 billion years ago."]},
 drill:{q:"A comet with a period of 75 years, returning reliably on a human timescale, most likely comes from:",opts:["The asteroid belt","The Kuiper belt","The Oort cloud","Interstellar space"],truth:1},
 prompt:"The Oort cloud has never been directly seen, only inferred. What kind of evidence would you find convincing enough to call it 'real'?"},

{n:22,title:"A name for wherever you're closest",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Every orbit has a nearest point and a farthest point. What you call them depends entirely on whose gravity you're caught in.",
 q:"The point in the Moon's orbit closest to Earth is called:",
 opts:["Perihelion","Perigee","Periastron","Pericentre"],truth:1,sim:"orb_names",
 notice:"Step through all four central bodies. Notice the pattern: the prefix never changes, only the ending.",
 law:{name:"Naming convention for orbital extremes",eq:"peri- (nearest) / apo- (farthest)  +  -helion / -gee / -astron / -centre",
  terms:[["peri-","Greek for 'near' — always the closest point to whatever is being orbited."],
         ["apo-","Greek for 'away from' — always the farthest point."],
         ["-helion","from <em>Helios</em>, the Sun — used only for objects orbiting the Sun."],
         ["-gee","from <em>Ge/Gaia</em>, the Earth — used for objects orbiting Earth, like the Moon or satellites."],
         ["-astron","'star' — used for orbits around any star that isn't the Sun."],
         ["-centre","the general-purpose term, for orbits around any centre of mass at all — a black hole, a galaxy, another planet's moon system."]],
  why:["None of this is new physics — Sessions 13 through 21 already cover everything about <em>why</em> a nearest and farthest point exist. This session is purely bookkeeping: the same two points show up in every orbit in the universe, and astronomers needed words for them that made clear, at a glance, which body was being orbited.",
       "The system is built from two independent pieces: a prefix that says <em>near or far</em>, and a suffix that says <em>orbiting what</em>. Learn the four suffixes and the vocabulary for any orbit in astronomy becomes immediate — you don't memorise eight words, you memorise two prefixes and four roots and combine them.",
       "The roots trace back to Greek: <em>helios</em> for Sun, <em>ge</em> for Earth, <em>astron</em> for star. Where no specific body is named — orbiting a black hole, a galaxy's centre, an exoplanet's own star treated generically — astronomers fall back to the body-agnostic <em>-centre</em>.",
       "Get comfortable moving between these, because Sessions 23 and 24 both work with orbits that aren't around the Sun — moons around Jupiter, in particular — where -helion would simply be the wrong word to use."]},
 fact:{body:["The Moon's own perigee is about <b>356,500 km</b> from Earth and its apogee about <b>406,700 km</b> — a 14% swing that's the entire physical basis of the 'supermoon' phenomenon: a full Moon that happens to land near perigee looks measurably larger and brighter than one near apogee.",
  "The star S2, orbiting the supermassive black hole at the centre of our galaxy, has its closest approach described not as periastron but as <em>pericentre</em>, since the object it orbits is a black hole, not a star — S2 swings to within about 120 AU of Sagittarius A* at closest approach, moving at nearly 3% of the speed of light. Reinhard Genzel and Andrea Ghez shared half of the 2020 Nobel Prize in Physics largely for tracking orbits like this one.",
  "Spacecraft orbiting other planets get their own generic vocabulary too, by extension of the same logic — 'periapsis' and 'apoapsis' are the terms mission engineers use for any orbit, precisely so they don't have to invent a new suffix for every new moon or planet visited."]},
 drill:{q:"A spacecraft's closest approach to Mars is best called its:",opts:["Perigee","Perihelion","Periastron","Periapsis / pericentre — Mars has no dedicated term"],truth:3},
 prompt:"If humans establish a permanent base orbiting Mars, do you think a Mars-specific term (like '-gee' for Earth) would eventually catch on? What would you propose?"},

{n:23,title:"Locked in step",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"Watch Jupiter's four brightest moons over a single night and a pattern emerges: some visibly leap between frames, others barely creep. They are not moving independently.",
 q:"In the Galilean moons' 1:2:4 resonance, for every single orbit Ganymede completes, Io completes:",
 opts:["1","2","4","It varies"],truth:2,sim:"orb_resonance",
 notice:"Let time run out to 20 days. Watch Io lap Europa, and Europa lap Ganymede, on a strict, repeating schedule.",
 law:{name:"The Laplace resonance",eq:"P(Io) : P(Europa) : P(Ganymede)  ≈  1 : 2 : 4",
  terms:[["Io","innermost of the four Galilean moons, period ≈ 1.77 days — <b>fastest</b>, per Session 18: smaller orbit, higher speed."],
         ["Europa","period ≈ 3.55 days — almost exactly double Io's."],
         ["Ganymede","period ≈ 7.15 days — almost exactly double Europa's, and quadruple Io's."],
         ["Callisto","period ≈ 16.7 days — the outermost Galilean moon, and <b>not</b> locked into this particular resonance."]],
  why:["Newton's law of gravitation (Session 17) applies just as well to Jupiter and its moons as to the Sun and its planets — a scaled-down solar system, with Jupiter's mass replacing the Sun's in every formula from Sessions 15 and 18. The moons closer to Jupiter orbit faster, exactly as Session 18 requires.",
       "Left alone, there's no reason three periods should land in a clean 1:2:4 ratio — that takes active enforcement. Every time Io and Europa align, Io feels a small extra tug from Europa; every time Europa and Ganymede align, Europa feels one too. Because the periods are near-integer ratios, these tugs land at the <em>same point</em> in each moon's orbit repeatedly, instead of averaging away — and a repeated nudge in the same direction, however small, accumulates.",
       "This is a self-reinforcing trap: get close to a 1:2:4 ratio and the repeated tugs nudge the orbits <em>toward</em> exact resonance rather than away from it. Once locked, the shared gravitational bookkeeping between the three moons holds the ratio essentially fixed for as long as the system is left undisturbed.",
       "Pierre-Simon Laplace worked out the mathematics of this three-body lock in 1784, more than a century after the law of gravitation that makes it possible — which is why it's called the Laplace resonance today."]},
 fact:{body:["The resonance isn't just a curiosity — it's the reason Io is the most volcanically active body in the entire solar system. Europa's gravity keeps tugging Io's orbit very slightly elliptical, refusing to let it settle into a perfect circle, so Jupiter's tidal pull flexes Io's interior differently at perihelion than at aphelion every single orbit. That relentless flexing generates enough internal heat to power hundreds of active volcanoes, observed directly by the Voyager and Galileo missions.",
  "Resonances shape the wider solar system too. Pluto and Neptune sit in a 2:3 resonance — Pluto completes 2 orbits for every 3 of Neptune's — which is precisely what lets Pluto's path cross inside Neptune's orbit without ever colliding, since the two are never near each other at the crossing point. And Kirkwood gaps in the asteroid belt (Session 21) are conspicuous <em>empty</em> zones at Jupiter resonances like 3:1, where the repeated tug flings material out rather than locking it in.",
  "Galileo Galilei discovered Io, Europa, Ganymede, and Callisto in January 1610 — the first moons ever found orbiting a planet other than Earth, and among the first observational evidence that not everything in the sky circles the Earth."]},
 drill:{q:"If Ganymede completes 3 orbits, how many orbits will Io complete in that same time, under the 1:2:4 resonance?",opts:["3","6","9","12"],truth:3},
 prompt:"A resonance is a coincidence that gravity actively maintains rather than destroys. What does that suggest about how 'stable' the solar system really is?"},

{n:24,title:"Weighing a world",ioaa:"Ch. 1 — Celestial Mechanics",tool:null,
 hook:"You cannot put a planet on a scale. You can time something orbiting it — and that turns out to be exactly the same thing.",
 q:"To find the mass of a planet using nothing but observation, the single most direct method is to:",
 opts:["Estimate its size and guess its density","Time the orbit of anything circling it, at a known distance","Measure its surface gravity by landing on it","Compare its brightness with the Sun's"],truth:1,sim:"orb_weighing",
 notice:"Leave the sliders at the Moon's real numbers first — semi-major axis 384,400 km, period 655 hours — and check what mass comes out.",
 law:{name:"The generalised Kepler's Third Law",eq:"GM / a³  =  4π² / P²      →      M = 4π²a³ / (GP²)",
  terms:[["M","mass of the <b>central</b> body — the one being orbited. This is the unknown the whole session solves for."],
         ["a","semi-major axis of the orbit, in metres."],
         ["P","orbital period, in seconds."],
         ["G","Newton's gravitational constant, 6.6726 × 10⁻¹¹ N m² kg⁻² (Session 17) — the one number that makes this equation absolute, rather than relative to Earth like Session 15's version."]],
  why:["Session 15's P² ∝ a³ hid its constant of proportionality by comparing everything to Earth. Session 18 shows exactly where that constant comes from: balance gravity against the centripetal requirement for a circular orbit, GMm/r² = mv²/r, and with v = 2πr/P (distance around the circle, divided by time to cover it), the orbiting mass m cancels just as it always does, leaving GM/a³ = 4π²/P².",
       "Rearranged for M, this says: <em>measure any two things — how far something orbits and how long it takes — and the mass being orbited falls straight out, no matter what that mass actually is.</em> You never need to touch the central body, weigh it, or even know what it's made of.",
       "This is genuinely how planetary masses are found. Before a single spacecraft ever visited another planet, astronomers already knew Jupiter's mass to good precision — from timing the Galilean moons of Session 23, plugged directly into this formula.",
       "It scales up without limit. The same equation, applied to a star's orbit around the centre of a galaxy, weighs the galaxy. Applied to a star's orbit around an apparently empty point at the centre of the Milky Way, it revealed a black hole of about 4.3 million solar masses — Sagittarius A*, confirmed largely through orbits like S2's, from Session 22.",
       "Twelve sessions ago, Act I ended by asking how a smudge of light reveals a star's true nature. Act II closes the same way, on gravity: <em>an orbit's size and period are all it takes to weigh whatever sits at its centre — from a moon, to a planet, to a black hole nobody has ever seen directly.</em>"]},
 fact:{body:["Run the Moon's real numbers — a = 384,400 km, P = 27.3 days (655 hours) — through this formula and out comes Earth's mass, essentially independent of any measurement of Earth itself: about <b>5.97 × 10²⁴ kg</b>. Cavendish's 1798 torsion-balance experiment, often nicknamed 'weighing the Earth,' actually measured G directly and combined it with a known surface value of g — a different route to the identical number.",
  "Pluto's mass was only pinned down precisely after Charon, its large moon, was discovered in 1978 — timing Charon's orbit around their common centre gave a mass for the Pluto–Charon system far more accurate than any estimate that came before. NASA's New Horizons mission refined it further during its 2015 flyby.",
  "Every exoplanet mass reported alongside a discovery ultimately traces back to a version of this equation — either the orbit of the planet around its star, or (for the star's own mass) the star's position in the Hertzsprung–Russell diagram from Act I, Session 12. <em>The whole of orbital mechanics keeps circling back to the same move: time something, measure its distance, and let gravity confess what you could never touch.</em>"]},
 drill:{q:"A moon orbits a planet at a=20,000 km with a period of 10 hours. Roughly which order of magnitude, in kilograms, is the planet's mass?",opts:["10²² kg","10²⁴ kg","10²⁶ kg","10²⁸ kg"],truth:1},
 prompt:"Look back across all twelve sessions of Act II. Which single idea did the most work — the one thing you'd keep if you could only keep one?"}

/* ===== act3.js ===== */
const SIMS_ACT3 = {
sky_latlong:{ctrls:[{id:"lat",label:"Latitude",min:-90,max:90,step:.1,val:1.33,unit:"°"},{id:"lon",label:"Longitude",min:-180,max:180,step:.1,val:103.8,unit:"°"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
  ctx.strokeStyle="#2C2352";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,R,R*.22,0,0,7);ctx.stroke();
  [30,60].forEach(ld=>{const rl=ld*Math.PI/180,yy1=cy-R*Math.sin(rl),yy2=cy+R*Math.sin(rl),rx=R*Math.cos(rl);
   ctx.beginPath();ctx.ellipse(cx,yy1,rx,rx*.22,0,0,7);ctx.stroke();
   ctx.beginPath();ctx.ellipse(cx,yy2,rx,rx*.22,0,0,7);ctx.stroke()});
  ctx.beginPath();ctx.ellipse(cx,cy,R*.22,R,0,0,7);ctx.stroke();
  const latR=v.lat*Math.PI/180,lonR=v.lon*Math.PI/180;
  const mx=cx+R*Math.cos(latR)*Math.sin(lonR),my=cy-R*Math.sin(latR);
  blob(ctx,mx,my,80,7,"95,200,255");lbl(ctx,mx,my+18,"you are here","#5FC8FF");
  lbl(ctx,cx,cy+R+18,"equator, 0° latitude")},
 read(v){return `Position <b>${Math.abs(v.lat).toFixed(2)}°${v.lat>=0?"N":"S"}, ${Math.abs(v.lon).toFixed(2)}°${v.lon>=0?"E":"W"}</b>.<br><em>Hwa Chong sits at 1.33°N, 103.80°E — barely off the equator, deep into the Eastern hemisphere.</em>`}},

sky_sphere:{ctrls:[{id:"dec",label:"Declination",min:-90,max:90,step:1,val:0,unit:"°"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
  ctx.strokeStyle="#2C2352";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  ctx.setLineDash([3,4]);ctx.beginPath();ctx.ellipse(cx,cy,R,R*.16,0,0,7);ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,cx,cy+14,"celestial equator, δ=0°");
  lbl(ctx,cx,cy-R-10,"NCP");lbl(ctx,cx,cy+R+14,"SCP");
  const decR=v.dec*Math.PI/180,sx=cx,sy=cy-R*Math.sin(decR);
  ctx.strokeStyle="rgba(169,114,255,.5)";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(sx,sy);ctx.stroke();ctx.setLineDash([]);
  blob(ctx,sx,sy,90,8,"169,114,255");lbl(ctx,sx+34,sy,"star","#A972FF");
  const sirD=-16.72*Math.PI/180,polD=89.26*Math.PI/180;
  blob(ctx,cx+30,cy-R*Math.sin(sirD),40,5);lbl(ctx,cx+30,cy-R*Math.sin(sirD)+13,"Sirius","#6E6699");
  blob(ctx,cx-30,cy-R*Math.sin(polD),40,5);lbl(ctx,cx-30,cy-R*Math.sin(polD)-10,"Polaris","#6E6699")},
 read(v){return `Declination <b>${v.dec>=0?"+":""}${v.dec}°</b>.<br><em>Objects north of the celestial equator get positive δ, exactly like latitude — except you are standing at the centre of this sphere, not on its surface.</em>`}},

sky_radec:{ctrls:[{id:"ra",label:"Right ascension",min:0,max:24,step:.1,val:6,unit:"h"},{id:"dec",label:"Declination",min:-90,max:90,step:1,val:20,unit:"°"}],
 draw(ctx,w,h,v){const L=40,R=w-16,T=18,B=h-30;
  axis(ctx,L,B,R,B);axis(ctx,L,B,L,T);
  for(let i=0;i<=24;i+=4){const x=L+(i/24)*(R-L);axis(ctx,x,B,x,B+5);lbl(ctx,x,B+16,i+"h")}
  for(let d=-90;d<=90;d+=30){const y=T+(1-(d+90)/180)*(B-T);axis(ctx,L-5,y,L,y)}
  const ex=L+(v.ra/24)*(R-L),ey=T+(1-(v.dec+90)/180)*(B-T);
  const eqx=L+(0/24)*(R-L),eqy=T+(1-(0+90)/180)*(B-T);
  blob(ctx,eqx,eqy,60,7,"169,114,255");lbl(ctx,eqx,eqy-14,"♈ RA=0","#A972FF");
  blob(ctx,ex,ey,120,10,"95,200,255");
  lbl(ctx,w/2,h-6,"RA →")},
 read(v){return `RA <b>${v.ra.toFixed(1)}h</b>, Dec <b>${v.dec>=0?"+":""}${v.dec}°</b>.<br><em>Together these pin the star's place exactly the way longitude and latitude pin a place on Earth — except this grid doesn't spin with the planet.</em>`}},

sky_equinox:{ctrls:[{id:"hour",label:"Earth's rotation (hours elapsed)",min:0,max:24,step:.5,val:0,unit:"h"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
  ctx.strokeStyle="#2C2352";ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  for(let i=0;i<24;i+=2){const a=i/24*2*Math.PI-Math.PI/2,x1=cx+Math.cos(a)*R,y1=cy+Math.sin(a)*R,x2=cx+Math.cos(a)*(R+8),y2=cy+Math.sin(a)*(R+8);axis(ctx,x1,y1,x2,y2)}
  const eqA=-Math.PI/2,eqx=cx+Math.cos(eqA)*R,eqy=cy+Math.sin(eqA)*R;
  blob(ctx,eqx,eqy,90,8,"169,114,255");lbl(ctx,eqx,eqy-16,"♈ RA=0, fixed forever","#A972FF");
  ctx.strokeStyle="#5FC8FF";ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,15,0,7);ctx.stroke();
  const rot=v.hour/24*2*Math.PI,mx=cx+Math.cos(rot-Math.PI/2)*24,my=cy+Math.sin(rot-Math.PI/2)*24;
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(mx,my);ctx.stroke();
  lbl(ctx,mx,my+14,"your meridian","#FF7BA8");
  lbl(ctx,cx,cy+36,"Earth spins underneath the grid")},
 read(v){return `Earth has turned <b>${v.hour}h</b>.<br>Your local meridian sweeps past every RA mark in a day — but the RA grid itself, anchored to the vernal equinox, never moves. <em>That's why RA works as a catalogue coordinate and your local "straight up" doesn't.</em>`}},

sky_circumpolar:{ctrls:[{id:"lat",label:"Your latitude",min:0,max:90,step:1,val:1,unit:"°N"}],
 draw(ctx,w,h,v){const L=w*.38,R=w*.62,T=18,B=h-20;
  const decToY=d=>T+(1-(d+90)/180)*(B-T),bound=90-v.lat;
  ctx.fillStyle="rgba(95,200,255,.16)";ctx.fillRect(L,decToY(90),R-L,decToY(bound)-decToY(90));
  ctx.fillStyle="rgba(255,123,168,.14)";ctx.fillRect(L,decToY(-bound),R-L,decToY(-90)-decToY(-bound));
  ctx.strokeStyle="#2C2352";ctx.strokeRect(L,T,R-L,B-T);
  ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(L,decToY(0));ctx.lineTo(R,decToY(0));ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,(L+R)/2,decToY(0)-6,"celestial equator");
  ctx.strokeStyle="#5FC8FF";ctx.beginPath();ctx.moveTo(L-6,decToY(bound));ctx.lineTo(R+6,decToY(bound));ctx.stroke();
  lbl(ctx,(L+R)/2,decToY(bound)-6,"circumpolar boundary","#5FC8FF");
  blob(ctx,(L+R)/2,decToY(89.26),50,5);lbl(ctx,R+22,decToY(89.26),"Polaris","#6E6699");
  blob(ctx,(L+R)/2,decToY(-16.72),50,5);lbl(ctx,R+18,decToY(-16.72),"Sirius","#6E6699");
  lbl(ctx,L-18,T+4,"+90°");lbl(ctx,L-18,B-4,"−90°")},
 read(v){const bound=(90-v.lat).toFixed(1);return `At latitude <b>${v.lat}°N</b>, anything with declination above <b>+${bound}°</b> never sets.<br><em>Polaris (+89.3°) is barely circumpolar this far south — from Singapore it grazes the horizon every day.</em>`}},

sky_refraction:{ctrls:[{id:"d",label:"Sun's true (geometric) depression",min:0,max:60,step:1,val:20,unit:"′"}],
 draw(ctx,w,h,v){const cx=w*.5,hzY=h*.55,L=20,R=w-20,scale=2.3;
  ctx.fillStyle="rgba(44,35,82,.35)";ctx.fillRect(0,hzY,w,h-hzY);
  axis(ctx,L,hzY,R,hzY);lbl(ctx,R-30,hzY-8,"horizon");
  const trueY=hzY+v.d*scale,refr=35.4,appDep=refr-v.d,appY=hzY-appDep*scale;
  ctx.strokeStyle="rgba(169,114,255,.5)";ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(cx,trueY,9,0,7);ctx.stroke();ctx.setLineDash([]);
  lbl(ctx,cx,trueY+18,"true geometric position","#A972FF");
  const eyeX=L+6,eyeY=hzY,kinkX=cx-40;
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(eyeX,eyeY);ctx.lineTo(kinkX,hzY);ctx.lineTo(cx,trueY);ctx.stroke();
  blob(ctx,eyeX,eyeY,30,5);lbl(ctx,eyeX,eyeY+16,"you");
  const c=tempColour(5800),ay=Math.max(appY,14);
  blob(ctx,cx,ay,260,16,`${c[0]},${c[1]},${c[2]}`);
  lbl(ctx,cx,ay-22,"apparent position","#FF7BA8");
  v._app=appDep},
 read(v){const a=v._app,vis=a>=15?"the WHOLE disc clears the horizon":a>=-15?"part of the disc still peeks above":"it's fully hidden — refraction can't lift it that far";
  return `True centre: <b>${v.d}′ below</b> horizon. Refraction lifts it <b>35.4′</b>. Apparent: <b>${a.toFixed(1)}′ ${a>=0?"above":"below"}</b> horizon.<br>Since the Sun spans about 30′, ${vis}. <em>You are watching bent light, not a body that hasn't moved.</em>`}},

sky_tilt:{ctrls:[{id:"day",label:"Day of year (0 = 1 Jan)",min:0,max:365,step:1,val:172,unit:""}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=Math.min(w,h)*.34;
  blob(ctx,cx,cy,400,20,"255,196,110");lbl(ctx,cx,cy+30,"Sun");
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.setLineDash([]);
  const ang=-Math.PI/2+2*Math.PI*(v.day-79)/365,ex=cx+R*Math.cos(ang),ey=cy+R*Math.sin(ang);
  blob(ctx,ex,ey,60,9,"95,200,255");
  const tiltAng=-Math.PI/2-.41,tx=ex+18*Math.cos(tiltAng),ty=ey+18*Math.sin(tiltAng);
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(tx,ty);ctx.stroke();
  lbl(ctx,tx,ty-8,"N pole → Polaris","#FF7BA8");
  [[79,"Mar eq"],[172,"Jun sol"],[266,"Sep eq"],[355,"Dec sol"]].forEach(([d])=>{const a=-Math.PI/2+2*Math.PI*(d-79)/365,mx=cx+R*Math.cos(a),my=cy+R*Math.sin(a);
   ctx.fillStyle="#4A4370";ctx.beginPath();ctx.arc(mx,my,3,0,7);ctx.fill()});
  v._dec=23.4*Math.sin(2*Math.PI*(v.day-79)/365)},
 read(v){return `Day <b>${v.day}</b> → Sun's declination <b>${v._dec.toFixed(1)}°</b>.<br>Notice the tilt arrow never changes direction — it always points at Polaris. Only Earth's <em>position</em> in orbit changes, so first one hemisphere leans in, then the other. <em>Seasons are geometry, not distance.</em>`}},

sky_elongation:{ctrls:[{id:"beta",label:"Elongation angle",min:10,max:89,step:1,val:46,unit:"°"}],
 draw(ctx,w,h,v){const sunX=w*.22,earthX=w*.82,cy=h*.55,AU=earthX-sunX;
  axis(ctx,sunX,cy,earthX,cy);lbl(ctx,(sunX+earthX)/2,cy+16,"1 AU, Sun–Earth");
  blob(ctx,sunX,cy,500,22,"255,196,110");lbl(ctx,sunX,cy+34,"Sun");
  blob(ctx,earthX,cy,80,10,"95,200,255");lbl(ctx,earthX,cy+22,"Earth");
  const beta=v.beta*Math.PI/180,r=Math.sin(beta),rr=r*AU;
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(sunX,cy,rr,0,7);ctx.stroke();ctx.setLineDash([]);
  const vx=sunX+rr*Math.cos(beta),vy=cy-rr*Math.sin(beta);
  ctx.strokeStyle="rgba(169,114,255,.6)";ctx.beginPath();ctx.moveTo(sunX,cy);ctx.lineTo(vx,vy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(earthX,cy);ctx.lineTo(vx,vy);ctx.stroke();
  blob(ctx,vx,vy,60,8,"255,123,168");lbl(ctx,vx,vy-14,"Venus","#FF7BA8");
  lbl(ctx,earthX-40,cy-14,`β=${v.beta}°`,"#A972FF");
  v._r=r},
 read(v){return `Elongation <b>${v.beta}°</b> → Venus's orbital radius <b>${v._r.toFixed(2)} AU</b>.<br>At β=46°, that's <b>0.72 AU</b> — Venus's real orbit. <em>A single angle, measured from Earth, pins down another planet's entire orbital radius.</em>`}},

sky_phases:{ctrls:[{id:"ang",label:"Moon's orbital position",min:0,max:360,step:5,val:90,unit:"°"}],
 draw(ctx,w,h,v){const cx=w*.26,cy=h*.52,R=64,r=9;
  for(let i=0;i<5;i++){const yy=cy-56+i*28;ctx.strokeStyle="rgba(255,196,110,.3)";ctx.beginPath();ctx.moveTo(4,yy);ctx.lineTo(cx-R-14,yy);ctx.stroke()}
  lbl(ctx,40,cy-72,"sunlight","#FFC46E");
  blob(ctx,cx,cy,260,15,"95,200,255");lbl(ctx,cx,cy+26,"Earth");
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.setLineDash([]);
  const a=v.ang*Math.PI/180,mx=cx+R*Math.cos(a),my=cy+R*Math.sin(a);
  ctx.save();ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.clip();
  ctx.fillStyle="#241c3f";ctx.fillRect(mx-r,my-r,2*r,2*r);
  ctx.fillStyle="#EFEBFF";ctx.fillRect(mx-r,my-r,r,2*r);
  ctx.restore();
  ctx.strokeStyle="#4A4370";ctx.beginPath();ctx.arc(mx,my,r,0,7);ctx.stroke();
  const k=(1+Math.cos(a))/2,px=w*.76,py=h*.5,pr=42;
  ctx.save();ctx.translate(px,py);ctx.beginPath();ctx.arc(0,0,pr,0,7);ctx.clip();
  ctx.fillStyle="#241c3f";ctx.fillRect(-pr,-pr,2*pr,2*pr);
  ctx.fillStyle="#EFEBFF";ctx.fillRect(0,-pr,pr,2*pr);
  if(k>=.5){ctx.fillStyle="#EFEBFF";ctx.beginPath();ctx.ellipse(0,0,pr*(2*k-1),pr,0,0,7);ctx.fill()}
  else{ctx.fillStyle="#241c3f";ctx.beginPath();ctx.ellipse(0,0,pr*(1-2*k),pr,0,0,7);ctx.fill()}
  ctx.restore();
  ctx.strokeStyle="#4A4370";ctx.beginPath();ctx.arc(px,py,pr,0,7);ctx.stroke();
  lbl(ctx,px,py+pr+16,"seen from Earth");
  lbl(ctx,cx,cy-R-14,"orbit, top-down view");
  v._k=k},
 read(v){const pct=Math.round(v._k*100),name=v._k>.97?"full":v._k<.03?"new":v._k>.53?"gibbous":v._k<.47?"crescent":"quarter";
  return `Illuminated fraction seen from Earth: <b>${pct}%</b> (${name}).<br><em>Half the Moon is always lit — the phase only tracks how much of that lit half faces us.</em> No shadow of Earth involved — that's a lunar eclipse, a rare, separate event.`}},

sky_daylength:{ctrls:[{id:"deg",label:"Earth's rotation",min:0,max:370,step:2,val:0,unit:"°"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,R=40,t=v.deg/360;
  const starA=0,sunA=starA+(t*360/365.25)*Math.PI/180+.6,merA=t*2*Math.PI;
  blob(ctx,cx,cy,300,18,"95,200,255");
  const mx=cx+R*Math.cos(merA),my=cy+R*Math.sin(merA);
  ctx.strokeStyle="#FF7BA8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(mx,my);ctx.stroke();
  lbl(ctx,mx,my+14,"you, facing out","#FF7BA8");
  const farR=w*.42,sxg=cx+farR*Math.cos(starA),syg=cy+farR*Math.sin(starA);
  blob(ctx,sxg,syg,90,7);lbl(ctx,sxg,syg+16,"distant star, fixed");
  const sunR=w*.30,sux=cx+sunR*Math.cos(sunA),suy=cy+sunR*Math.sin(sunA);
  blob(ctx,sux,suy,260,12,"255,196,110");lbl(ctx,sux,suy+16,"Sun","#FFC46E");
  v._t=t},
 read(v){const t=v._t;return `Earth has spun <b>${(t*360).toFixed(0)}°</b>.<br>`+(t<1?"Not yet a full turn relative to the star.":t<1+1/365.25*.999?"A full sidereal turn is done — but the Sun has drifted, so it isn't noon yet.":"The Sun is caught up too — a full solar day, about <b>4 minutes</b> longer than the sidereal day.")+` <em>Because Earth also moved along its orbit while spinning.</em>`}},

sky_synodic:{ctrls:[{id:"yr",label:"Time elapsed",min:0,max:4.5,step:.05,val:0,unit:" yr"}],
 draw(ctx,w,h,v){const cx=w/2,cy=h/2,Re=44,Rm=68;
  blob(ctx,cx,cy,500,20,"255,196,110");lbl(ctx,cx,cy+30,"Sun");
  ctx.strokeStyle="#2C2352";ctx.setLineDash([2,4]);
  ctx.beginPath();ctx.arc(cx,cy,Re,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,Rm,0,7);ctx.stroke();ctx.setLineDash([]);
  const t=v.yr,earthA=t*2*Math.PI/1,marsA=t*2*Math.PI/1.88138;
  const ex=cx+Re*Math.cos(earthA),ey=cy+Re*Math.sin(earthA);
  const mx=cx+Rm*Math.cos(marsA),my=cy+Rm*Math.sin(marsA);
  blob(ctx,ex,ey,90,8,"95,200,255");lbl(ctx,ex,ey+16,"Earth");
  blob(ctx,mx,my,70,7,"255,123,168");lbl(ctx,mx,my+16,"Mars","#FF7BA8");
  const diff=((marsA-earthA)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const aligned=diff<.09||diff>2*Math.PI-.09;
  if(aligned){ctx.strokeStyle="#A972FF";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Rm*1.15*Math.cos(earthA),cy+Rm*1.15*Math.sin(earthA));ctx.stroke();
   lbl(ctx,cx+Rm*1.25*Math.cos(earthA),cy+Rm*1.25*Math.sin(earthA),"OPPOSITION","#A972FF")}
  v._aligned=aligned},
 read(v){return `t = <b>${v.yr.toFixed(2)} yr</b>. Earth laps Mars roughly every <b>2.135 yr</b> — that's the synodic period.<br>`+(v._aligned?"<em>Aligned now — this is an opposition, Mars closest and brightest.</em>":"Watch the gap between them shrink and reopen. When it closes, that's opposition.")}},

sky_time:{ctrls:[{id:"ut",label:"Universal Time (UT)",min:0,max:24,step:.25,val:4,unit:"h"},{id:"lon",label:"Your longitude",min:-180,max:180,step:1,val:103.8,unit:"°"}],
 draw(ctx,w,h,v){const L=30,R=w-16,T=24,B=h-30;
  axis(ctx,L,B,R,B);
  for(let lo=-180;lo<=180;lo+=60){const x=L+((lo+180)/360)*(R-L);axis(ctx,x,B,x,B-6);lbl(ctx,x,B+14,lo+"°")}
  let subLon=((12-v.ut)*15+540)%360-180;
  const sx=L+((subLon+180)/360)*(R-L);
  ctx.strokeStyle="rgba(255,196,110,.5)";ctx.beginPath();ctx.moveTo(sx,T);ctx.lineTo(sx,B);ctx.stroke();
  blob(ctx,sx,T+10,300,10,"255,196,110");lbl(ctx,sx,T+28,"Sun overhead, noon","#FFC46E");
  const gx=L+((0+180)/360)*(R-L);lbl(ctx,gx,B+30,"Greenwich, UT");
  const px=L+((v.lon+180)/360)*(R-L);
  blob(ctx,px,B-24,120,9,"95,200,255");
  const localT=((v.ut+v.lon/15)%24+24)%24,hh=Math.floor(localT),mm=Math.round((localT-hh)*60);
  lbl(ctx,px,B-40,`local ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`,"#5FC8FF");
  v._local=localT},
 read(v){const hh=Math.floor(v._local),mm=Math.round((v._local-hh)*60);
  return `At UT ${v.ut.toFixed(1)}h, longitude ${v.lon.toFixed(1)}° reads local mean time <b>${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}</b>.<br><em>Every astronomer on Earth, whatever their local clock says, agrees on the UT.</em>`}}

};
const SESSIONS_ACT3 = [
{n:25,title:"Fixing a point on a spinning ball",ioaa:"Ch. 2 — Celestial Coordinate Systems",tool:null,
 hook:"Hwa Chong Institution sits at 1°19′33″ N, 103°48′11.5″ E — coordinates precise enough to find one building among 150 million square kilometres of land.",
 q:"Two numbers are needed to fix a point on Earth's surface. What determines the ZERO line for longitude, unlike latitude's equator?",
 opts:["Physics — it's where Earth's spin axis crosses the surface","An arbitrary human choice — the meridian through Greenwich","The Sun's position at noon on 1 January","Magnetic north"],truth:1,sim:"sky_latlong",
 notice:"Drag latitude and longitude until the marker sits over Hwa Chong's real coordinates: 1.33°N, 103.80°E.",
 law:{name:"Geographic coordinates",eq:"position = (latitude φ, longitude λ)",
  terms:[["φ (latitude)","angular distance north/south of the equator, 0° to 90°. The equator is latitude 0° by definition — the one circle picked out by geometry itself: perpendicular to the spin axis, equidistant from both poles."],
         ["λ (longitude)","angular distance east/west of a reference meridian, 0° to 180°. A meridian is a great circle running pole to pole."],
         ["the reference meridian","fixed by treaty at Greenwich, England, in 1884. Nothing in Earth's shape picks this out — it could have been anywhere."],

  why:["Latitude has a natural zero because Earth's rotation supplies one: the equator is the unique circle equidistant from both poles, perpendicular to the spin axis. Any observer with a plumb line and a protractor can find it without consulting anyone else — measure the elevation of the celestial pole above your horizon (Session 26 shows why that angle equals your latitude exactly).",
       "Longitude has no such physical anchor. Spin the Earth and every meridian looks like every other meridian — there is no rotational feature that marks one of them as special. So the zero line for longitude has to be an agreement, not a discovery.",
       "That agreement was the 1884 International Meridian Conference, which put longitude zero through the Royal Observatory in Greenwich — mostly because by then the majority of the world's shipping already used British nautical charts. It was a vote, not a measurement.",
       "Hwa Chong's own coordinates show both ideas at once: 1°19′33″ N is measured — a fact about the school's angular distance from a physically real equator. 103°48′11.5″ E is measured against an arbitrary starting line, the same way you'd measure distance from milepost zero on a highway someone else built.",
       "Longitude is sometimes given in hours instead of degrees — 360° = 24h, so Hwa Chong's 103.8032° is also 6h55m12.8s E. That conversion is not decoration: Session 27 turns right ascension into exactly this kind of time-based angle, for exactly the same reason — Earth's rotation converts angle into time automatically."]},
 fact:{body:["The Greenwich meridian itself has moved. Modern GPS coordinates are referenced to a global ellipsoid (WGS84) whose zero meridian sits about <b>102 metres east</b> of the brass line tourists straddle at the Royal Observatory — the original was fixed by a specific 19th-century telescope, GPS by satellites averaging the whole Earth.",
  "Before 1884, ships navigated by dozens of competing zero meridians — Paris, Cadiz, Rome, Philadelphia — because there was no penalty for disagreeing about something arbitrary. It took the practical chaos of international shipping and telegraphy to force a single choice.",
